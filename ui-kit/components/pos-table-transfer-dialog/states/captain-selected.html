<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>POS Table Transfer Dialog / captain-selected</title>
<link rel="stylesheet" href="../../../tokens/css/ury-v16/ury-fonts.css">
<link rel="stylesheet" href="../../../tokens/css/ury-v16/ury-ui-tokens.css">
<link rel="stylesheet" href="../../../tokens/css/ury-v16/ury-ui-base.css">
<link rel="stylesheet" href="../../../tokens/css/ury-v16/components/pos-dialogs.css">
<style>html,body{margin:0}body{background:hsl(var(--background));min-height:900px}#ui-kit-stage{position:absolute;left:0;top:0;width:1440px;height:900px}*{animation:none!important;transition:none!important;caret-color:transparent!important}</style></head>
<body>
<div id="ui-kit-stage">
<div class="u-dialog-wrap pd" data-ui="pos-table-transfer-dialog" style="width:1440px;height:900px"><div class="u-dialog-scrim"></div><div class="u-dialog pd-dlg--lg pd-dlg--scroll" role="dialog" aria-modal="true" data-ui="dialog"><button type="button" class="u-dialog-close" aria-label="Close"><svg class="lucide lucide-x" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button><div class="u-dialog-header" data-ui="header"><h2 class="u-dialog-title">Transfer captain</h2><p class="u-dialog-desc">Choose a new captain for this order</p></div><div class="pd-body"><label class="pd-label">Current captain</label><input class="pd-input pd-input--search pd-input--mb4" type="text" value="sara.captain@example.com" readonly data-ui="current"><input class="pd-input pd-input--search pd-input--mb3" type="search" placeholder="Search by name or email" value="" data-ui="search"><div class="pd-list pd-scroll64" data-ui="options"><button type="button" class="u-btn u-btn--ghost pd-opt" aria-pressed="false" data-ui="captain-1"><div><p class="pd-opt__name">Omar Nasser</p><p class="pd-opt__sub">omar.nasser@example.com</p></div></button><button type="button" class="u-btn u-btn--ghost pd-opt is-sel" aria-pressed="true" data-ui="captain-2"><div><p class="pd-opt__name">Layla Haddad</p><p class="pd-opt__sub">layla.haddad@example.com</p></div></button><button type="button" class="u-btn u-btn--ghost pd-opt" aria-pressed="false" data-ui="captain-3"><div><p class="pd-opt__name">Yusuf Rahman</p><p class="pd-opt__sub">yusuf.rahman@example.com</p></div></button></div></div><div class="u-dialog-footer" data-ui="footer"><button type="button" class="u-btn u-btn--outline" data-ui="cancel">Cancel</button><button type="button" class="u-btn u-btn--default" data-ui="confirm">Transfer</button></div></div></div>
</div>
</body></html>
