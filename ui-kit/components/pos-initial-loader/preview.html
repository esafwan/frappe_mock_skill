<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>POS initial loader</title>
<link rel="stylesheet" href="../../tokens/css/ury-v16/ury-fonts.css">
<link rel="stylesheet" href="../../tokens/css/ury-v16/ury-ui-tokens.css">
<link rel="stylesheet" href="../../tokens/css/ury-v16/ury-ui-base.css">
<link rel="stylesheet" href="../../tokens/css/ury-v16/components/pos-shell.css">
<link rel="stylesheet" href="../../tokens/css/ury-v16/components/pos-misc.css">
<style>html,body{margin:0}body{background:hsl(var(--background));min-height:900px}#ui-kit-stage{position:absolute;left:0;top:0;width:1440px;height:900px}*{animation:none!important;transition:none!important;caret-color:transparent!important}</style></head>
<body>
<div id="ui-kit-stage">
<div class="u-screen pmx" data-ui="pos-initial-loader" style="width:1440px;height:900px;position:relative;overflow:hidden"><div class="pmx__loader" data-ui="loader"><div><div role="status" aria-live="polite"><div><div class="pmx__ring pmx__ring--12" aria-hidden="true" data-ui="spinner"></div><p class="pmx__spinmsg">Loading...</p></div></div><p class="pmx__loader-t">Loading URY POS...</p><p class="pmx__loader-s">Please wait while we set things up</p></div></div></div>
</div>
</body></html>
