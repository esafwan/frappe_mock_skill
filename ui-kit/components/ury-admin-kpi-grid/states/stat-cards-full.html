<div class="ud-stat ud-stat--primary" data-ui="ury-admin-kpi-grid.card-orders"><div class="ud-stat__top"><span class="ud-stat__label">Orders Today</span><span class="ud-stat__chip ud-stat__chip--primary"><svg class="lucide lucide-receipt" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"/><path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8"/><path d="M12 17.5v-11"/></svg></span></div><div class="ud-stat__value">128</div><div class="ud-stat__delta ud-stat__delta--up"><span aria-hidden="true">▲</span><span>+8.1%</span></div></div>
