<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>URY landscape kiosk order status / add-more</title>
<link rel="stylesheet" href="../../../tokens/css/ury-v16/ury-fonts.css">
<link rel="stylesheet" href="../../../tokens/css/ury-v16/ury-ui-tokens.css">
<link rel="stylesheet" href="../../../tokens/css/ury-v16/ury-ui-base.css">
<link rel="stylesheet" href="../../../tokens/css/ury-v16/components/kiosk-landscape.css">
<style>html,body{margin:0}body{background:hsl(var(--background));min-height:1080px}#ui-kit-stage{position:absolute;left:0;top:0;width:1920px;height:1080px}*{animation:none!important;transition:none!important;caret-color:transparent!important}</style></head>
<body>
<div id="ui-kit-stage">
<div class="u-screen kl" data-ui="ury-kiosk-screen-landscape-status" style="width:1920px;height:1080px;position:relative;overflow:hidden"><div class="kl-root"><header class="kl-head" data-ui="ury-kiosk-screen-landscape-status.header"><h1 class="kl-title">Order for Pickup</h1><button type="button" class="kl-new" data-ui="ury-kiosk-screen-landscape-status.new-order">New Order</button></header><div class="kl-fill"><div class="kl-st" data-ui="ury-kiosk-screen-landscape-status.status"><h1 class="kl-st__h1">Order confirmed</h1><p class="kl-st__p">Thanks — your order has been sent to the restaurant.</p>
<div class="kl-st__code" data-ui="ury-kiosk-screen-landscape-status.pickup"><div class="kl-st__codel">Pickup code</div><div class="kl-st__coden">K-482</div></div>
<div class="kl-st__rows"><div class="kl-st__row" data-ui="ury-kiosk-screen-landscape-status.order-status"><span class="kl-muted">Order status</span><b>Submitted</b></div><div class="kl-st__row" data-ui="ury-kiosk-screen-landscape-status.bill-status"><span class="kl-muted">Bill status</span><b>Not billed yet</b></div></div><div class="kl-st__acts"><button type="button" class="kl-st__more" data-ui="ury-kiosk-screen-landscape-status.add-more">Add more items</button><button type="button" class="kl-st__done" data-ui="ury-kiosk-screen-landscape-status.done">Done</button></div></div></div></div></div>
</div>
</body></html>
