<div class="u-screen kl" data-ui="ury-kiosk-screen-landscape-status" style="width:1920px;height:1080px;position:relative;overflow:hidden"><div class="kl-root"><header class="kl-head" data-ui="ury-kiosk-screen-landscape-status.header"><h1 class="kl-title">{{title}}</h1><button type="button" class="kl-new" data-ui="ury-kiosk-screen-landscape-status.new-order">{{new_order}}</button></header><div class="kl-fill"><div class="kl-st" data-ui="ury-kiosk-screen-landscape-status.status"><h1 class="kl-st__h1">{{confirmed}}</h1><p class="kl-st__p">{{thanks}}</p>
<div class="kl-st__code" data-ui="ury-kiosk-screen-landscape-status.pickup"><div class="kl-st__codel">{{pickup_label}}</div><div class="kl-st__coden">{{pickup_code}}</div></div>
<div class="kl-st__rows"><div class="kl-st__row" data-ui="ury-kiosk-screen-landscape-status.order-status"><span class="kl-muted">{{order_status_label}}</span><b>{{order_status}}</b></div><div class="kl-st__row" data-ui="ury-kiosk-screen-landscape-status.bill-status"><span class="kl-muted">{{bill_status_label}}</span><b>{{bill_status}}</b></div></div><div class="kl-st__acts"><button type="button" class="kl-st__done" data-ui="ury-kiosk-screen-landscape-status.done">{{done}}</button></div></div></div></div></div>
