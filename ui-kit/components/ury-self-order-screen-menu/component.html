<div class="u-screen so som " data-ui="ury-self-order-screen-menu" style="width:390px;height:844px;position:relative;overflow:hidden"><div class="som-menu"><header class="som-head" data-ui="ury-self-order-screen-menu.header"><h1 class="som-head__t">{{table}}</h1><button type="button" class="som-start">{{start_over}}</button></header>
<section class="som-order" data-ui="ury-self-order-screen-menu.order"><h2 class="som-order__h">{{order_title}}</h2>
<ul class="som-rows"><li><span>{{o1_name}} × {{o1_qty}}</span><span>{{o1_amount}}</span></li><li><span>{{o2_name}} × {{o2_qty}}</span><span>{{o2_amount}}</span></li></ul><div class="som-total"><span>{{total_label}}</span><span>{{order_total}}</span></div></section>
<nav class="so so-tabs" aria-label="Menu categories" data-ui="ury-self-order-screen-menu.tabs"><button type="button" class="so-chip so-chip--on" data-ui="ury-self-order-category-tabs.all">{{all}}</button><button type="button" class="so-chip so-chip--off" data-ui="ury-self-order-category-tabs.chip-1">{{cat_1}}</button><button type="button" class="so-chip so-chip--off" data-ui="ury-self-order-category-tabs.chip-2">{{cat_2}}</button><button type="button" class="so-chip so-chip--off" data-ui="ury-self-order-category-tabs.chip-3">{{cat_3}}</button><button type="button" class="so-chip so-chip--off" data-ui="ury-self-order-category-tabs.chip-4">{{cat_4}}</button><button type="button" class="so-chip so-chip--off" data-ui="ury-self-order-category-tabs.chip-5">{{cat_5}}</button></nav><div class="som-search"><div class="so-search" data-ui="ury-self-order-screen-menu.search"><div class="so-search__box">
<span class="so-search__icon so-muted" style="color:hsl(var(--muted-foreground))"><svg class="lucide lucide-search" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21 21-4.34-4.34"/><circle cx="11" cy="11" r="8"/></svg></span>
<input class="so-search__input" type="text" readonly aria-label="Search menu" placeholder="{{placeholder}}" value="">
</div></div></div>
<div class="som-grid" data-ui="ury-self-order-screen-menu.grid"><button type="button" class="so-pc so-pc--mobile" data-ui="ury-self-order-screen-menu.card-1">
<img class="so-pc__img" src="{{p1_img}}" alt="{{p1_name}}"><div class="so-pc__body"><div class="so-pc__name">{{p1_name}}</div><div class="so-pc__rate">{{p1_rate}}</div><div class="so-pc__msg so-pc__msg--cart">{{p1_in_cart}}</div></div></button><button type="button" class="so-pc so-pc--mobile" data-ui="ury-self-order-screen-menu.card-2">
<img class="so-pc__img" src="{{p2_img}}" alt="{{p2_name}}"><div class="so-pc__body"><div class="so-pc__name">{{p2_name}}</div><div class="so-pc__rate">{{p2_rate}}</div><div class="so-pc__msg so-pc__msg--cart">{{p2_in_cart}}</div></div></button><button type="button" class="so-pc so-pc--mobile" data-ui="ury-self-order-screen-menu.card-3">
<img class="so-pc__img" src="{{p3_img}}" alt="{{p3_name}}"><div class="so-pc__body"><div class="so-pc__name">{{p3_name}}</div><div class="so-pc__rate">{{p3_rate}}</div></div></button><button type="button" class="so-pc so-pc--mobile is-disabled" disabled aria-disabled="true" data-ui="ury-self-order-screen-menu.card-4">
<img class="so-pc__img" src="{{p4_img}}" alt="{{p4_name}}"><div class="so-pc__body"><div class="so-pc__name">{{p4_name}}</div><div class="so-pc__rate">{{p4_rate}}</div><div class="so-pc__msg so-pc__msg--bad">{{p4_unavail}}</div></div></button></div></div>
<div class="som-bar" data-ui="ury-self-order-screen-menu.bar"><button type="button" class="som-btn">{{view_cart}} {{cart_total}}</button></div></div>
