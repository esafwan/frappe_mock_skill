<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><title>POS Comment Dialog</title>
<link rel="stylesheet" href="../../tokens/css/ury-v16/ury-fonts.css">
<link rel="stylesheet" href="../../tokens/css/ury-v16/ury-ui-tokens.css">
<link rel="stylesheet" href="../../tokens/css/ury-v16/ury-ui-base.css">
<link rel="stylesheet" href="../../tokens/css/ury-v16/components/pos-dialogs.css">
<style>html,body{margin:0}body{background:hsl(var(--background));min-height:900px}#ui-kit-stage{position:absolute;left:0;top:0;width:1440px;height:900px}*{animation:none!important;transition:none!important;caret-color:transparent!important}</style></head>
<body>
<div id="ui-kit-stage">
<div class="u-dialog-wrap pd" data-ui="pos-comment-dialog" style="width:1440px;height:900px"><div class="u-dialog-scrim"></div><div class="u-dialog pd-dlg--md" role="dialog" aria-modal="true" data-ui="dialog"><button type="button" class="u-dialog-close" aria-label="Close"><svg class="lucide lucide-x" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button><div class="u-dialog-header" data-ui="header"><h2 class="u-dialog-title pd-comment__title"><svg class="lucide lucide-message-square" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>تعليقات الطلب</h2></div>
<div class="pd-comment__body"><label class="pd-label" style="margin-bottom:8px">أضف تعليقات لهذا الطلب</label><textarea class="pd-textarea" placeholder="أدخل أي تعليمات خاصة أو تعليقات..." data-ui="textarea"></textarea></div>
<div class="u-dialog-footer" data-ui="footer"><button type="button" class="u-btn u-btn--outline" data-ui="cancel">إلغاء</button><button type="button" class="u-btn u-btn--default" data-ui="confirm">حفظ التعليق</button></div></div></div>
</div>
</body></html>
