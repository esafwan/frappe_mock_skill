<!doctype html>
<html dir="rtl" lang="ar">
<head><meta charset="utf-8"><title>POS order card</title>
<link rel="stylesheet" href="../../tokens/css/ury-v16/ury-fonts.css">
<link rel="stylesheet" href="../../tokens/css/ury-v16/ury-ui-tokens.css">
<link rel="stylesheet" href="../../tokens/css/ury-v16/ury-ui-base.css">
<link rel="stylesheet" href="../../tokens/css/ury-v16/components/pos-shell.css">
<link rel="stylesheet" href="../../tokens/css/ury-v16/components/pos-orders.css">
<style>html,body{margin:0}body{background:hsl(var(--background));min-height:0px}#ui-kit-stage{position:absolute;left:0;top:0;width:246px}*{animation:none!important;transition:none!important;caret-color:transparent!important}</style></head>
<body>
<div id="ui-kit-stage">

<div class="po po-card u-card" data-ui="pos-order-card">
<div class="po-card__head" data-ui="pos-order-card.head">
<div class="po-card__r1"><h3 class="po-card__name po-trunc">INV-0042</h3><div class="po-card__tags"></div></div>
<div class="po-card__r2"><div class="po-card__sub"><p>طاولة T4 • طلب محلي</p></div><div class="po-card__st"><span class="u-badge u-badge--secondary" data-ui="pos-order-card.status">غير مفوتر</span></div></div>
</div>
<div class="po-card__body" data-ui="pos-order-card.body"><p class="po-card__cust">خالد ناصر</p>
<div class="po-card__time"><svg class="lucide lucide-clock" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg><span>Nov 21, 9:42 AM</span></div>
<div class="po-card__total u-num" data-ui="pos-order-card.total"><span>AED 132.25</span></div></div>
</div>
</div>
</body></html>
