
<div class="po po-card u-card" data-ui="pos-order-card">
<div class="po-card__head" data-ui="pos-order-card.head">
<div class="po-card__r1"><h3 class="po-card__name po-trunc">{{name}}</h3><div class="po-card__tags"></div></div>
<div class="po-card__r2"><div class="po-card__sub"><p>{{meta}}</p></div><div class="po-card__st"><span class="u-badge u-badge--secondary" data-ui="pos-order-card.status">{{status}}</span></div></div>
</div>
<div class="po-card__body" data-ui="pos-order-card.body"><p class="po-card__cust">{{customer}}</p>
<div class="po-card__time"><svg class="lucide lucide-clock" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg><span>{{time}}</span></div>
<div class="po-card__total u-num" data-ui="pos-order-card.total"><span>{{total}}</span></div></div>
</div>
