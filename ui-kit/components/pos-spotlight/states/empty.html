<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>POS spotlight search / empty</title>
<link rel="stylesheet" href="../../../tokens/css/ury-v16/ury-fonts.css">
<link rel="stylesheet" href="../../../tokens/css/ury-v16/ury-ui-tokens.css">
<link rel="stylesheet" href="../../../tokens/css/ury-v16/ury-ui-base.css">
<link rel="stylesheet" href="../../../tokens/css/ury-v16/components/pos-shell.css">
<style>html,body{margin:0}body{background:hsl(var(--background));min-height:0px}#ui-kit-stage{position:absolute;left:0;top:0;width:720px}*{animation:none!important;transition:none!important;caret-color:transparent!important}</style></head>
<body>
<div id="ui-kit-stage">
<div class="psh psh-stage psh-stage--scrim" data-ui="pos-spotlight"><div class="psh-dialog psh-dialog--sp" data-ui="pos-spotlight.dialog"><div class="psh-spin" data-ui="pos-spotlight.input"><svg class="lucide lucide-search psh-spin__icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21 21-4.34-4.34"/><circle cx="11" cy="11" r="8"/></svg><input type="text" readonly placeholder="Search menu items..." value="xyz"><button type="button" class="psh-spin__x" aria-label="Close"><svg class="lucide lucide-x" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button></div><div class="psh-splist" data-ui="pos-spotlight.results"><div class="psh-spempty">No items found</div></div><div class="psh-sphint"><span>Use ↑↓ to navigate, Enter to select</span><div class="psh-kbd"><svg class="lucide lucide-command" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6v12a3 3 0 1 0 3-3H6a3 3 0 1 0 3 3V6a3 3 0 1 0-3 3h12a3 3 0 1 0-3-3"/></svg><span>K</span></div></div></div></div>
</div>
</body></html>
