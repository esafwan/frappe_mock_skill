<div class="u-screen so som " data-ui="ury-self-order-screen-cart" style="width:390px;height:844px;position:relative;overflow:hidden"><div class="som-page"><header class="som-hdr" data-ui="ury-self-order-screen-cart.header"><button type="button" class="som-hdr__back">{{back}}</button><h1 class="som-hdr__t">{{title}}</h1><span class="som-hdr__sp" aria-hidden="true"></span></header><div class="som-cartbody"><ul class="som-lines"><li class="som-line" data-ui="ury-self-order-screen-cart.line-1"><div class="som-line__top"><span class="som-line__n">{{l1_name}}</span><span class="som-line__ctl"><button type="button" class="som-line__st" aria-label="Remove one">−</button><span class="som-line__q">{{l1_qty}}</span><button type="button" class="som-line__st" aria-label="Add one more">+</button></span></div></li><li class="som-line" data-ui="ury-self-order-screen-cart.line-2"><div class="som-line__top"><span class="som-line__n">{{l2_name}}</span><span class="som-line__ctl"><button type="button" class="som-line__st" aria-label="Remove one">−</button><span class="som-line__q">{{l2_qty}}</span><button type="button" class="som-line__st" aria-label="Add one more">+</button></span></div><p class="som-line__note">{{note_label}} {{l2_note}}</p></li></ul></div>
<div class="som-foot" data-ui="ury-self-order-screen-cart.footer"><div class="som-foot__sum"><span>{{count}}</span><span>{{total}}</span></div><button type="button" class="som-btn">{{checkout}}</button></div></div></div>
