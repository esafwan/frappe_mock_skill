<!doctype html>
<html lang="en" class="dark">
<head><meta charset="utf-8"><title>Self-order mobile cart screen</title>
<link rel="stylesheet" href="../../tokens/css/ury-v16/ury-fonts.css">
<link rel="stylesheet" href="../../tokens/css/ury-v16/ury-ui-tokens.css">
<link rel="stylesheet" href="../../tokens/css/ury-v16/ury-ui-base.css">
<link rel="stylesheet" href="../../tokens/css/ury-v16/components/self-order.css">
<link rel="stylesheet" href="../../tokens/css/ury-v16/components/self-order-mobile.css">
<style>html,body{margin:0}body{background:hsl(var(--background));min-height:844px}#ui-kit-stage{position:absolute;left:0;top:0;width:390px;height:844px}*{animation:none!important;transition:none!important;caret-color:transparent!important}</style></head>
<body>
<div id="ui-kit-stage">
<div class="u-screen so som " data-ui="ury-self-order-screen-cart" style="width:390px;height:844px;position:relative;overflow:hidden"><div class="som-page"><header class="som-hdr" data-ui="ury-self-order-screen-cart.header"><button type="button" class="som-hdr__back">← Back to menu</button><h1 class="som-hdr__t">Your Cart</h1><span class="som-hdr__sp" aria-hidden="true"></span></header><div class="som-cartbody"><ul class="som-lines"><li class="som-line" data-ui="ury-self-order-screen-cart.line-1"><div class="som-line__top"><span class="som-line__n">Espresso</span><span class="som-line__ctl"><button type="button" class="som-line__st" aria-label="Remove one">−</button><span class="som-line__q">1</span><button type="button" class="som-line__st" aria-label="Add one more">+</button></span></div></li><li class="som-line" data-ui="ury-self-order-screen-cart.line-2"><div class="som-line__top"><span class="som-line__n">Cappuccino</span><span class="som-line__ctl"><button type="button" class="som-line__st" aria-label="Remove one">−</button><span class="som-line__q">2</span><button type="button" class="som-line__st" aria-label="Add one more">+</button></span></div><p class="som-line__note">Note: Less sugar</p></li></ul></div>
<div class="som-foot" data-ui="ury-self-order-screen-cart.footer"><div class="som-foot__sum"><span>3 items</span><span>AED 48.00</span></div><button type="button" class="som-btn">Proceed to checkout</button></div></div></div>
</div>
</body></html>
