<div class="u-screen so som " data-ui="ury-self-order-screen-detail" style="width:390px;height:844px;position:relative;overflow:hidden"><div class="som-detail"><div class="som-back"><button type="button" class="som-back__l" data-ui="ury-self-order-screen-detail.back"><span class="so-flip"><svg class="lucide lucide-chevron-left" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></span>{{back}}</button></div>
<img class="som-detail__img" src="{{img}}" alt="{{name}}" data-ui="ury-self-order-screen-detail.image"><div class="som-detail__body"><div><h1 class="som-detail__h">{{name}}</h1><p class="som-detail__d som-muted">{{description}}</p></div>
<div class="som-detail__rate">{{rate}}</div><div class="som-sec" data-ui="ury-self-order-screen-detail.variants"><div class="som-sec__h">{{variants_h}}</div><div class="som-sec"><button type="button" class="so-opt so-opt--on" data-ui="ury-self-order-option-row.row"><span>{{v1_name}}</span><span class="so-opt__rate">{{v1_rate}}</span></button><button type="button" class="so-opt" data-ui="ury-self-order-option-row.row"><span>{{v2_name}}</span><span class="so-opt__rate">{{v2_rate}}</span></button></div></div><div class="som-sec" data-ui="ury-self-order-screen-detail.addons"><div class="som-sec__h">{{addons_h}}</div><div class="som-sec"><button type="button" class="so-opt" data-ui="ury-self-order-option-row.row"><span>{{a1_name}}</span><span class="so-opt__rate">{{a1_rate}}</span></button><button type="button" class="so-opt" data-ui="ury-self-order-option-row.row"><span>{{a2_name}}</span><span class="so-opt__rate">{{a2_rate}}</span></button></div></div>
<div class="som-qty" data-ui="ury-self-order-screen-detail.qty"><button type="button" class="som-qty__b" aria-label="Decrease quantity"><svg class="lucide lucide-minus" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/></svg></button><div class="som-qty__n">{{qty}}</div><button type="button" class="som-qty__b" aria-label="Increase quantity"><svg class="lucide lucide-plus" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg></button></div>
<button type="button" class="som-add" data-ui="ury-self-order-screen-detail.add">{{add}}</button></div></div></div>
