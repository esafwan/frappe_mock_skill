<!doctype html>
<html dir="rtl" lang="ar">
<head><meta charset="utf-8"><title>Portrait kiosk product detail</title>
<link rel="stylesheet" href="../../tokens/css/ury-v16/ury-fonts.css">
<link rel="stylesheet" href="../../tokens/css/ury-v16/ury-ui-tokens.css">
<link rel="stylesheet" href="../../tokens/css/ury-v16/ury-ui-base.css">
<link rel="stylesheet" href="../../tokens/css/ury-v16/components/kiosk-portrait.css">
<style>html,body{margin:0}body{background:hsl(var(--background));min-height:1920px}#ui-kit-stage{position:absolute;left:0;top:0;width:1080px;height:1920px}*{animation:none!important;transition:none!important;caret-color:transparent!important}</style></head>
<body>
<div id="ui-kit-stage">
<div class="kp" data-ui="ury-kiosk-screen-portrait-detail"><header class="kp-header" data-ui="ury-kiosk-screen-portrait-detail.header"><h1 class="kp-title" data-ui="ury-kiosk-screen-portrait-detail.title">طلب للاستلام</h1><button type="button" class="kp-new" data-ui="ury-kiosk-screen-portrait-detail.new-order">طلب جديد</button></header><div class="kp-detail" data-ui="ury-kiosk-screen-portrait-detail.detail"><div class="kp-detail__back"><button type="button" data-ui="ury-kiosk-screen-portrait-detail.back"><span>رجوع</span></button></div>
<img class="kp-detail__img" src="../../data/images/cafe/cappuccino.jpg" alt="كابتشينو"><div class="kp-detail__content"><div><h1 class="kp-detail__h1" data-ui="ury-kiosk-screen-portrait-detail.name">كابتشينو</h1><p class="kp-detail__desc">إسبريسو مزدوج مع حليب مبخّر وطبقة خفيفة من الرغوة.</p></div><div class="kp-detail__rate" data-ui="ury-kiosk-screen-portrait-detail.rate">16.00 د.إ</div>
<div class="kp-detail__grp"><div class="kp-detail__lbl">الخيارات</div><button type="button" class="kp-opt kp-opt--on" data-ui="ury-kiosk-screen-portrait-detail.v1"><span>عادي</span><span class="kp-opt__rate">16.00 د.إ</span></button><button type="button" class="kp-opt" data-ui="ury-kiosk-screen-portrait-detail.v2"><span>كبير</span><span class="kp-opt__rate">20.00 د.إ</span></button></div><div class="kp-detail__grp"><div class="kp-detail__lbl">الإضافات</div><button type="button" class="kp-opt" data-ui="ury-kiosk-screen-portrait-detail.a1"><span>جرعة إضافية</span><span class="kp-opt__rate">4.00 د.إ</span></button><button type="button" class="kp-opt" data-ui="ury-kiosk-screen-portrait-detail.a2"><span>حليب الشوفان</span><span class="kp-opt__rate">3.00 د.إ</span></button></div>
<div class="kp-qty" data-ui="ury-kiosk-screen-portrait-detail.qty"><button type="button" class="kp-qty__btn" aria-label="Decrease quantity">-</button><div class="kp-qty__n">1</div><button type="button" class="kp-qty__btn" aria-label="Increase quantity">+</button></div>
<button type="button" class="kp-add" data-ui="ury-kiosk-screen-portrait-detail.add">أضف إلى السلة</button></div></div></div>
</div>
</body></html>
