<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Portrait kiosk product detail / addon-selected</title>
<link rel="stylesheet" href="../../../tokens/css/ury-v16/ury-fonts.css">
<link rel="stylesheet" href="../../../tokens/css/ury-v16/ury-ui-tokens.css">
<link rel="stylesheet" href="../../../tokens/css/ury-v16/ury-ui-base.css">
<link rel="stylesheet" href="../../../tokens/css/ury-v16/components/kiosk-portrait.css">
<style>html,body{margin:0}body{background:hsl(var(--background));min-height:1920px}#ui-kit-stage{position:absolute;left:0;top:0;width:1080px;height:1920px}*{animation:none!important;transition:none!important;caret-color:transparent!important}</style></head>
<body>
<div id="ui-kit-stage">
<div class="kp" data-ui="ury-kiosk-screen-portrait-detail"><header class="kp-header" data-ui="ury-kiosk-screen-portrait-detail.header"><h1 class="kp-title" data-ui="ury-kiosk-screen-portrait-detail.title">Order for Pickup</h1><button type="button" class="kp-new" data-ui="ury-kiosk-screen-portrait-detail.new-order">New Order</button></header><div class="kp-detail" data-ui="ury-kiosk-screen-portrait-detail.detail"><div class="kp-detail__back"><button type="button" data-ui="ury-kiosk-screen-portrait-detail.back"><span>Back</span></button></div>
<img class="kp-detail__img" src="../../../data/images/cafe/cappuccino.jpg" alt="Cappuccino"><div class="kp-detail__content"><div><h1 class="kp-detail__h1" data-ui="ury-kiosk-screen-portrait-detail.name">Cappuccino</h1><p class="kp-detail__desc">Double espresso with steamed milk and a light layer of foam.</p></div><div class="kp-detail__rate" data-ui="ury-kiosk-screen-portrait-detail.rate">AED 16.00</div>
<div class="kp-detail__grp"><div class="kp-detail__lbl">Variants</div><button type="button" class="kp-opt kp-opt--on" data-ui="ury-kiosk-screen-portrait-detail.v1"><span>Regular</span><span class="kp-opt__rate">AED 16.00</span></button><button type="button" class="kp-opt" data-ui="ury-kiosk-screen-portrait-detail.v2"><span>Large</span><span class="kp-opt__rate">AED 20.00</span></button></div><div class="kp-detail__grp"><div class="kp-detail__lbl">Add-ons</div><button type="button" class="kp-opt kp-opt--on" data-ui="ury-kiosk-screen-portrait-detail.a1"><span>Extra shot</span><span class="kp-opt__rate">AED 4.00</span></button><button type="button" class="kp-opt" data-ui="ury-kiosk-screen-portrait-detail.a2"><span>Oat milk</span><span class="kp-opt__rate">AED 3.00</span></button></div>
<div class="kp-qty" data-ui="ury-kiosk-screen-portrait-detail.qty"><button type="button" class="kp-qty__btn" aria-label="Decrease quantity">-</button><div class="kp-qty__n">1</div><button type="button" class="kp-qty__btn" aria-label="Increase quantity">+</button></div>
<button type="button" class="kp-add" data-ui="ury-kiosk-screen-portrait-detail.add">Add to cart</button></div></div></div>
</div>
</body></html>
