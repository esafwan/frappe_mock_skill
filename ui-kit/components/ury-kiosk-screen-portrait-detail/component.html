<div class="kp" data-ui="ury-kiosk-screen-portrait-detail"><header class="kp-header" data-ui="ury-kiosk-screen-portrait-detail.header"><h1 class="kp-title" data-ui="ury-kiosk-screen-portrait-detail.title">{{title}}</h1><button type="button" class="kp-new" data-ui="ury-kiosk-screen-portrait-detail.new-order">{{new_order}}</button></header><div class="kp-detail" data-ui="ury-kiosk-screen-portrait-detail.detail"><div class="kp-detail__back"><button type="button" data-ui="ury-kiosk-screen-portrait-detail.back"><span>{{d_back}}</span></button></div>
<img class="kp-detail__img" src="{{img}}" alt="{{d_title}}"><div class="kp-detail__content"><div><h1 class="kp-detail__h1" data-ui="ury-kiosk-screen-portrait-detail.name">{{d_title}}</h1><p class="kp-detail__desc">{{d_desc}}</p></div><div class="kp-detail__rate" data-ui="ury-kiosk-screen-portrait-detail.rate">{{d_rate}}</div>
<div class="kp-detail__grp"><div class="kp-detail__lbl">{{d_variants}}</div><button type="button" class="kp-opt kp-opt--on" data-ui="ury-kiosk-screen-portrait-detail.v1"><span>{{v1_name}}</span><span class="kp-opt__rate">{{v1_rate}}</span></button><button type="button" class="kp-opt" data-ui="ury-kiosk-screen-portrait-detail.v2"><span>{{v2_name}}</span><span class="kp-opt__rate">{{v2_rate}}</span></button></div><div class="kp-detail__grp"><div class="kp-detail__lbl">{{d_addons}}</div><button type="button" class="kp-opt" data-ui="ury-kiosk-screen-portrait-detail.a1"><span>{{a1_name}}</span><span class="kp-opt__rate">{{a1_rate}}</span></button><button type="button" class="kp-opt" data-ui="ury-kiosk-screen-portrait-detail.a2"><span>{{a2_name}}</span><span class="kp-opt__rate">{{a2_rate}}</span></button></div>
<div class="kp-qty" data-ui="ury-kiosk-screen-portrait-detail.qty"><button type="button" class="kp-qty__btn" aria-label="Decrease quantity">-</button><div class="kp-qty__n">{{d_qty}}</div><button type="button" class="kp-qty__btn" aria-label="Increase quantity">+</button></div>
<button type="button" class="kp-add" data-ui="ury-kiosk-screen-portrait-detail.add">{{add_to_cart}}</button></div></div></div>
