<!doctype html>
<html lang="en" class="dark">
<head><meta charset="utf-8"><title>POS Bill Split Dialog</title>
<link rel="stylesheet" href="../../tokens/css/ury-v16/ury-fonts.css">
<link rel="stylesheet" href="../../tokens/css/ury-v16/ury-ui-tokens.css">
<link rel="stylesheet" href="../../tokens/css/ury-v16/ury-ui-base.css">
<link rel="stylesheet" href="../../tokens/css/ury-v16/components/pos-dialogs.css">
<style>html,body{margin:0}body{background:hsl(var(--background));min-height:900px}#ui-kit-stage{position:absolute;left:0;top:0;width:1440px;height:900px}*{animation:none!important;transition:none!important;caret-color:transparent!important}</style></head>
<body>
<div id="ui-kit-stage">
<div class="u-dialog-wrap pd" data-ui="pos-bill-split-dialog" style="width:1440px;height:900px"><div class="u-dialog-scrim"></div><div class="u-dialog pd-dlg--lg pd-dlg--scroll" role="dialog" aria-modal="true" data-ui="dialog"><button type="button" class="u-dialog-close" aria-label="Close"><svg class="lucide lucide-x" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button><div class="u-dialog-header" data-ui="header"><h2 class="u-dialog-title">Split bill</h2><p class="u-dialog-desc">Choose items to move to a new bill from INV-0042</p></div><div class="pd-split-items" data-ui="items"><div role="button" tabindex="0" class="pd-split-row" data-ui="item-1"><div class="pd-split-row__in"><div class="pd-cbox pd-cbox--bold" aria-hidden="true"></div><div class="pd-split-row__main"><div class="pd-split-row__top"><div><p class="pd-split-row__name">Hummus</p><p class="pd-split-row__avail">1 available</p></div><span class="pd-split-row__amt"><span class="u-num">AED 22.00</span></span></div></div></div></div><div role="button" tabindex="0" class="pd-split-row" data-ui="item-2"><div class="pd-split-row__in"><div class="pd-cbox pd-cbox--bold" aria-hidden="true"></div><div class="pd-split-row__main"><div class="pd-split-row__top"><div><p class="pd-split-row__name">Moutabal</p><p class="pd-split-row__avail">3 available</p></div><span class="pd-split-row__amt"><span class="u-num">AED 72.00</span></span></div></div></div></div><div role="button" tabindex="0" class="pd-split-row" data-ui="item-3"><div class="pd-split-row__in"><div class="pd-cbox pd-cbox--bold" aria-hidden="true"></div><div class="pd-split-row__main"><div class="pd-split-row__top"><div><p class="pd-split-row__name">Tabbouleh</p><p class="pd-split-row__avail">1 available</p></div><span class="pd-split-row__amt"><span class="u-num">AED 26.00</span></span></div></div></div></div><div role="button" tabindex="0" class="pd-split-row" data-ui="item-4"><div class="pd-split-row__in"><div class="pd-cbox pd-cbox--bold" aria-hidden="true"></div><div class="pd-split-row__main"><div class="pd-split-row__top"><div><p class="pd-split-row__name">Fattoush</p><p class="pd-split-row__avail">2 available</p></div><span class="pd-split-row__amt"><span class="u-num">AED 56.00</span></span></div></div></div></div></div><div class="pd-split-cust" data-ui="customer"><p>Customer for new bill</p><label><input type="checkbox" checked>Same customer as original bill</label></div><div class="pd-split-totals" data-ui="totals"><div><p>Stays on original bill</p><p><span class="u-num">AED 176.00</span></p></div><div><p>Moves to new bill</p><p class="is-move-val"><span class="u-num">AED 0.00</span></p></div></div><div class="u-dialog-footer" data-ui="footer"><button type="button" class="u-btn u-btn--outline" data-ui="cancel">Cancel</button><button type="button" class="u-btn u-btn--default" disabled data-ui="confirm">Split bill</button></div></div></div>
</div>
