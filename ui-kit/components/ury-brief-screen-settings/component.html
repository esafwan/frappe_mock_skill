<div class="u-screen" data-ui="ury-brief-screen-settings" style="width:390px;height:844px;position:relative;overflow:hidden"><div class="bf bf-screen bf-settings"><header class="topbar topbar--home" data-ui="ury-brief-screen-settings.topbar">
<div class="topbar-title"><h1 dir="auto">{{tb_title}}</h1><p class="topbar-sub">{{tb_sub}}</p></div>
<div class="topbar-menu"><button type="button" class="avatar" aria-label="{{tb_account}}" aria-haspopup="menu" aria-expanded="false" data-ui="ury-brief-screen-settings.topbar.avatar">{{tb_initials}}</button></div>
</header><main class="today-body"><section class="hero" aria-label="Net sales"><p class="lbl" dir="auto">{{h_lbl}}</p><p class="big">{{h_big}}</p><span class="pill good"><svg class="" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false"><path d="M7.41 15.41 12 10.83l4.59 4.58L18 14l-6-6-6 6z"/></svg>{{h_delta}}</span></section><section class="grid" aria-label="Key numbers"><div class="tile"><span class="k">{{k_orders}}</span><span class="v">{{v_orders}}</span><span class="d">{{d_orders}}</span></div><div class="tile"><span class="k">{{k_avg}}</span><span class="v">{{v_avg}}</span></div><div class="tile"><span class="k">{{k_covers}}</span><span class="v">{{v_covers}}</span><span class="d">{{d_covers}}</span></div><div class="tile"><span class="k">{{k_spc}}</span><span class="v">{{v_spc}}</span></div><div class="tile"><span class="k">{{k_prep}}</span><span class="v">{{v_prep}}</span><span class="d">{{d_prep}}</span></div></section></main><div class="scrim"><div class="sheet" role="dialog" aria-modal="true" data-ui="ury-brief-screen-settings.sheet"><div class="st-head"><h2>{{s_title}}</h2><button type="button" class="icon-btn" aria-label="{{s_close}}"><svg class="" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg></button></div>
<div class="st-body"><div class="st-profile"><span class="st-avatar" aria-hidden="true">{{s_ini}}</span><p class="st-who">{{s_who}}</p></div>
<div class="st-field"><label>{{s_theme}}</label><select class="st-select" data-ui="ury-brief-screen-settings.select-theme"><option>{{s_theme_v}}</option></select></div>
<div class="st-field"><label>{{s_lang}}</label><select class="st-select" data-ui="ury-brief-screen-settings.select-lang"><option>{{s_lang_v}}</option></select></div>
<label class="st-row"><span>{{s_read}}</span><input type="checkbox" checked></label></div></div></div></div></div>
