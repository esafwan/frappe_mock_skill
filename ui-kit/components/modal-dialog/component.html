<div class="modal-dialog" data-ui="modal-dialog">
			<div class="modal-content">
				<div class="modal-header">
					<div class="fill-width flex title-section">
						<span class="indicator hidden"></span>
						<h4 class="modal-title">{{modal_title}}</h4>
					</div>
					<div class="modal-actions d-flex">
						<button class="es-button btn-modal-minimize icon-btn hide" type="button" data-variant="ghost" data-icon-button="true" title="{{hide_title}}" aria-label="{{hide_arialabel}}" data-ui="modal-dialog.button-1"><span class="es-spinner" aria-hidden="true"></span><svg class="icon  icon-sm" stroke="currentColor" style="" aria-hidden="true">
			<use class="" href="#icon-minimize-2">
			</use>
		</svg></button>
						<button class="es-button btn-modal-close icon-btn" type="button" data-variant="ghost" data-icon-button="true" title="{{icon_btn_title}}" aria-label="{{icon_btn_arialabel}}" data-dismiss="modal" data-ui="modal-dialog.button-2"><span class="es-spinner" aria-hidden="true"></span><svg class="icon  icon-sm" stroke="currentColor" style="" aria-hidden="true">
			<use class="" href="#icon-x">
			</use>
		</svg></button>
					</div>
				</div>
				<div class="modal-body ui-front"><div><p class="frappe-confirm-message">{{frappe_confirm_message}}</p></div><div class="hide modal-message"></div></div>
				<div class="modal-footer">
					<div class="custom-actions"></div>
					<div class="standard-actions">
						<button class="es-button btn-modal-secondary" type="button" data-ui="modal-dialog.button-3"><span class="es-spinner" aria-hidden="true"></span><span class="es-button__label">{{es_button_label}}</span></button>
						<button class="es-button btn-modal-primary" type="button" data-variant="solid" data-ui="modal-dialog.button-4"><span class="es-spinner" aria-hidden="true"></span><span class="es-button__label">{{es_button_label_2}}</span></button>
					</div>
				</div>
			</div>
		</div>
