<div class="kp kp--menu kp--open" data-ui="ury-kiosk-screen-portrait-cart-open"><header class="kp-header" data-ui="ury-kiosk-screen-portrait-cart-open.header"><h1 class="kp-title" data-ui="ury-kiosk-screen-portrait-cart-open.title">{{title}}</h1><button type="button" class="kp-new" data-ui="ury-kiosk-screen-portrait-cart-open.new-order">{{new_order}}</button></header><div class="kp-body"><div class="kp-row"><div class="kp-searchcol" data-ui="ury-kiosk-screen-portrait-cart-open.search"><div class="kp-search"><span class="kp-search__icon"><svg class="lucide lucide-search" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21 21-4.34-4.34"/><circle cx="11" cy="11" r="8"/></svg></span><input class="kp-search__input" type="text" readonly aria-label="Search menu" placeholder="{{placeholder}}"></div></div><nav class="kp-nav" aria-label="Menu categories" data-ui="ury-kiosk-screen-portrait-cart-open.categories"><button type="button" class="kp-cat kp-cat--on">{{all_items}}</button><button type="button" class="kp-cat">{{cat_1}}</button><button type="button" class="kp-cat">{{cat_2}}</button><button type="button" class="kp-cat">{{cat_3}}</button><button type="button" class="kp-cat">{{cat_4}}</button><button type="button" class="kp-cat">{{cat_5}}</button></nav></div><div class="kp-grid" data-ui="ury-kiosk-screen-portrait-cart-open.grid"><button type="button" class="kp-card" data-ui="ury-kiosk-screen-portrait-cart-open.card-0"><img class="kp-card__img" src="{{p0_img}}" alt="{{n0}}"><div class="kp-card__body"><div class="kp-card__name">{{n0}}</div><div class="kp-card__rate">{{r0}}</div></div></button><button type="button" class="kp-card" data-ui="ury-kiosk-screen-portrait-cart-open.card-1"><img class="kp-card__img" src="{{p1_img}}" alt="{{n1}}"><div class="kp-card__body"><div class="kp-card__name">{{n1}}</div><div class="kp-card__rate">{{r1}}</div></div></button><button type="button" class="kp-card" data-ui="ury-kiosk-screen-portrait-cart-open.card-2"><img class="kp-card__img" src="{{p2_img}}" alt="{{n2}}"><div class="kp-card__body"><div class="kp-card__name">{{n2}}</div><div class="kp-card__rate">{{r2}}</div></div></button><button type="button" class="kp-card" data-ui="ury-kiosk-screen-portrait-cart-open.card-3"><img class="kp-card__img" src="{{p3_img}}" alt="{{n3}}"><div class="kp-card__body"><div class="kp-card__name">{{n3}}</div><div class="kp-card__rate">{{r3}}</div><div class="kp-card__msg kp-card__msg--cart">{{in_cart_1}}</div></div></button><button type="button" class="kp-card" data-ui="ury-kiosk-screen-portrait-cart-open.card-4"><img class="kp-card__img" src="{{p4_img}}" alt="{{n4}}"><div class="kp-card__body"><div class="kp-card__name">{{n4}}</div><div class="kp-card__rate">{{r4}}</div><div class="kp-card__msg kp-card__msg--cart">{{in_cart_2}}</div></div></button><button type="button" class="kp-card" data-ui="ury-kiosk-screen-portrait-cart-open.card-5"><img class="kp-card__img" src="{{p5_img}}" alt="{{n5}}"><div class="kp-card__body"><div class="kp-card__name">{{n5}}</div><div class="kp-card__rate">{{r5}}</div></div></button></div></div><div class="kp-bar" data-ui="ury-kiosk-screen-portrait-cart-open.bar"><div class="kp-bar__lines" data-ui="ury-kiosk-screen-portrait-cart-open.lines"><ul class="kp-bar__list"><li><span>{{l1_name}}</span><span class="kp-bar__ctl"><button type="button" class="kp-step" aria-label="Remove one">−</button>{{l1_qty}}<button type="button" class="kp-step" aria-label="Add one more">+</button></span></li><li><span>{{l2_name}}</span><span class="kp-bar__ctl"><button type="button" class="kp-step" aria-label="Remove one">−</button>{{l2_qty}}<button type="button" class="kp-step" aria-label="Add one more">+</button></span></li></ul></div>
<div class="kp-bar__foot"><button type="button" class="kp-bar__toggle" aria-expanded="true" data-ui="ury-kiosk-screen-portrait-cart-open.toggle"><span>{{count_label}}</span><span class="kp-num" data-ui="ury-kiosk-screen-portrait-cart-open.total">{{cart_total}}</span></button><button type="button" class="kp-bar__checkout" data-ui="ury-kiosk-screen-portrait-cart-open.checkout">{{checkout}}</button></div></div></div>
