<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Portrait kiosk cart open / single-line</title>

<style>html,body{margin:0}body{background:hsl(var(--background));min-height:1920px}#ui-kit-stage{position:absolute;left:0;top:0;width:1080px;height:1920px}*{animation:none!important;transition:none!important;caret-color:transparent!important}</style></head>
<body>
<div id="ui-kit-stage">
<div class="kp kp--menu kp--open" data-ui="ury-kiosk-screen-portrait-cart-open"><header class="kp-header" data-ui="ury-kiosk-screen-portrait-cart-open.header"><h1 class="kp-title" data-ui="ury-kiosk-screen-portrait-cart-open.title">Order for Pickup</h1><button type="button" class="kp-new" data-ui="ury-kiosk-screen-portrait-cart-open.new-order">New Order</button></header><div class="kp-body"><div class="kp-row"><div class="kp-searchcol" data-ui="ury-kiosk-screen-portrait-cart-open.search"><div class="kp-search"><span class="kp-search__icon"><svg class="lucide lucide-search" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21 21-4.34-4.34"/><circle cx="11" cy="11" r="8"/></svg></span><input class="kp-search__input" type="text" readonly aria-label="Search menu" placeholder="Search..."></div></div><nav class="kp-nav" aria-label="Menu categories" data-ui="ury-kiosk-screen-portrait-cart-open.categories"><button type="button" class="kp-cat kp-cat--on">All Items</button><button type="button" class="kp-cat">Coffee</button><button type="button" class="kp-cat">Iced</button><button type="button" class="kp-cat">Tea & Others</button><button type="button" class="kp-cat">Bakery</button><button type="button" class="kp-cat">Breakfast</button></nav></div><div class="kp-grid" data-ui="ury-kiosk-screen-portrait-cart-open.grid"><button type="button" class="kp-card" data-ui="ury-kiosk-screen-portrait-cart-open.card-0"><img class="kp-card__img" src="../../../data/images/cafe/espresso.jpg" alt="Espresso"><div class="kp-card__body"><div class="kp-card__name">Espresso</div><div class="kp-card__rate">AED 10.00</div></div></button><button type="button" class="kp-card" data-ui="ury-kiosk-screen-portrait-cart-open.card-1"><img class="kp-card__img" src="../../../data/images/cafe/croissant.jpg" alt="Croissant"><div class="kp-card__body"><div class="kp-card__name">Croissant</div><div class="kp-card__rate">AED 12.00</div></div></button><button type="button" class="kp-card" data-ui="ury-kiosk-screen-portrait-cart-open.card-2"><img class="kp-card__img" src="../../../data/images/cafe/avocado-toast.jpg" alt="Avocado Toast"><div class="kp-card__body"><div class="kp-card__name">Avocado Toast</div><div class="kp-card__rate">AED 24.00</div></div></button><button type="button" class="kp-card" data-ui="ury-kiosk-screen-portrait-cart-open.card-3"><img class="kp-card__img" src="../../../data/images/cafe/latte.jpg" alt="Latte"><div class="kp-card__body"><div class="kp-card__name">Latte</div><div class="kp-card__rate">AED 16.00</div><div class="kp-card__msg kp-card__msg--cart">In cart: 1</div></div></button><button type="button" class="kp-card" data-ui="ury-kiosk-screen-portrait-cart-open.card-4"><img class="kp-card__img" src="../../../data/images/cafe/cappuccino.jpg" alt="Cappuccino"><div class="kp-card__body"><div class="kp-card__name">Cappuccino</div><div class="kp-card__rate">AED 16.00</div><div class="kp-card__msg kp-card__msg--cart">In cart: 2</div></div></button><button type="button" class="kp-card" data-ui="ury-kiosk-screen-portrait-cart-open.card-5"><img class="kp-card__img" src="../../../data/images/cafe/blueberry-muffin.jpg" alt="Blueberry Muffin"><div class="kp-card__body"><div class="kp-card__name">Blueberry Muffin</div><div class="kp-card__rate">AED 13.00</div></div></button></div></div><div class="kp-bar" data-ui="ury-kiosk-screen-portrait-cart-open.bar"><div class="kp-bar__lines" data-ui="ury-kiosk-screen-portrait-cart-open.lines"><ul class="kp-bar__list"><li><span>Latte</span><span class="kp-bar__ctl"><button type="button" class="kp-step" aria-label="Remove one">−</button>1<button type="button" class="kp-step" aria-label="Add one more">+</button></span></li></ul></div>
<div class="kp-bar__foot"><button type="button" class="kp-bar__toggle" aria-expanded="true" data-ui="ury-kiosk-screen-portrait-cart-open.toggle"><span>1 item</span><span class="kp-num" data-ui="ury-kiosk-screen-portrait-cart-open.total">AED 16.00</span></button><button type="button" class="kp-bar__checkout" data-ui="ury-kiosk-screen-portrait-cart-open.checkout">Checkout</button></div></div></div>
</div>
