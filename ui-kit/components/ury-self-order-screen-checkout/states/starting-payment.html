<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Self-order mobile checkout screen / starting-payment</title>
<link rel="stylesheet" href="../../../tokens/css/ury-v16/ury-fonts.css">
<link rel="stylesheet" href="../../../tokens/css/ury-v16/ury-ui-tokens.css">
<link rel="stylesheet" href="../../../tokens/css/ury-v16/ury-ui-base.css">
<link rel="stylesheet" href="../../../tokens/css/ury-v16/components/self-order.css">
<link rel="stylesheet" href="../../../tokens/css/ury-v16/components/self-order-mobile.css">
<style>html,body{margin:0}body{background:hsl(var(--background));min-height:844px}#ui-kit-stage{position:absolute;left:0;top:0;width:390px;height:844px}*{animation:none!important;transition:none!important;caret-color:transparent!important}</style></head>
<body>
<div id="ui-kit-stage">
<div class="u-screen so som " data-ui="ury-self-order-screen-checkout" style="width:390px;height:844px;position:relative;overflow:hidden"><div class="som-page"><header class="som-hdr" data-ui="ury-self-order-screen-checkout.header"><button type="button" class="som-hdr__back">← Back to cart</button><h1 class="som-hdr__t">Checkout</h1><span class="som-hdr__sp" aria-hidden="true"></span></header><div class="som-co"><div class="som-co__in">
<section class="som-card" data-ui="ury-self-order-screen-checkout.summary"><h2 class="som-order__h">Order Summary</h2><ul class="som-rows"><li><span>Espresso × 1</span><span>AED 12.00</span></li><li><span>Cappuccino × 2</span><span>AED 36.00</span></li><li><span>Latte × 1</span><span>AED 20.00</span></li></ul>
<div class="som-total"><span>4 items</span><span>AED 68.00</span></div></section>
<section class="som-card" data-ui="ury-self-order-screen-checkout.methods"><h2 class="som-order__h">Payment Method</h2><div class="som-pay"><button type="button" class="som-pay__b is-on">Pay Online</button><button type="button" class="som-pay__b">Pay at Counter</button><button type="button" class="som-pay__b">Request Bill</button></div></section>
<div class="som-cta"><button type="button" class="som-btn is-disabled" disabled data-ui="ury-self-order-screen-checkout.cta">Starting payment…</button></div></div></div></div></div>
</div>
</body></html>
