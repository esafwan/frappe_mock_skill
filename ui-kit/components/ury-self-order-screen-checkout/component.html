<div class="u-screen so som " data-ui="ury-self-order-screen-checkout" style="width:390px;height:844px;position:relative;overflow:hidden"><div class="som-page"><header class="som-hdr" data-ui="ury-self-order-screen-checkout.header"><button type="button" class="som-hdr__back">{{back}}</button><h1 class="som-hdr__t">{{title}}</h1><span class="som-hdr__sp" aria-hidden="true"></span></header><div class="som-co"><div class="som-co__in">
<section class="som-card" data-ui="ury-self-order-screen-checkout.summary"><h2 class="som-order__h">{{summary_h}}</h2><ul class="som-rows"><li><span>{{l1_name}} × {{l1_qty}}</span><span>{{l1_amount}}</span></li><li><span>{{l2_name}} × {{l2_qty}}</span><span>{{l2_amount}}</span></li><li><span>{{l3_name}} × {{l3_qty}}</span><span>{{l3_amount}}</span></li></ul>
<div class="som-total"><span>{{count}}</span><span>{{total}}</span></div></section>
<section class="som-card" data-ui="ury-self-order-screen-checkout.methods"><h2 class="som-order__h">{{method_h}}</h2><div class="som-pay"><button type="button" class="som-pay__b">{{online}}</button><button type="button" class="som-pay__b is-on">{{counter}}</button><button type="button" class="som-pay__b">{{bill}}</button></div></section>
<div class="som-cta"><button type="button" class="som-btn" data-ui="ury-self-order-screen-checkout.cta">{{place}}</button></div></div></div></div></div>
