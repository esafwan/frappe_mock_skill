<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Self-order portable tablet assignment screen / assigning</title>
<link rel="stylesheet" href="../../../tokens/css/ury-v16/ury-fonts.css">
<link rel="stylesheet" href="../../../tokens/css/ury-v16/ury-ui-tokens.css">
<link rel="stylesheet" href="../../../tokens/css/ury-v16/ury-ui-base.css">
<link rel="stylesheet" href="../../../tokens/css/ury-v16/components/self-order.css">
<link rel="stylesheet" href="../../../tokens/css/ury-v16/components/self-order-tablet.css">
<style>html,body{margin:0}body{background:hsl(var(--background));min-height:800px}#ui-kit-stage{position:absolute;left:0;top:0;width:1280px;height:800px}*{animation:none!important;transition:none!important;caret-color:transparent!important}</style></head>
<body>
<div id="ui-kit-stage">
<div class="u-screen so sota" data-ui="ury-self-order-screen-tablet-assign" style="width:1280px;height:800px;position:relative;overflow:hidden"><div class="sota-head" data-ui="ury-self-order-screen-tablet-assign.head"><h1 class="sota-h1">Assign This Tablet</h1><p class="sota-sub">Bind a portable tablet to a table</p></div><div class="sota-step" data-ui="ury-self-order-screen-tablet-assign.table-step"><div class="sota-field"><label class="sota-label" for="table-input">Table Name or Code</label><p class="sota-hint">Enter the table identifier to assign</p></div>
<div class="sota-inwrap"><input id="table-input" class="sota-input" type="text" readonly disabled placeholder="e.g. T12, Table A, 5" value="T12" data-ui="ury-self-order-screen-tablet-assign.table-input"><p class="sota-hint">3 characters</p></div>
<button type="button" class="sota-btn" disabled data-ui="ury-self-order-screen-tablet-assign.assign"><span class="sota-spin"></span>Assigning…</button>
<button type="button" class="sota-back" disabled data-ui="ury-self-order-screen-tablet-assign.back">Back</button></div></div>
</div>
</body></html>
