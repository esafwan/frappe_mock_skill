<!doctype html>
<html dir="rtl" lang="ar">
<head><meta charset="utf-8"><title>Self-order portable tablet assignment screen</title>
<link rel="stylesheet" href="../../tokens/css/ury-v16/ury-fonts.css">
<link rel="stylesheet" href="../../tokens/css/ury-v16/ury-ui-tokens.css">
<link rel="stylesheet" href="../../tokens/css/ury-v16/ury-ui-base.css">
<link rel="stylesheet" href="../../tokens/css/ury-v16/components/self-order.css">
<link rel="stylesheet" href="../../tokens/css/ury-v16/components/self-order-tablet.css">
<style>html,body{margin:0}body{background:hsl(var(--background));min-height:800px}#ui-kit-stage{position:absolute;left:0;top:0;width:1280px;height:800px}*{animation:none!important;transition:none!important;caret-color:transparent!important}</style></head>
<body>
<div id="ui-kit-stage">
<div class="u-screen so sota" data-ui="ury-self-order-screen-tablet-assign" style="width:1280px;height:800px;position:relative;overflow:hidden"><div class="sota-head" data-ui="ury-self-order-screen-tablet-assign.head"><h1 class="sota-h1">تعيين هذا الجهاز اللوحي</h1><p class="sota-sub">ربط جهاز لوحي متنقل بطاولة</p></div><div class="sota-step" data-ui="ury-self-order-screen-tablet-assign.pin-step"><div class="sota-field"><label class="sota-label" for="pin-display">رمز PIN للموظف</label><p class="sota-hint">أدخل رمز PIN من 4 إلى 6 أرقام للمتابعة</p></div>
<div class="sota-pin" id="pin-display" aria-label="PIN entry" data-ui="ury-self-order-screen-tablet-assign.pin-display"><div class="sota-box sota-box--on">•</div><div class="sota-box sota-box--on">•</div><div class="sota-box sota-box--on">•</div><div class="sota-box sota-box--on">•</div><div class="sota-box"></div><div class="sota-box"></div></div><div class="sota-keys" data-ui="ury-self-order-screen-tablet-assign.keypad"><button type="button" class="sota-key">1</button><button type="button" class="sota-key">2</button><button type="button" class="sota-key">3</button><button type="button" class="sota-key">4</button><button type="button" class="sota-key">5</button><button type="button" class="sota-key">6</button><button type="button" class="sota-key">7</button><button type="button" class="sota-key">8</button><button type="button" class="sota-key">9</button><div></div><button type="button" class="sota-key">0</button><button type="button" class="sota-key">⌫</button></div>
<button type="button" class="sota-btn" data-ui="ury-self-order-screen-tablet-assign.continue">متابعة</button></div></div>
</div>
</body></html>
