<!doctype html>
<html lang="en" data-system="la" data-theme="light">
<head><meta charset="utf-8"><title>Loyal Arrow KPI card (label, big value, sub, optional delta)</title>
<link rel="stylesheet" href="../../../tokens/css/fonts.css">
<link rel="stylesheet" href="../../../tokens/css/frappe-desk.css">
<link rel="stylesheet" href="../../../tokens/css/la-desk-vars.css">
<link rel="stylesheet" href="../../../tokens/css/la-desk-base.css">
<link rel="stylesheet" href="../../../tokens/css/la-desk-components.css">
<link rel="stylesheet" href="../../../tokens/css/la-desk-data.css">
<link rel="stylesheet" href="../../../tokens/css/la-desk-widgets.css">
<style>html,body{margin:0}*{animation:none!important;transition:none!important;caret-color:transparent!important}#ui-kit-stage{position:absolute;left:0;top:0;width:293px;min-height:114px;padding:12px;box-sizing:border-box}</style></head>
<body class="la-root la-page"><div id="ui-kit-stage">
<div class="la-kpi la-widget" data-ui="la-kpi-card" data-state="loading">
  <div class="la-kpi-label" data-ui="la-kpi-card.label">Members</div>
  <div class="la-kpi-row"><span class="la-kpi-value la-num" data-ui="la-kpi-card.value">300</span><span class="la-kpi-delta la-num" data-ui="la-kpi-card.delta"></span></div>
  <div class="la-kpi-sub" data-ui="la-kpi-card.sub">291 active</div>
</div>

</div></body></html>
