<div class="la-kpi la-widget" data-ui="la-kpi-card">
  <div class="la-kpi-label" data-ui="la-kpi-card.label">{{label}}</div>
  <div class="la-kpi-row"><span class="la-kpi-value la-num" data-ui="la-kpi-card.value">{{value}}</span><span class="la-kpi-delta la-num" data-ui="la-kpi-card.delta">{{delta}}</span></div>
  <div class="la-kpi-sub" data-ui="la-kpi-card.sub">{{sub}}</div>
</div>
