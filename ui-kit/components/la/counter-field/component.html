<div class="lc-field" data-ui="la-counter-field">
  <label class="lc-label" data-ui="la-counter-field.label">{{label}}</label>
  <div class="lc-input" data-ui="la-counter-field.input"><span class="lc-value" data-ui="la-counter-field.value">{{value}}</span><span class="lc-ph" data-ui="la-counter-field.placeholder">{{placeholder}}</span></div>
  <div class="lc-error" data-ui="la-counter-field.error">{{error}}</div>
</div>
