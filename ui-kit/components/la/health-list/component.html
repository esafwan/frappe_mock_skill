<div class="la-hl is-{{state}}" data-ui="la-health-list">
  <div class="la-hl-row" data-ui="la-health-list.row-1"><span class="la-hl-label" data-ui="la-health-list.row-label-1">{{rowLabel}}</span><span class="la-hl-value la-num" data-ui="la-health-list.row-value-1">{{rowValue}}</span><span class="la-pill" data-ui="la-health-list.row-pill-1">{{rowPill}}</span></div>
  <div class="la-hl-row is-flag" data-ui="la-health-list.row-2"><span class="la-hl-label" data-ui="la-health-list.row-label-2">{{rowLabel2}}</span><span class="la-hl-value la-num" data-ui="la-health-list.row-value-2">{{rowValue2}}</span><span class="la-pill" data-ui="la-health-list.row-pill-2">{{rowPill2}}</span></div>
  <div class="la-hl-row" data-ui="la-health-list.row-3"><span class="la-hl-label" data-ui="la-health-list.row-label-3">{{rowLabel3}}</span><span class="la-hl-value la-num" data-ui="la-health-list.row-value-3">{{rowValue3}}</span><span class="la-pill" data-ui="la-health-list.row-pill-3">{{rowPill3}}</span></div>
</div>
