<!doctype html>
<html lang="ar" data-system="la" data-theme="light" dir="rtl">
<head><meta charset="utf-8"><title>Counter member result card (found / not found / loading)</title>
<link rel="stylesheet" href="../../../../tokens/css/fonts.css">
<link rel="stylesheet" href="../../../../tokens/css/frappe-desk.css">
<link rel="stylesheet" href="../../../../tokens/css/la-desk-vars.css">
<link rel="stylesheet" href="../../../../tokens/css/la-desk-base.css">
<link rel="stylesheet" href="../../../../tokens/css/la-desk-components.css">
<link rel="stylesheet" href="../../../../tokens/css/la-desk-data.css">
<link rel="stylesheet" href="../../../../tokens/css/la-counter.css">
<style>html,body{margin:0}*{animation:none!important;transition:none!important;caret-color:transparent!important}#ui-kit-stage{position:absolute;left:0;top:0;width:390px;min-height:844px}</style></head>
<body class="la-root"><div id="ui-kit-stage">
<div class="lc-result" data-ui="la-member-result" data-state="loading">
  <div class="lc-result-head">
    <div><div class="lc-result-name" data-ui="la-member-result.name">آشا راو</div><div class="lc-result-mobile" data-ui="la-member-result.mobile">******0000</div></div>
    <div class="lc-bal"><div class="lc-bal-label" data-ui="la-member-result.balance-label">الرصيد</div><div class="lc-bal-value la-num" data-ui="la-member-result.balance">٣٤٠</div></div>
  </div>
  <div class="lc-chips"><span class="lc-chip is-amber" data-ui="la-member-result.tier">ذهبي</span><span class="lc-chip is-blue" data-ui="la-member-result.pending">٢٠ معلّقة</span><span class="lc-chip is-red" data-ui="la-member-result.expiring">٥٠ تنتهي</span></div>
  <div class="lc-btn" data-state="primary" data-ui="la-member-result.continue"><span data-ui="la-member-result.continue-label">متابعة إلى الفاتورة</span></div>
  <div class="lc-result-none" data-ui="la-member-result.not-found">لم يتم العثور على عضو</div>
  <div class="lc-skel" data-ui="la-member-result.skeleton"><i></i><i></i><i></i></div>
</div>

</div></body></html>
