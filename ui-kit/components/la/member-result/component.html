<div class="lc-result" data-ui="la-member-result">
  <div class="lc-result-head">
    <div><div class="lc-result-name" data-ui="la-member-result.name">{{name}}</div><div class="lc-result-mobile" data-ui="la-member-result.mobile">{{maskedMobile}}</div></div>
    <div class="lc-bal"><div class="lc-bal-label" data-ui="la-member-result.balance-label">{{balanceLabel}}</div><div class="lc-bal-value la-num" data-ui="la-member-result.balance">{{balance}}</div></div>
  </div>
  <div class="lc-chips"><span class="lc-chip is-amber" data-ui="la-member-result.tier">{{tierChip}}</span><span class="lc-chip is-blue" data-ui="la-member-result.pending">{{pendingChip}}</span><span class="lc-chip is-red" data-ui="la-member-result.expiring">{{expiringChip}}</span></div>
  <div class="lc-btn" data-state="primary" data-ui="la-member-result.continue"><span data-ui="la-member-result.continue-label">{{continueButton}}</span></div>
  <div class="lc-result-none" data-ui="la-member-result.not-found">{{notFoundText}}</div>
  <div class="lc-skel" data-ui="la-member-result.skeleton"><i></i><i></i><i></i></div>
</div>
