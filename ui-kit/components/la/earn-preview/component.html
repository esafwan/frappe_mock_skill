<div class="la-earn" data-ui="la-earn-preview">
  <div class="la-earn-in is-wide" data-ui="la-earn-preview.bill"><span class="la-fx-label">{{billLabel}}</span><span class="la-fx-input" data-ui="la-earn-preview.bill-input"><span class="la-fx-val">{{billAmount}}</span></span></div>
  <div class="la-earn-in is-narrow" data-ui="la-earn-preview.item"><span class="la-fx-label">{{itemLabel}}</span><span class="la-fx-input" data-ui="la-earn-preview.item-input"><span class="la-fx-val">{{itemCode}}</span></span></div>
  <div class="la-earn-hint" data-ui="la-earn-preview.hint">{{typingHint}}</div>
  <div class="la-earn-out" data-ui="la-earn-preview.result"><span data-ui="la-earn-preview.points">{{pointsEarned}}</span><span data-ui="la-earn-preview.worth">{{worthLabel}} {{worthAmount}}</span><span data-ui="la-earn-preview.line-1">{{resultLines}}</span><span data-ui="la-earn-preview.line-2">{{resultLine2}}</span><span data-ui="la-earn-preview.line-3">{{resultLine3}}</span></div>
</div>
