<!doctype html>
<html lang="ar" data-system="la" data-theme="light" dir="rtl">
<head><meta charset="utf-8"><title>Stacked share bar with legend</title>
<link rel="stylesheet" href="../../../tokens/css/fonts.css">
<link rel="stylesheet" href="../../../tokens/css/frappe-desk.css">
<link rel="stylesheet" href="../../../tokens/css/la-desk-vars.css">
<link rel="stylesheet" href="../../../tokens/css/la-desk-base.css">
<link rel="stylesheet" href="../../../tokens/css/la-desk-components.css">
<link rel="stylesheet" href="../../../tokens/css/la-desk-data.css">
<link rel="stylesheet" href="../../../tokens/css/la-desk-chart.css">
<style>html,body{margin:0}*{animation:none!important;transition:none!important;caret-color:transparent!important}#ui-kit-stage{position:absolute;left:0;top:0;width:580px;min-height:240px;padding:16px;box-sizing:border-box}</style></head>
<body class="la-root"><div id="ui-kit-stage">
<section class="la-card la-cw" data-ui="la-stack-bar">
  <h3 class="la-card-title" data-ui="la-stack-bar.title">النقاط حسب المصدر</h3>
  <div class="la-sbar" data-ui="la-stack-bar.bar"><div class="la-sbar-fill la-w-100" data-ui="la-stack-bar.fill"><i class="la-seg s1 la-w-46" data-ui="la-stack-bar.seg-1"></i><i class="la-seg s2 la-w-32" data-ui="la-stack-bar.seg-2"></i><i class="la-seg s3 la-w-22" data-ui="la-stack-bar.seg-3"></i></div></div>
  <div class="la-legend">
    <div class="la-legend-row" data-ui="la-stack-bar.row-1"><i class="la-dot s1"></i><span class="la-legend-label">المشتريات</span><span class="la-legend-val"><span class="la-lv la-num">١٨٤٠٠</span><span class="la-lv la-num">٤٦%</span></span></div>
    <div class="la-legend-row" data-ui="la-stack-bar.row-2"><i class="la-dot s2"></i><span class="la-legend-label">العروض</span><span class="la-legend-val"><span class="la-lv la-num">١٢٦٠٠</span><span class="la-lv la-num">٣٢%</span></span></div>
    <div class="la-legend-row" data-ui="la-stack-bar.row-3"><i class="la-dot s3"></i><span class="la-legend-label">الإحالات</span><span class="la-legend-val"><span class="la-lv la-num">٨٨٠٠</span><span class="la-lv la-num">٢٢%</span></span></div>
  </div>
</section>

</div></body></html>
