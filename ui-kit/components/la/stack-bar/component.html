<section class="la-card la-cw" data-ui="la-stack-bar">
  <h3 class="la-card-title" data-ui="la-stack-bar.title">{{title}}</h3>
  <div class="la-sbar" data-ui="la-stack-bar.bar"><div class="la-sbar-fill la-w-100" data-ui="la-stack-bar.fill"><i class="la-seg s1 la-w-46" data-ui="la-stack-bar.seg-1"></i><i class="la-seg s2 la-w-32" data-ui="la-stack-bar.seg-2"></i><i class="la-seg s3 la-w-22" data-ui="la-stack-bar.seg-3"></i></div></div>
  <div class="la-legend">
    <div class="la-legend-row" data-ui="la-stack-bar.row-1"><i class="la-dot s1"></i><span class="la-legend-label">{{legend1Label}}</span><span class="la-legend-val"><span class="la-lv la-num">{{legend1Value}}</span><span class="la-lv la-num">{{legend1Pct}}</span></span></div>
    <div class="la-legend-row" data-ui="la-stack-bar.row-2"><i class="la-dot s2"></i><span class="la-legend-label">{{legend2Label}}</span><span class="la-legend-val"><span class="la-lv la-num">{{legend2Value}}</span><span class="la-lv la-num">{{legend2Pct}}</span></span></div>
    <div class="la-legend-row" data-ui="la-stack-bar.row-3"><i class="la-dot s3"></i><span class="la-legend-label">{{legend3Label}}</span><span class="la-legend-val"><span class="la-lv la-num">{{legend3Value}}</span><span class="la-lv la-num">{{legend3Pct}}</span></span></div>
  </div>
</section>
