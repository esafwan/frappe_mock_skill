<div class="la-chart la-widget" data-ui="la-chart-line">
  <div class="la-chart-title" data-ui="la-chart-line.title">{{title}}</div>
  <div class="la-chart-sub" data-ui="la-chart-line.subtitle">{{subtitle}}</div>
  <div class="la-chart-toolbar" data-ui="la-chart-line.toolbar"></div>
  <div class="la-plot" data-ui="la-chart-line.plot">
    <div class="la-cgrid"><i></i><i></i><i></i><i></i></div>
    <div class="la-ys" data-ui="la-chart-line.y-axis"><span data-ui="la-chart-line.y-1">{{yLabels_4}}</span><span data-ui="la-chart-line.y-2">{{yLabels_3}}</span><span data-ui="la-chart-line.y-3">{{yLabels_2}}</span><span data-ui="la-chart-line.y-4">{{yLabels_1}}</span></div>
    <div class="la-xs" data-ui="la-chart-line.x-axis"><span data-ui="la-chart-line.x-1">{{xLabels_1}}</span><span data-ui="la-chart-line.x-2">{{xLabels_2}}</span><span data-ui="la-chart-line.x-3">{{xLabels_3}}</span><span data-ui="la-chart-line.x-4">{{xLabels_4}}</span></div>
    <div class="la-chart-empty" data-ui="la-chart-line.empty">{{empty_text}}</div>
    <div class="la-series" data-ui="la-chart-line.series">
      <svg class="la-svg" viewBox="0 0 423 345" aria-hidden="true"><path class="la-line" pathLength="1" d="{{path_a}}" data-ui="la-chart-line.line-a"/><path class="la-line is-b" pathLength="1" d="{{path_b}}" data-ui="la-chart-line.line-b"/></svg>
    </div>
    <div class="la-chart-legend" data-ui="la-chart-line.legend"><span><i></i>{{legend_a}}</span><span><i></i>{{legend_b}}</span></div>
  </div>
</div>
