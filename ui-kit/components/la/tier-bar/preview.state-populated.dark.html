<!doctype html>
<html lang="en" data-system="la" data-theme="dark">
<head><meta charset="utf-8"><title>Members by tier bar</title>
<link rel="stylesheet" href="../../../tokens/css/fonts.css">
<link rel="stylesheet" href="../../../tokens/css/frappe-desk.css">
<link rel="stylesheet" href="../../../tokens/css/la-desk-vars.css">
<link rel="stylesheet" href="../../../tokens/css/la-desk-base.css">
<link rel="stylesheet" href="../../../tokens/css/la-desk-components.css">
<link rel="stylesheet" href="../../../tokens/css/la-desk-data.css">
<link rel="stylesheet" href="../../../tokens/css/la-desk-chart.css">
<style>html,body{margin:0}*{animation:none!important;transition:none!important;caret-color:transparent!important}#ui-kit-stage{position:absolute;left:0;top:0;width:580px;min-height:220px;padding:16px;box-sizing:border-box}</style></head>
<body class="la-root"><div id="ui-kit-stage">
<section class="la-card la-cw" data-ui="la-tier-bar" data-state="populated">
  <h3 class="la-card-title" data-ui="la-tier-bar.title">Members by tier</h3>
  <div class="la-sbar" data-ui="la-tier-bar.bar"><div class="la-sbar-fill la-w-100"><i class="la-seg s1 la-w-40" data-ui="la-tier-bar.seg-1"></i><i class="la-seg s2 la-w-60" data-ui="la-tier-bar.seg-2"></i></div></div>
  <div class="la-legend">
    <div class="la-legend-row" data-ui="la-tier-bar.row-1"><i class="la-dot s1"></i><span class="la-legend-label">Barista</span><span class="la-legend-val"><span class="la-lv la-num">120</span><span class="la-lv la-num">40%</span></span></div>
    <div class="la-legend-row" data-ui="la-tier-bar.row-2"><i class="la-dot s2"></i><span class="la-legend-label">No tier</span><span class="la-legend-val"><span class="la-lv la-num">180</span><span class="la-lv la-num">60%</span></span></div>
  </div>
</section>

</div></body></html>
