<section class="la-card la-cw" data-ui="la-tier-bar">
  <h3 class="la-card-title" data-ui="la-tier-bar.title">{{title}}</h3>
  <div class="la-sbar" data-ui="la-tier-bar.bar"><div class="la-sbar-fill la-w-100"><i class="la-seg s1 la-w-40" data-ui="la-tier-bar.seg-1"></i><i class="la-seg s2 la-w-60" data-ui="la-tier-bar.seg-2"></i></div></div>
  <div class="la-legend">
    <div class="la-legend-row" data-ui="la-tier-bar.row-1"><i class="la-dot s1"></i><span class="la-legend-label">{{tierLabel}}</span><span class="la-legend-val"><span class="la-lv la-num">{{tierCount}}</span><span class="la-lv la-num">{{tierPct}}</span></span></div>
    <div class="la-legend-row" data-ui="la-tier-bar.row-2"><i class="la-dot s2"></i><span class="la-legend-label">{{tier2Label}}</span><span class="la-legend-val"><span class="la-lv la-num">{{tier2Count}}</span><span class="la-lv la-num">{{tier2Pct}}</span></span></div>
  </div>
</section>
