<div class="la-cshell is-{{state}}" data-ui="la-counter-shell">
  <header class="la-cshell-bar" data-ui="la-counter-shell.topbar"><span class="la-cshell-title" data-ui="la-counter-shell.title">{{title}}</span><span class="la-cshell-badge" data-ui="la-counter-shell.user-badge">{{userBadge}}</span></header>
  <div class="la-cshell-body" data-ui="la-counter-shell.body">
    <h1 class="la-cshell-screen" data-ui="la-counter-shell.screen-title">{{screenTitle}}</h1>
    <div class="la-cshell-bill" data-ui="la-counter-shell.bill-for">{{billLabel}} <b>{{billFor}}</b></div>
    <!--la:content-->
  </div>
</div>
