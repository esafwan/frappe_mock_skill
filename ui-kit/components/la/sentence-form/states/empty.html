<section class="la-card la-sf" data-ui="la-sentence-form">
  <h3 class="la-sf-title" data-ui="la-sentence-form.title">{{title}}</h3>
  <div class="la-sf-pair">
    <label class="la-sf-col la-sf-col-a"><span class="la-lbl">{{lbl_name}}</span><div class="la-fld is-empty" data-ui="la-sentence-form.name">{{placeholder_name}}</div></label>
    <label class="la-sf-col la-sf-col-b"><span class="la-lbl">{{lbl_kind}}</span><div class="la-fld is-empty" data-ui="la-sentence-form.kind"></div></label>
  </div>
  <div class="la-sf-line is-tall"><span class="la-lbl">{{lbl_earns}}</span></div>
  <div class="la-fld is-empty" data-ui="la-sentence-form.count">{{placeholder_count}}</div><div class="la-fld is-empty" data-ui="la-sentence-form.unit"></div>
  <div class="la-sf-line is-tall"><span class="la-lbl">{{lbl_from}}</span></div>
  <div class="la-fld is-empty" data-ui="la-sentence-form.source">{{placeholder_source}}</div>
  <div class="la-sf-line"><span class="la-lbl">{{lbl_names}}</span></div>
  <div class="la-fld la-fld-area is-empty" data-ui="la-sentence-form.names"></div>
  <div class="la-sf-line"><span class="la-lbl">{{lbl_during}}</span></div>
  <div class="la-fld is-empty" data-ui="la-sentence-form.window">{{placeholder_window}}</div>
  <div class="la-sf-line is-tall"><span class="la-lbl">{{lbl_and}}</span></div>
  <div class="la-fld is-empty" data-ui="la-sentence-form.points">{{placeholder_count}}</div>
  <div class="la-sf-line is-tall"><span class="la-lbl">{{lbl_upto}}</span></div>
  <div class="la-fld is-empty" data-ui="la-sentence-form.cap">{{placeholder_count}}</div>
  <div class="la-sf-line"><span class="la-lbl">{{lbl_per}}</span></div>
  <p class="la-sf-summary is-hint" data-ui="la-sentence-form.summary">{{summary_empty}}</p>
  <div class="la-sf-actions"><span class="la-btn" data-ui="la-sentence-form.btn-check">{{btn_check}}</span><span class="la-btn is-primary" data-ui="la-sentence-form.btn-save">{{btn_save}}</span></div>
</section>
