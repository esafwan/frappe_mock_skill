<section class="la-card la-sf" data-ui="la-sentence-form">
  <h3 class="la-sf-title" data-ui="la-sentence-form.title">{{title}}</h3>
  <div class="la-sf-pair">
    <label class="la-sf-col la-sf-col-a"><span class="la-lbl">{{lbl_name}}</span><div class="la-fld" data-ui="la-sentence-form.name">{{name}}</div></label>
    <label class="la-sf-col la-sf-col-b"><span class="la-lbl">{{lbl_kind}}</span><div class="la-fld" data-ui="la-sentence-form.kind">{{kind}}</div></label>
  </div>
  <div class="la-sf-line is-tall"><span class="la-lbl">{{lbl_earns}}</span></div>
  <div class="la-fld" data-ui="la-sentence-form.count">{{count}}</div><div class="la-fld" data-ui="la-sentence-form.unit">{{unit}}</div>
  <div class="la-sf-line is-tall"><span class="la-lbl">{{lbl_from}}</span></div>
  <div class="la-fld" data-ui="la-sentence-form.source">{{source}}</div>
  <div class="la-sf-line"><span class="la-lbl">{{lbl_names}}</span></div>
  <div class="la-fld la-fld-area" data-ui="la-sentence-form.names">{{names}}</div>
  <div class="la-sf-line"><span class="la-lbl">{{lbl_during}}</span></div>
  <div class="la-fld" data-ui="la-sentence-form.window">{{window}}</div>
  <div class="la-sf-line is-tall"><span class="la-lbl">{{lbl_and}}</span></div>
  <div class="la-fld is-focus" data-ui="la-sentence-form.points">{{typed_points}}<span class="la-caret"></span></div>
  <div class="la-sf-line is-tall"><span class="la-lbl">{{lbl_upto}}</span></div>
  <div class="la-fld" data-ui="la-sentence-form.cap">{{cap}}</div>
  <div class="la-sf-line"><span class="la-lbl">{{lbl_per}}</span></div>
  <p class="la-sf-summary" data-ui="la-sentence-form.summary">{{summary_typing}}</p>
  <div class="la-sf-actions"><span class="la-btn" data-ui="la-sentence-form.btn-check">{{btn_check}}</span><span class="la-btn is-primary" data-ui="la-sentence-form.btn-save">{{btn_save}}</span></div>
</section>
