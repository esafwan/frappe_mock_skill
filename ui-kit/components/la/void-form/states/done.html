<div class="la-ct" data-ui="la-void-form">
<div class="la-ct-bar" data-ui="la-void-form.bar"><span>{{appName}}</span><span class="la-ct-bar-user" data-ui="la-void-form.user">{{cashier}}</span></div>
<div class="la-ct-main" data-ui="la-void-form.main">
<div class="la-ct-h1" data-ui="la-void-form.title">{{title}}</div>
<div class="la-ct-card is-done" data-ui="la-void-form.result"><div class="la-ct-done-title" data-ui="la-void-form.done-title">{{doneTitle}}</div><div class="la-ct-kv" data-ui="la-void-form.done-reason">{{doneReason}}</div><div class="la-ct-line" data-ui="la-void-form.taken-back">{{takenBack}}</div><div class="la-ct-line" data-ui="la-void-form.returned">{{returned}}</div><div class="la-ct-note" data-ui="la-void-form.shortfall">{{shortfall}}</div><div class="la-ct-line" data-ui="la-void-form.balance">{{balanceNow}}</div></div>
<div class="la-ct-btn is-mt" data-ui="la-void-form.back">{{backBtn}}</div>
</div>
</div>
