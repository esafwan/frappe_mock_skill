<!doctype html>
<html lang="en" data-system="la" data-theme="dark">
<head><meta charset="utf-8"><title>Counter: undo (void) bill form</title>
<link rel="stylesheet" href="../../../tokens/css/fonts.css">
<link rel="stylesheet" href="../../../tokens/css/frappe-desk.css">
<link rel="stylesheet" href="../../../tokens/css/la-desk-vars.css">
<link rel="stylesheet" href="../../../tokens/css/la-desk-base.css">
<link rel="stylesheet" href="../../../tokens/css/la-desk-components.css">
<link rel="stylesheet" href="../../../tokens/css/la-desk-data.css">
<link rel="stylesheet" href="../../../tokens/css/la-counter-base.css">
<style>html,body{margin:0}*{animation:none!important;transition:none!important;caret-color:transparent!important}#ui-kit-stage{position:absolute;left:0;top:0;width:420px;min-height:820px}</style></head>
<body class="la-root"><div id="ui-kit-stage">
<div class="la-ct" data-ui="la-void-form" data-state="done">
<div class="la-ct-bar" data-ui="la-void-form.bar"><span>Counter</span><span class="la-ct-bar-user" data-ui="la-void-form.user">qa.cashier@example.test</span></div>
<div class="la-ct-main" data-ui="la-void-form.main">
<div class="la-ct-h1" data-ui="la-void-form.title">Undo bill</div>
<div class="la-ct-card is-done" data-ui="la-void-form.result"><div class="la-ct-done-title" data-ui="la-void-form.done-title">Bill undone</div><div class="la-ct-kv" data-ui="la-void-form.done-reason">Reason: Wrong amount</div><div class="la-ct-line" data-ui="la-void-form.taken-back">Points taken back: 10</div><div class="la-ct-line" data-ui="la-void-form.returned">Points redeemed on this bill were returned: 20</div><div class="la-ct-note" data-ui="la-void-form.shortfall">40 points could not be taken back because the member already spent them. A manager has been notified.</div><div class="la-ct-line" data-ui="la-void-form.balance">Balance now 0 points</div></div>
<div class="la-ct-btn is-mt" data-ui="la-void-form.back">Back to counter</div>
</div>
</div>

</div></body></html>
