<div class="la-ct" data-ui="la-void-form">
<div class="la-ct-bar" data-ui="la-void-form.bar"><span>{{appName}}</span><span class="la-ct-bar-user" data-ui="la-void-form.user">{{cashier}}</span></div>
<div class="la-ct-main" data-ui="la-void-form.main">
<div class="la-ct-h1" data-ui="la-void-form.title">{{title}}</div>
<div class="la-ct-sub" data-ui="la-void-form.bill">{{billId}}</div>
<div class="la-ct-card" data-ui="la-void-form.details"><div data-ui="la-void-form.amount"><span data-ui="la-void-form.amount-label">{{amountLabel}}</span> <span class="la-num" data-ui="la-void-form.amount-value">{{amountValue}}</span></div><div data-ui="la-void-form.earned">{{earnedLine}}</div><div data-ui="la-void-form.time">{{timeLine}}</div><div data-ui="la-void-form.cashier">{{cashierLine}}</div><div data-ui="la-void-form.status">{{statusLine}}</div></div>
<div class="la-ct-hint is-mt" data-ui="la-void-form.policy">{{policyText}}</div>
<div class="la-ct-gap"></div>
<div class="la-ct-label is-sm" data-ui="la-void-form.reason-label">{{reasonLabel}}</div>
<div class="la-ct-field is-select is-sm" data-ui="la-void-form.reason">{{reason}}</div>
<div class="la-ct-btn is-lg is-danger is-mt" data-ui="la-void-form.submit">{{button}}</div>
</div>
</div>
