<!doctype html>
<html lang="en" data-system="la" data-theme="dark">
<head><meta charset="utf-8"><title>Report filters (period pills, program, more filters, reset)</title>
<link rel="stylesheet" href="../../../tokens/css/fonts.css">
<link rel="stylesheet" href="../../../tokens/css/frappe-desk.css">
<link rel="stylesheet" href="../../../tokens/css/la-desk-vars.css">
<link rel="stylesheet" href="../../../tokens/css/la-desk-base.css">

<style>html,body{margin:0}*{animation:none!important;transition:none!important;caret-color:transparent!important}#ui-kit-stage{position:absolute;left:0;top:0;width:1127px;min-height:63px;padding:16px;box-sizing:border-box}</style></head>
<body class="la-root"><div id="ui-kit-stage">
<div class="la-rfilters" data-ui="la-report-filters" data-state="active-custom" data-state="active-custom">

  <div class="la-rf-col la-rf-prog"><span class="la-rf-label">Program</span><span class="la-rf-field" data-ui="la-report-filters.program-value">Hyper Rewards</span></div>
  <span class="la-rf-more" data-ui="la-report-filters.more">More filters</span><span class="la-rf-reset" data-ui="la-report-filters.reset">Reset</span>
</div>

</div></body></html>
