<!doctype html>
<html lang="en" data-system="la" data-theme="light">
<head><meta charset="utf-8"><title>Retail mapping inbox (tabs, status filter, reason, rows with category picker)</title>
<link rel="stylesheet" href="../../../tokens/css/fonts.css">
<link rel="stylesheet" href="../../../tokens/css/frappe-desk.css">
<link rel="stylesheet" href="../../../tokens/css/la-desk-vars.css">
<link rel="stylesheet" href="../../../tokens/css/la-desk-base.css">
<link rel="stylesheet" href="../../../tokens/css/la-desk-components.css">
<link rel="stylesheet" href="../../../tokens/css/la-desk-data.css">
<link rel="stylesheet" href="../../../tokens/css/la-desk-inbox.css">
<link rel="stylesheet" href="../../../tokens/css/la-desk-nav.css">
<link rel="stylesheet" href="../../../tokens/css/la-desk-admin.css">
<style>html,body{margin:0}*{animation:none!important;transition:none!important;caret-color:transparent!important}#ui-kit-stage{position:absolute;left:0;top:0;width:1440px;min-height:900px}</style></head>
<body class="la-root"><div id="ui-kit-stage">
<div class="la-inbox" data-ui="la-retail-mapping-inbox" data-state="zero" data-state="zero">
  <p class="la-inbox-desc" data-ui="la-retail-mapping-inbox.desc">Product catalogue, categories and the rules that earn on them.</p>
  <div class="la-tabs" data-ui="la-retail-mapping-inbox.tabs" data-state="active-3" role="tablist"><a class="la-tab" data-ui="la-retail-mapping-inbox.tab-1" role="tab">Catalogue</a><a class="la-tab" data-ui="la-retail-mapping-inbox.tab-2" role="tab">Categories</a><a class="la-tab" data-ui="la-retail-mapping-inbox.tab-3" role="tab">Mapping inbox</a><a class="la-tab" data-ui="la-retail-mapping-inbox.tab-4" role="tab">Retail settings</a></div>
  <div class="la-inbox-filters" data-ui="la-retail-mapping-inbox.filters"><div class="la-segmented" data-ui="la-retail-mapping-inbox.status" data-state="with-count" role="tablist"><span class="la-seg-opt" data-ui="la-retail-mapping-inbox.status-open" role="tab">Open<span class="la-seg-count" data-ui="la-retail-mapping-inbox.status-count">0</span></span><span class="la-seg-opt" data-ui="la-retail-mapping-inbox.status-mapped" role="tab">Mapped</span><span class="la-seg-opt" data-ui="la-retail-mapping-inbox.status-aside" role="tab">Set aside</span></div><div class="la-inbox-reason" data-ui="la-retail-mapping-inbox.reason"><span class="la-fx-label">Reason</span><span class="la-field-value" data-ui="la-retail-mapping-inbox.reason-value">Any</span></div></div>
  <div class="la-inbox-empty" data-ui="la-retail-mapping-inbox.empty"><div class="la-inbox-empty-title" data-ui="la-retail-mapping-inbox.empty-title">Nothing to map</div><div class="la-inbox-empty-body" data-ui="la-retail-mapping-inbox.empty-body">Every item the till has seen is mapped to a category.</div></div>
</div>
</div></body></html>
