<div class="la-inbox" data-ui="la-retail-mapping-inbox" data-state="{{state}}">
  <p class="la-inbox-desc" data-ui="la-retail-mapping-inbox.desc">{{desc}}</p>
  <div class="la-tabs" data-ui="la-retail-mapping-inbox.tabs" data-state="active-3" role="tablist"><a class="la-tab" data-ui="la-retail-mapping-inbox.tab-1" role="tab">{{tab1}}</a><a class="la-tab" data-ui="la-retail-mapping-inbox.tab-2" role="tab">{{tab2}}</a><a class="la-tab" data-ui="la-retail-mapping-inbox.tab-3" role="tab">{{tab3}}</a><a class="la-tab" data-ui="la-retail-mapping-inbox.tab-4" role="tab">{{tab4}}</a></div>
  <div class="la-inbox-filters" data-ui="la-retail-mapping-inbox.filters"><div class="la-segmented" data-ui="la-retail-mapping-inbox.status" data-state="with-count" role="tablist"><span class="la-seg-opt" data-ui="la-retail-mapping-inbox.status-open" role="tab">{{segOpen}}<span class="la-seg-count" data-ui="la-retail-mapping-inbox.status-count">{{count}}</span></span><span class="la-seg-opt" data-ui="la-retail-mapping-inbox.status-mapped" role="tab">{{segMapped}}</span><span class="la-seg-opt" data-ui="la-retail-mapping-inbox.status-aside" role="tab">{{segAside}}</span></div><div class="la-inbox-reason" data-ui="la-retail-mapping-inbox.reason"><span class="la-fx-label">{{reasonLabel}}</span><span class="la-field-value" data-ui="la-retail-mapping-inbox.reason-value">{{reasonValue}}</span></div></div>
  <div class="la-inbox-empty" data-ui="la-retail-mapping-inbox.empty"><div class="la-inbox-empty-title" data-ui="la-retail-mapping-inbox.empty-title">{{emptyTitle}}</div><div class="la-inbox-empty-body" data-ui="la-retail-mapping-inbox.empty-body">{{emptyBody}}</div></div>
</div>
