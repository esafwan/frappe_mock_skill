<!doctype html>
<html lang="en" data-system="la" data-theme="dark">
<head><meta charset="utf-8"><title>Inline panel (collapsible card with form)</title>
<link rel="stylesheet" href="../../../tokens/css/fonts.css">
<link rel="stylesheet" href="../../../tokens/css/frappe-desk.css">
<link rel="stylesheet" href="../../../tokens/css/la-desk-vars.css">
<link rel="stylesheet" href="../../../tokens/css/la-desk-base.css">
<link rel="stylesheet" href="../../../tokens/css/la-desk-components.css">
<link rel="stylesheet" href="../../../tokens/css/la-desk-data.css">
<link rel="stylesheet" href="../../../tokens/css/la-desk-components.css">
<style>html,body{margin:0}*{animation:none!important;transition:none!important;caret-color:transparent!important}#ui-kit-stage{position:absolute;left:0;top:0;width:1440px;min-height:900px;padding:16px;box-sizing:border-box}</style></head>
<body class="la-root"><div id="ui-kit-stage">
<section class="la-ipanel is-expanded" data-ui="la-inline-panel" data-state="expanded">
  <div class="la-ipanel-head" data-ui="la-inline-panel.head"><span class="la-ipanel-title" data-ui="la-inline-panel.title">New mission</span><span class="la-ip-chev" data-ui="la-inline-panel.chevron"></span></div>
  <div class="la-ipanel-items is-summary" data-ui="la-inline-panel.items-summary">Buy 4 bills from Food/Dates during Ramadan 2026</div>
  <div class="la-ipanel-body" data-ui="la-inline-panel.body">
    <div class="la-ip-label" data-ui="la-inline-panel.field-label">Name</div>
    <div class="la-ip-input" data-ui="la-inline-panel.form-fields">Dates and dairy habit</div>
    <div class="la-ipanel-items" data-ui="la-inline-panel.items">Buy 4 bills from Food/Dates during Ramadan 2026</div>
    <div class="la-ipanel-foot" data-ui="la-inline-panel.foot"><button type="button" class="la-pa" data-ui="la-inline-panel.button"><span>Save as draft</span></button></div>
  </div>
</section>

</div></body></html>
