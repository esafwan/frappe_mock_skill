<section class="la-ipanel is-{{state}}" data-ui="la-inline-panel">
  <div class="la-ipanel-head" data-ui="la-inline-panel.head"><span class="la-ipanel-title" data-ui="la-inline-panel.title">{{title}}</span><span class="la-ip-chev" data-ui="la-inline-panel.chevron"></span></div>
  <div class="la-ipanel-items is-summary" data-ui="la-inline-panel.items-summary">{{items}}</div>
  <div class="la-ipanel-body" data-ui="la-inline-panel.body">
    <div class="la-ip-label" data-ui="la-inline-panel.field-label">{{fieldLabel}}</div>
    <div class="la-ip-input" data-ui="la-inline-panel.form-fields">{{formFields}}</div>
    <div class="la-ipanel-items" data-ui="la-inline-panel.items">{{items}}</div>
    <div class="la-ipanel-foot" data-ui="la-inline-panel.foot"><button type="button" class="la-pa" data-ui="la-inline-panel.button"><span>{{button}}</span></button></div>
  </div>
</section>
