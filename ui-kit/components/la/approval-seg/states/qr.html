<div class="la-ct" data-ui="la-approval-seg">
<div class="la-ct-bar" data-ui="la-approval-seg.bar"><span>{{appName}}</span><span class="la-ct-bar-user" data-ui="la-approval-seg.user">{{cashier}}</span></div>
<div class="la-ct-main" data-ui="la-approval-seg.main">
<div class="la-ct-sub" data-ui="la-approval-seg.member">{{billFor}} <b>{{memberName}}</b></div>
<div class="la-ct-label" data-ui="la-approval-seg.heading">{{heading}}</div>
<div class="la-ct-field la-num" data-ui="la-approval-seg.points">{{pointsValue}}</div>
<div class="la-ct-hint" data-ui="la-approval-seg.limit">{{limitHint}}</div>
<div class="la-ct-spacer is-sp14"></div>
<div class="la-ct-label is-sm" data-ui="la-approval-seg.label">{{approvedBy}}</div>
<div class="la-ct-seg" data-ui="la-approval-seg.seg">
  <div class="la-ct-seg-opt is-on" data-ui="la-approval-seg.opt-qr">{{option1}}</div>
  <div class="la-ct-seg-opt" data-ui="la-approval-seg.opt-otp">{{option2}}</div>
  <div class="la-ct-seg-opt" data-ui="la-approval-seg.opt-pin">{{option3}}</div>
</div>
<div class="la-ct-btn is-strong is-mt8" data-ui="la-approval-seg.qr-action">{{qrBtn}}</div>
<div class="la-ct-spacer"></div>
<div class="la-ct-stack"><div class="la-ct-btn is-primary" data-ui="la-approval-seg.review">{{reviewBtn}}</div><div class="la-ct-btn is-strong" data-ui="la-approval-seg.skip">{{skipBtn}}</div></div>
</div>
</div>
