<!doctype html>
<html lang="ar" data-system="la" data-theme="light" dir="rtl">
<head><meta charset="utf-8"><title>Counter scan viewfinder with hint</title>
<link rel="stylesheet" href="../../../tokens/css/fonts.css">
<link rel="stylesheet" href="../../../tokens/css/frappe-desk.css">
<link rel="stylesheet" href="../../../tokens/css/la-desk-vars.css">
<link rel="stylesheet" href="../../../tokens/css/la-desk-base.css">
<link rel="stylesheet" href="../../../tokens/css/la-desk-media.css">
<style>html,body{margin:0}*{animation:none!important;transition:none!important;caret-color:transparent!important}#ui-kit-stage{position:absolute;left:0;top:0;width:390px;min-height:520px}</style></head>
<body class="la-root"><div id="ui-kit-stage">
<div class="la-scan" data-ui="la-scan-frame" data-state="scanning">
  <div class="la-scan-view" data-ui="la-scan-frame.view"><span class="la-scan-reticle" data-ui="la-scan-frame.reticle"></span></div>
  <div class="la-scan-hint" data-ui="la-scan-frame.hint">وجّه الكاميرا نحو رمز QR الخاص ببطاقة العضو.</div>
</div>

</div></body></html>
