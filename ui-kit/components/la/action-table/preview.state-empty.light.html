<!doctype html>
<html lang="en" data-system="la" data-theme="light">
<head><meta charset="utf-8"><title>Action table (rows with status pill and buttons)</title>
<link rel="stylesheet" href="../../../tokens/css/fonts.css">
<link rel="stylesheet" href="../../../tokens/css/frappe-desk.css">
<link rel="stylesheet" href="../../../tokens/css/la-desk-vars.css">
<link rel="stylesheet" href="../../../tokens/css/la-desk-base.css">
<link rel="stylesheet" href="../../../tokens/css/la-desk-components.css">
<link rel="stylesheet" href="../../../tokens/css/la-desk-data.css">
<link rel="stylesheet" href="../../../tokens/css/la-desk-admin.css">
<style>html,body{margin:0}*{animation:none!important;transition:none!important;caret-color:transparent!important}#ui-kit-stage{position:absolute;left:0;top:0;width:1440px;min-height:900px}</style></head>
<body class="la-root"><div id="ui-kit-stage">
<div class="la-tablewrap" data-ui="la-action-table" data-state="empty"><table class="la-table la-action-table"><thead><tr data-ui="la-action-table.head"><th data-ui="la-action-table.col-mission">Mission</th><th data-ui="la-action-table.col-kind">Kind</th><th data-ui="la-action-table.col-window">Window</th><th data-ui="la-action-table.col-reward">Reward</th><th data-ui="la-action-table.col-budget">Budget</th><th data-ui="la-action-table.col-status">Status</th><th data-ui="la-action-table.col-actions">Actions</th></tr></thead><tbody><tr class="la-tr-empty" data-ui="la-action-table.empty"><td colspan="7"><div class="la-emp"><strong data-ui="la-action-table.empty-title">No missions yet</strong><p data-ui="la-action-table.empty-body">Create a mission and it will show up here.</p><span class="la-btn is-primary" data-ui="la-action-table.empty-btn-new">New mission</span></div></td></tr></tbody></table></div>
</div></body></html>
