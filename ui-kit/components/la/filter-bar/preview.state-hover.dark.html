<!doctype html>
<html lang="en" data-system="la" data-theme="dark">
<head><meta charset="utf-8"><title>Filter bar (3 labelled fields, more filters, reset)</title>
<link rel="stylesheet" href="../../../tokens/css/fonts.css">
<link rel="stylesheet" href="../../../tokens/css/frappe-desk.css">
<link rel="stylesheet" href="../../../tokens/css/la-desk-vars.css">
<link rel="stylesheet" href="../../../tokens/css/la-desk-base.css">
<link rel="stylesheet" href="../../../tokens/css/la-desk-components.css">
<link rel="stylesheet" href="../../../tokens/css/la-desk-data.css">
<style>html,body{margin:0}*{animation:none!important;transition:none!important;caret-color:transparent!important}#ui-kit-stage{position:absolute;left:0;top:0;width:1440px;min-height:900px;padding:16px;box-sizing:border-box}</style></head>
<body class="la-root"><div id="ui-kit-stage">
<div class="la-filter-bar" data-ui="la-filter-bar" data-state="hover">
  <div class="la-field" data-ui="la-filter-bar.field-1"><span class="la-fx-label">Program</span><span class="la-field-value" data-ui="la-filter-bar.field-1-value">Hyper Rewards</span></div>
  <div class="la-field" data-ui="la-filter-bar.field-2"><span class="la-fx-label">As of</span><span class="la-field-value" data-ui="la-filter-bar.field-2-value">2026-11-22</span></div>
  <div class="la-field" data-ui="la-filter-bar.field-3"><span class="la-fx-label">Window (days)</span><span class="la-field-value" data-ui="la-filter-bar.field-3-value">90</span></div>
  <span class="la-filter-more" data-ui="la-filter-bar.more"><svg class="la-ico " viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h18l-7 8v6l-4-2v-4z"/></svg>More filters</span>
  <span class="la-filter-reset" data-ui="la-filter-bar.reset">Reset</span>
</div>

</div></body></html>
