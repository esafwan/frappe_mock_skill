<div class="la-filter-bar" data-ui="la-filter-bar">
  <div class="la-field" data-ui="la-filter-bar.field-1"><span class="la-fx-label">{{field1Label}}</span><span class="la-field-value" data-ui="la-filter-bar.field-1-value">{{field1Value}}</span></div>
  <div class="la-field" data-ui="la-filter-bar.field-2"><span class="la-fx-label">{{field2Label}}</span><span class="la-field-value" data-ui="la-filter-bar.field-2-value">{{field2Value}}</span></div>
  <div class="la-field" data-ui="la-filter-bar.field-3"><span class="la-fx-label">{{field3Label}}</span><span class="la-field-value" data-ui="la-filter-bar.field-3-value">{{field3Value}}</span></div>
  <span class="la-filter-more" data-ui="la-filter-bar.more"><svg class="la-ico " viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h18l-7 8v6l-4-2v-4z"/></svg>{{moreFilters}}</span>
  <span class="la-filter-reset" data-ui="la-filter-bar.reset">{{reset}}</span>
</div>
