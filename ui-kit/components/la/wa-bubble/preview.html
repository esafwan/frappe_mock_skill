<!doctype html>
<html lang="en" data-system="la" data-theme="light">
<head><meta charset="utf-8"><title>WhatsApp outgoing message bubble</title>
<link rel="stylesheet" href="../../../tokens/css/fonts.css">
<link rel="stylesheet" href="../../../tokens/css/frappe-desk.css">
<link rel="stylesheet" href="../../../tokens/css/la-desk-vars.css">
<link rel="stylesheet" href="../../../tokens/css/la-desk-base.css">
<link rel="stylesheet" href="../../../tokens/css/la-desk-media.css">
<style>html,body{margin:0}*{animation:none!important;transition:none!important;caret-color:transparent!important}#ui-kit-stage{position:absolute;left:0;top:0;width:390px;min-height:160px}</style></head>
<body class="la-root"><div id="ui-kit-stage">
<div class="la-wa-chat" data-ui="la-wa-bubble.chat">
  <div class="la-wa" data-ui="la-wa-bubble" data-state="sent">
    <span class="la-wa-sender" data-ui="la-wa-bubble.sender">Loyal Arrow</span>
    <span class="la-wa-body" data-ui="la-wa-bubble.body">You earned 120 points. Show this message at the counter to redeem.</span>
    <div class="la-wa-meta"><span data-ui="la-wa-bubble.time">10:42</span><span class="la-wa-ticks" data-ui="la-wa-bubble.ticks">✓</span></div>
  </div>
</div>

</div></body></html>
