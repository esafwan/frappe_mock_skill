<div class="la-wa-chat" data-ui="la-wa-bubble.chat">
  <div class="la-wa" data-ui="la-wa-bubble" data-state="{{state}}">
    <span class="la-wa-sender" data-ui="la-wa-bubble.sender">{{senderName}}</span>
    <span class="la-wa-body" data-ui="la-wa-bubble.body">{{body}}</span>
    <div class="la-wa-meta"><span data-ui="la-wa-bubble.time">{{time}}</span><span class="la-wa-ticks" data-ui="la-wa-bubble.ticks">{{ticks}}</span></div>
  </div>
</div>
