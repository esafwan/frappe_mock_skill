<div class="la-pmeter" data-state="{{state}}" data-ui="la-meter">
  <div class="la-pmeter-row"><span data-ui="la-meter.label">{{label}}</span></div>
  <div class="la-meter" data-state="{{state}}"><span class="la-bar" data-fill="{{pct__raw}}" data-ui="la-meter.bar"><span class="la-bar-fill" data-ui="la-meter.fill"></span></span><span class="la-meter-pct" data-ui="la-meter.pct">{{pct}}</span></div>
</div>
