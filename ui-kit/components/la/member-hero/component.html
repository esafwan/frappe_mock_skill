<div class="la-page-col" data-ui="la-member-hero" data-state="{{state}}">
  <a class="la-backlink" data-ui="la-member-hero.back"><svg class="la-backlink-arrow" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.5 6H1.5M5 2.5 1.5 6 5 9.5"/></svg><span data-ui="la-member-hero.back-text">{{backLink}}</span></a>
  <section class="la-card la-hero" data-ui="la-member-hero.card">
    <div class="la-hero-id">
      <span class="la-hero-avatar" data-ui="la-member-hero.avatar">{{avatarInitial}}</span>
      <div><div class="la-hero-name" data-ui="la-member-hero.name">{{name}}</div><div class="la-hero-sub" data-ui="la-member-hero.joined">{{joinedLine}}</div></div>
    </div>
    <div class="la-hero-pills"><span class="la-pill is-sm la-hero-tier" data-ui="la-member-hero.tier">{{tierPill}}</span><span class="la-pill is-sm is-green" data-ui="la-member-hero.status">{{statusPill}}</span></div>
    <span class="la-bar" data-fill="{{progressPct__raw}}" data-ui="la-member-hero.progress"><span class="la-bar-fill" data-ui="la-member-hero.progress-fill"></span></span>
    <div class="la-cap" data-ui="la-member-hero.progress-label">{{progressLabel}}</div>
  </section>
</div>
