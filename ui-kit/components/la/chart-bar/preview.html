<!doctype html>
<html lang="en" data-system="la" data-theme="light">
<head><meta charset="utf-8"><title>Loyal Arrow bar chart card (title, subtitle, axis labels, 13 bars)</title>
<link rel="stylesheet" href="../../../tokens/css/fonts.css">
<link rel="stylesheet" href="../../../tokens/css/frappe-desk.css">
<link rel="stylesheet" href="../../../tokens/css/la-desk-vars.css">
<link rel="stylesheet" href="../../../tokens/css/la-desk-base.css">
<link rel="stylesheet" href="../../../tokens/css/la-desk-components.css">
<link rel="stylesheet" href="../../../tokens/css/la-desk-data.css">
<link rel="stylesheet" href="../../../tokens/css/la-desk-widgets.css">
<style>html,body{margin:0}*{animation:none!important;transition:none!important;caret-color:transparent!important}#ui-kit-stage{position:absolute;left:0;top:0;width:449px;min-height:371px;padding:12px;box-sizing:border-box}</style></head>
<body class="la-root la-page"><div id="ui-kit-stage">
<div class="la-chart la-widget" data-ui="la-chart-bar">
  <div class="la-chart-title" data-ui="la-chart-bar.title">New members per week</div>
  <div class="la-chart-sub" data-ui="la-chart-bar.subtitle">Last synced just now</div>
  <div class="la-chart-toolbar" data-ui="la-chart-bar.toolbar"></div>
  <div class="la-plot" data-ui="la-chart-bar.plot">
    <div class="la-cgrid"><i></i><i></i><i></i><i></i><i></i></div>
    <div class="la-ys" data-ui="la-chart-bar.y-axis"><span data-ui="la-chart-bar.y-1">80</span><span data-ui="la-chart-bar.y-2">60</span><span data-ui="la-chart-bar.y-3">40</span><span data-ui="la-chart-bar.y-4">20</span><span data-ui="la-chart-bar.y-5">0</span></div>
    <div class="la-xs" data-ui="la-chart-bar.x-axis"><span data-ui="la-chart-bar.x-1">2026-08-22</span><span data-ui="la-chart-bar.x-2">2026-09-19</span><span data-ui="la-chart-bar.x-3">2026-10-17</span><span data-ui="la-chart-bar.x-4">2026-11-14</span></div>
    <div class="la-chart-empty" data-ui="la-chart-bar.empty">No data for this period</div>
    <div class="la-cbars" data-ui="la-chart-bar.bars"><i class="la-cbar" data-ui="la-chart-bar.bar-1" style="--v:17"></i><i class="la-cbar" data-ui="la-chart-bar.bar-2" style="--v:13"></i><i class="la-cbar" data-ui="la-chart-bar.bar-3" style="--v:11"></i><i class="la-cbar" data-ui="la-chart-bar.bar-4" style="--v:6"></i><i class="la-cbar" data-ui="la-chart-bar.bar-5" style="--v:9"></i><i class="la-cbar" data-ui="la-chart-bar.bar-6" style="--v:14"></i><i class="la-cbar" data-ui="la-chart-bar.bar-7" style="--v:12"></i><i class="la-cbar" data-ui="la-chart-bar.bar-8" style="--v:8"></i><i class="la-cbar" data-ui="la-chart-bar.bar-9" style="--v:17"></i><i class="la-cbar" data-ui="la-chart-bar.bar-10" style="--v:68"></i><i class="la-cbar" data-ui="la-chart-bar.bar-11" style="--v:33"></i><i class="la-cbar" data-ui="la-chart-bar.bar-12" style="--v:31"></i><i class="la-cbar" data-ui="la-chart-bar.bar-13" style="--v:15"></i></div>
  </div>
</div>

</div></body></html>
