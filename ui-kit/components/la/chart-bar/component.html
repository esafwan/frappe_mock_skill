<div class="la-chart la-widget" data-ui="la-chart-bar">
  <div class="la-chart-title" data-ui="la-chart-bar.title">{{title}}</div>
  <div class="la-chart-sub" data-ui="la-chart-bar.subtitle">{{subtitle}}</div>
  <div class="la-chart-toolbar" data-ui="la-chart-bar.toolbar"></div>
  <div class="la-plot" data-ui="la-chart-bar.plot">
    <div class="la-cgrid"><i></i><i></i><i></i><i></i><i></i></div>
    <div class="la-ys" data-ui="la-chart-bar.y-axis"><span data-ui="la-chart-bar.y-1">{{yLabels_5}}</span><span data-ui="la-chart-bar.y-2">{{yLabels_4}}</span><span data-ui="la-chart-bar.y-3">{{yLabels_3}}</span><span data-ui="la-chart-bar.y-4">{{yLabels_2}}</span><span data-ui="la-chart-bar.y-5">{{yLabels_1}}</span></div>
    <div class="la-xs" data-ui="la-chart-bar.x-axis"><span data-ui="la-chart-bar.x-1">{{xLabels_1}}</span><span data-ui="la-chart-bar.x-2">{{xLabels_2}}</span><span data-ui="la-chart-bar.x-3">{{xLabels_3}}</span><span data-ui="la-chart-bar.x-4">{{xLabels_4}}</span></div>
    <div class="la-chart-empty" data-ui="la-chart-bar.empty">{{empty_text}}</div>
    <div class="la-cbars" data-ui="la-chart-bar.bars"><i class="la-cbar" data-ui="la-chart-bar.bar-1" style="--v:{{bar_1__raw}}"></i><i class="la-cbar" data-ui="la-chart-bar.bar-2" style="--v:{{bar_2__raw}}"></i><i class="la-cbar" data-ui="la-chart-bar.bar-3" style="--v:{{bar_3__raw}}"></i><i class="la-cbar" data-ui="la-chart-bar.bar-4" style="--v:{{bar_4__raw}}"></i><i class="la-cbar" data-ui="la-chart-bar.bar-5" style="--v:{{bar_5__raw}}"></i><i class="la-cbar" data-ui="la-chart-bar.bar-6" style="--v:{{bar_6__raw}}"></i><i class="la-cbar" data-ui="la-chart-bar.bar-7" style="--v:{{bar_7__raw}}"></i><i class="la-cbar" data-ui="la-chart-bar.bar-8" style="--v:{{bar_8__raw}}"></i><i class="la-cbar" data-ui="la-chart-bar.bar-9" style="--v:{{bar_9__raw}}"></i><i class="la-cbar" data-ui="la-chart-bar.bar-10" style="--v:{{bar_10__raw}}"></i><i class="la-cbar" data-ui="la-chart-bar.bar-11" style="--v:{{bar_11__raw}}"></i><i class="la-cbar" data-ui="la-chart-bar.bar-12" style="--v:{{bar_12__raw}}"></i><i class="la-cbar" data-ui="la-chart-bar.bar-13" style="--v:{{bar_13__raw}}"></i></div>
  </div>
</div>
