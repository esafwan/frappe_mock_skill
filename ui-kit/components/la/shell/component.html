<div class="la-shell" data-ui="la-shell">
  <nav class="la-dock" data-ui="la-shell.dock"><span class="la-brand-tile" data-ui="la-shell.brand"></span></nav>
  <aside class="la-sidebar" data-ui="la-shell.sidebar">
    <div class="la-sidebar-item" data-ui="la-shell.workspace">{{workspace_name}}</div>
    <div class="la-sidebar-item" data-ui="la-shell.item-1">{{item_1}}</div>
    <div class="la-sidebar-item is-active" data-ui="la-shell.item-active">{{item_active}}</div>
  </aside>
  <main class="la-main" data-ui="la-shell.main">
    <header class="la-header" data-ui="la-shell.header">{{page_title}}</header>
    <div class="la-body" data-ui="la-shell.body"><!--la:content--></div>
  </main>
</div>
