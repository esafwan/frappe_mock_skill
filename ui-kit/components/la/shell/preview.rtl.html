<!doctype html>
<html lang="ar" data-system="la" data-theme="light" dir="rtl">
<head><meta charset="utf-8"><title>Loyal Arrow desk shell (dock, sidebar, header, body slot)</title>
<link rel="stylesheet" href="../../../tokens/css/fonts.css">
<link rel="stylesheet" href="../../../tokens/css/frappe-desk.css">
<link rel="stylesheet" href="../../../tokens/css/la-desk-vars.css">
<link rel="stylesheet" href="../../../tokens/css/la-desk-base.css">
<style>html,body{margin:0}*{animation:none!important;transition:none!important;caret-color:transparent!important}#ui-kit-stage{position:absolute;left:0;top:0;width:1440px;min-height:900px}</style></head>
<body class="la-root"><div id="ui-kit-stage">
<div class="la-shell" data-ui="la-shell">
  <nav class="la-dock" data-ui="la-shell.dock"><span class="la-brand-tile" data-ui="la-shell.brand"></span></nav>
  <aside class="la-sidebar" data-ui="la-shell.sidebar">
    <div class="la-sidebar-item" data-ui="la-shell.workspace">Loyal Arrow</div>
    <div class="la-sidebar-item" data-ui="la-shell.item-1">Members</div>
    <div class="la-sidebar-item is-active" data-ui="la-shell.item-active">Retail</div>
  </aside>
  <main class="la-main" data-ui="la-shell.main">
    <header class="la-header" data-ui="la-shell.header">Retail</header>
    <div class="la-body" data-ui="la-shell.body"><!--la:content--></div>
  </main>
</div>

</div></body></html>
