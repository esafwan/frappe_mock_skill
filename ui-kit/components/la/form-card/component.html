<div class="la-fc" data-ui="la-form-card">
  <div class="la-fc-title" data-ui="la-form-card.title">{{title}}</div>
  <div class="la-fc-grid">
    <div class="la-fc-field" data-ui="la-form-card.field-1"><span class="la-fx-label">{{fieldLabel1}}</span><span class="la-fx-input" data-ui="la-form-card.input-1"><span class="la-fx-val">{{fieldValue1}}</span></span><span class="la-fx-help">{{helpText}}</span></div>
    <div class="la-fc-field is-bad" data-ui="la-form-card.field-2"><span class="la-fx-label">{{fieldLabel2}}</span><span class="la-fx-input" data-ui="la-form-card.input-2"><span class="la-fx-val">{{fieldValue2}}</span></span><span class="la-fx-help">{{helpText2}}</span><span class="la-fc-err" data-ui="la-form-card.error">{{errorText}}</span></div>
  </div>
  <div class="la-fc-actions" data-ui="la-form-card.actions"><span class="la-fx-btn" data-ui="la-form-card.secondary">{{secondaryButton}}</span><span class="la-fx-btn is-solid" data-ui="la-form-card.primary">{{primaryButton}}</span></div>
</div>
