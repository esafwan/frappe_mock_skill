<div class="la-page-col is-right" data-ui="la-balance-cards" data-state="{{state}}">
  <section class="la-card la-balance" data-state="{{state}}" data-ui="la-balance-cards.card">
    <div class="la-balance-cell" data-ui="la-balance-cards.balance"><span class="la-balance-label" data-ui="la-balance-cards.balance-label">{{balanceLabel}}</span><span class="la-balance-value" data-ui="la-balance-cards.balance-value">{{balanceValue}}</span></div>
    <div class="la-balance-cell" data-ui="la-balance-cards.available"><span class="la-balance-label" data-ui="la-balance-cards.available-label">{{availableLabel}}</span><span class="la-balance-value" data-ui="la-balance-cards.available-value">{{availableValue}}</span></div>
  </section>
</div>
