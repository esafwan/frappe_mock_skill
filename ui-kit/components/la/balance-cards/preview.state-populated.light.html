<!doctype html>
<html lang="en" data-system="la" data-theme="light">
<head><meta charset="utf-8"><title>Balance cards (points balance and available)</title>
<link rel="stylesheet" href="../../../tokens/css/fonts.css">
<link rel="stylesheet" href="../../../tokens/css/frappe-desk.css">
<link rel="stylesheet" href="../../../tokens/css/la-desk-vars.css">
<link rel="stylesheet" href="../../../tokens/css/la-desk-base.css">

<link rel="stylesheet" href="../../../tokens/css/la-desk-data.css">

<style>html,body{margin:0}*{animation:none!important;transition:none!important;caret-color:transparent!important}#ui-kit-stage{position:absolute;left:0;top:0;width:1440px;min-height:900px}</style></head>
<body class="la-root"><div id="ui-kit-stage">
<div class="la-page-col is-right" data-ui="la-balance-cards" data-state="populated" data-state="populated">

    <div class="la-balance-cell" data-ui="la-balance-cards.balance"><span class="la-balance-label" data-ui="la-balance-cards.balance-label">Points balance</span><span class="la-balance-value" data-ui="la-balance-cards.balance-value">906</span></div>
    <div class="la-balance-cell" data-ui="la-balance-cards.available"><span class="la-balance-label" data-ui="la-balance-cards.available-label">Available</span><span class="la-balance-value" data-ui="la-balance-cards.available-value">906</span></div>
  </section>
</div>

</div></body></html>
