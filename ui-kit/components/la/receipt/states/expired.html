<div class="la-ct" data-ui="la-receipt">
<div class="la-ct-bar" data-ui="la-receipt.bar"><span>{{appName}}</span><span class="la-ct-bar-user" data-ui="la-receipt.user">{{cashier}}</span></div>
<div class="la-ct-main" data-ui="la-receipt.main">
<div class="la-ct-sub" data-ui="la-receipt.member">{{billFor}} <b>{{memberName}}</b></div>
<div class="la-ct-card is-warn" data-ui="la-receipt.card">
  <div class="la-ct-title" data-ui="la-receipt.heading">{{expiredHeading}}</div>
  <div class="la-num" data-ui="la-receipt.amount">{{amount}}</div>
  <div data-ui="la-receipt.earned">{{earned}}</div>
  <div data-ui="la-receipt.balance">{{balance}}</div>
</div>
<div class="la-ct-note" data-ui="la-receipt.note">{{expiredNote}}</div>
<div class="la-ct-stack">
<div class="la-ct-btn is-primary" data-ui="la-receipt.request">{{requestBtn}}</div>
<div class="la-ct-btn is-strong" data-ui="la-receipt.new">{{newBtn}}</div>
</div>
</div>
</div>
