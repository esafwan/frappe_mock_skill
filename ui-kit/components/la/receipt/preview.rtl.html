<!doctype html>
<html lang="ar" data-system="la" data-theme="light" dir="rtl">
<head><meta charset="utf-8"><title>Counter: bill receipt (booked / voided / expired)</title>
<link rel="stylesheet" href="../../../tokens/css/fonts.css">
<link rel="stylesheet" href="../../../tokens/css/frappe-desk.css">
<link rel="stylesheet" href="../../../tokens/css/la-desk-vars.css">
<link rel="stylesheet" href="../../../tokens/css/la-desk-base.css">
<link rel="stylesheet" href="../../../tokens/css/la-desk-components.css">
<link rel="stylesheet" href="../../../tokens/css/la-desk-data.css">
<link rel="stylesheet" href="../../../tokens/css/la-counter-base.css">
<style>html,body{margin:0}*{animation:none!important;transition:none!important;caret-color:transparent!important}#ui-kit-stage{position:absolute;left:0;top:0;width:420px;min-height:820px}</style></head>
<body class="la-root"><div id="ui-kit-stage">
<div class="la-ct" data-ui="la-receipt">
<div class="la-ct-bar" data-ui="la-receipt.bar"><span>الكاونتر</span><span class="la-ct-bar-user" data-ui="la-receipt.user">qa.cashier@example.test</span></div>
<div class="la-ct-main" data-ui="la-receipt.main">
<div class="la-ct-sub" data-ui="la-receipt.member">فاتورة <b>عضو تجريبي</b></div>
<div class="la-ct-card is-ok" data-ui="la-receipt.card">
  <div class="la-ct-title" data-ui="la-receipt.heading">تم تسجيل الفاتورة</div>
  <div class="la-num" data-ui="la-receipt.amount">₹٥٠٠.٠٠</div>
  <div data-ui="la-receipt.earned">اكتسب 5 نقاط</div>
  <div data-ui="la-receipt.balance">الرصيد 5 نقاط</div>
</div>
<div class="la-ct-stack is-mt">
<div class="la-ct-btn is-tall" data-ui="la-receipt.undo">إلغاء هذه الفاتورة</div>
<div class="la-ct-btn is-primary" data-ui="la-receipt.new">فاتورة جديدة</div>
</div>
</div>
</div>

</div></body></html>
