<!doctype html>
<html lang="ar" data-system="la" data-theme="light" dir="rtl">
<head><meta charset="utf-8"><title>Counter: bill amount + earn preview</title>
<link rel="stylesheet" href="../../../tokens/css/fonts.css">
<link rel="stylesheet" href="../../../tokens/css/frappe-desk.css">
<link rel="stylesheet" href="../../../tokens/css/la-desk-vars.css">
<link rel="stylesheet" href="../../../tokens/css/la-desk-base.css">
<link rel="stylesheet" href="../../../tokens/css/la-desk-components.css">
<link rel="stylesheet" href="../../../tokens/css/la-desk-data.css">
<link rel="stylesheet" href="../../../tokens/css/la-counter-base.css">
<style>html,body{margin:0}*{animation:none!important;transition:none!important;caret-color:transparent!important}#ui-kit-stage{position:absolute;left:0;top:0;width:420px;min-height:820px}</style></head>
<body class="la-root"><div id="ui-kit-stage">
<div class="la-ct" data-ui="la-amount-preview">
<div class="la-ct-bar" data-ui="la-amount-preview.bar"><span>الكاونتر</span><span class="la-ct-bar-user" data-ui="la-amount-preview.user">qa.cashier@example.test</span></div>
<div class="la-ct-main" data-ui="la-amount-preview.main">
<div class="la-ct-sub" data-ui="la-amount-preview.member">فاتورة <b>عضو تجريبي</b></div>
<div class="la-ct-card is-stat" data-ui="la-amount-preview.card">
  <div class="la-ct-lbl" data-ui="la-amount-preview.bill-label">الفاتورة</div>
  <div class="la-ct-big la-num" data-ui="la-amount-preview.bill-amount">₹٥٠٠.٠٠</div>
  <div class="la-ct-lbl" data-ui="la-amount-preview.earn-label">النقاط المكتسبة</div>
  <div class="la-ct-big is-lg la-num " data-ui="la-amount-preview.points-earned">٥</div>
  <div class="la-ct-kv" data-ui="la-amount-preview.tier">مكافأة المستوى x100</div>
</div>
<div class="la-ct-stack" data-ui="la-amount-preview.actions">
  <div class="la-ct-btn is-primary" data-ui="la-amount-preview.continue">متابعة دون استبدال</div>
  <div class="la-ct-btn is-strong" data-ui="la-amount-preview.redeem">استبدال النقاط</div>
  <div class="la-ct-btn is-strong" data-ui="la-amount-preview.change">تغيير المبلغ</div>
</div>
</div>
</div>

</div></body></html>
