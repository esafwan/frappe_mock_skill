<div class="la-ct" data-ui="la-amount-preview">
<div class="la-ct-bar" data-ui="la-amount-preview.bar"><span>{{appName}}</span><span class="la-ct-bar-user" data-ui="la-amount-preview.user">{{cashier}}</span></div>
<div class="la-ct-main" data-ui="la-amount-preview.main">
<div class="la-ct-sub" data-ui="la-amount-preview.member">{{billFor}} <b>{{memberName}}</b></div>
<div class="la-ct-label" data-ui="la-amount-preview.entry-heading">{{amountHeading}}</div>
<div class="la-ct-field is-focus la-num" data-ui="la-amount-preview.entry-input">{{amountInput}}</div>
<div class="la-ct-spacer"></div>
<div class="la-ct-card is-stat" data-ui="la-amount-preview.card">
  <div class="la-ct-lbl" data-ui="la-amount-preview.bill-label">{{billLabel}}</div>
  <div class="la-ct-big la-num" data-ui="la-amount-preview.bill-amount">{{billAmount}}</div>
  <div class="la-ct-lbl" data-ui="la-amount-preview.earn-label">{{earnLabel}}</div>
  <div class="la-ct-big is-lg la-num la-ct-count" data-ui="la-amount-preview.points-earned">{{countingValue}}</div>
  <div class="la-ct-kv" data-ui="la-amount-preview.tier">{{tierNote}}</div>
</div>
<div class="la-ct-spacer"></div>
<div class="la-ct-btn is-primary" data-ui="la-amount-preview.preview-btn">{{previewBtn}}</div>
</div>
</div>
