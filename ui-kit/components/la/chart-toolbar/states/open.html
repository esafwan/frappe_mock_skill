<div class="la-cw la-toolbar" data-ui="la-chart-toolbar">
  <div class="la-btn is-open" data-ui="la-chart-toolbar.range">{{rangeLabel}}<i class="la-dd-chev"></i></div>
  <div class="la-btn" data-ui="la-chart-toolbar.granularity">{{granularityLabel}}<i class="la-dd-chev"></i></div>
  <div class="la-menu" data-ui="la-chart-toolbar.menu">
    <div class="la-menu-item is-active" data-ui="la-chart-toolbar.opt-1">{{opt1}}</div>
    <div class="la-menu-item" data-ui="la-chart-toolbar.opt-2">{{opt2}}</div>
    <div class="la-menu-item" data-ui="la-chart-toolbar.opt-3">{{opt3}}</div>
  </div>
</div>
