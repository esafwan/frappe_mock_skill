<!doctype html>
<html lang="en" data-system="la" data-theme="dark">
<head><meta charset="utf-8"><title>Chart toolbar (range + granularity)</title>
<link rel="stylesheet" href="../../../tokens/css/fonts.css">
<link rel="stylesheet" href="../../../tokens/css/frappe-desk.css">
<link rel="stylesheet" href="../../../tokens/css/la-desk-vars.css">
<link rel="stylesheet" href="../../../tokens/css/la-desk-base.css">
<link rel="stylesheet" href="../../../tokens/css/la-desk-components.css">
<link rel="stylesheet" href="../../../tokens/css/la-desk-data.css">
<link rel="stylesheet" href="../../../tokens/css/la-desk-chart.css">
<style>html,body{margin:0}*{animation:none!important;transition:none!important;caret-color:transparent!important}#ui-kit-stage{position:absolute;left:0;top:0;width:580px;min-height:240px;padding:16px;box-sizing:border-box}</style></head>
<body class="la-root"><div id="ui-kit-stage">
<div class="la-cw la-toolbar" data-ui="la-chart-toolbar" data-state="open">
  <div class="la-btn is-open" data-ui="la-chart-toolbar.range">Last 30 days<i class="la-dd-chev"></i></div>
  <div class="la-btn" data-ui="la-chart-toolbar.granularity">Daily<i class="la-dd-chev"></i></div>
  <div class="la-menu" data-ui="la-chart-toolbar.menu">
    <div class="la-menu-item is-active" data-ui="la-chart-toolbar.opt-1">Last 30 days</div>
    <div class="la-menu-item" data-ui="la-chart-toolbar.opt-2">Last 90 days</div>
    <div class="la-menu-item" data-ui="la-chart-toolbar.opt-3">This year</div>
  </div>
</div>

</div></body></html>
