<!doctype html>
<html lang="en" data-system="la" data-theme="light">
<head><meta charset="utf-8"><title>Progress meter (current / target)</title>
<link rel="stylesheet" href="../../../tokens/css/fonts.css">
<link rel="stylesheet" href="../../../tokens/css/frappe-desk.css">
<link rel="stylesheet" href="../../../tokens/css/la-desk-vars.css">
<link rel="stylesheet" href="../../../tokens/css/la-desk-base.css">
<link rel="stylesheet" href="../../../tokens/css/la-desk-components.css">
<link rel="stylesheet" href="../../../tokens/css/la-desk-data.css">
<link rel="stylesheet" href="../../../tokens/css/la-widgets.css">
<style>html,body{margin:0}*{animation:none!important;transition:none!important;caret-color:transparent!important}#ui-kit-stage{position:absolute;left:0;top:0;width:1440px;min-height:900px;padding:16px;box-sizing:border-box}</style></head>
<body class="la-root"><div id="ui-kit-stage">
<div class="la-pmeter" data-state="zero" data-ui="la-progress-meter" data-state="zero">
  <div class="la-pmeter-row"><span data-ui="la-progress-meter.label">points to the next tier</span><span class="la-pmeter-nums" data-ui="la-progress-meter.nums"><span data-ui="la-progress-meter.current">0</span> / <span data-ui="la-progress-meter.target">10,000</span></span></div>
  <span class="la-bar" data-fill="0" data-ui="la-progress-meter.bar"><span class="la-bar-fill" data-ui="la-progress-meter.fill"></span></span>
</div>

</div></body></html>
