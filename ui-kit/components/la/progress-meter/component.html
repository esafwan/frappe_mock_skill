<div class="la-pmeter" data-state="{{state}}" data-ui="la-progress-meter">
  <div class="la-pmeter-row"><span data-ui="la-progress-meter.label">{{label}}</span><span class="la-pmeter-nums" data-ui="la-progress-meter.nums"><span data-ui="la-progress-meter.current">{{current}}</span> / <span data-ui="la-progress-meter.target">{{target}}</span></span></div>
  <span class="la-bar" data-fill="{{fill__raw}}" data-ui="la-progress-meter.bar"><span class="la-bar-fill" data-ui="la-progress-meter.fill"></span></span>
</div>
