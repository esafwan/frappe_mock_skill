<div class="lc-bill" data-ui="la-counter-bill-card" data-state="{{state}}">
  <div class="lc-bill-title" data-ui="la-counter-bill-card.heading">{{heading}}</div>
  <div class="lc-bill-line lc-bill-amount" data-ui="la-counter-bill-card.amount">{{amount}}</div>
  <div class="lc-bill-line" data-ui="la-counter-bill-card.earned">{{earned}}</div>
  <div class="lc-bill-line" data-ui="la-counter-bill-card.balance">{{balance}}</div>
  <div class="lc-bill-note" data-ui="la-counter-bill-card.note">{{note}}</div>
</div>
