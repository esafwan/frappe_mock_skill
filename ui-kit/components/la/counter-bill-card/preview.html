<!doctype html>
<html lang="en" data-system="la" data-theme="light">
<head><meta charset="utf-8"><title>Counter bill receipt card (booked / zero / empty / pending)</title>
<link rel="stylesheet" href="../../../tokens/css/fonts.css">
<link rel="stylesheet" href="../../../tokens/css/frappe-desk.css">
<link rel="stylesheet" href="../../../tokens/css/la-desk-vars.css">
<link rel="stylesheet" href="../../../tokens/css/la-desk-base.css">
<link rel="stylesheet" href="../../../tokens/css/la-desk-components.css">
<link rel="stylesheet" href="../../../tokens/css/la-desk-data.css">
<link rel="stylesheet" href="../../../tokens/css/la-counter.css">
<link rel="stylesheet" href="../../../tokens/css/la-counter-receipt.css">
<style>html,body{margin:0}*{animation:none!important;transition:none!important;caret-color:transparent!important}#ui-kit-stage{position:absolute;left:0;top:0;width:390px;min-height:844px}</style></head>
<body class="la-root"><div id="ui-kit-stage">
<div class="lc-bill" data-ui="la-counter-bill-card" data-state="booked">
  <div class="lc-bill-title" data-ui="la-counter-bill-card.heading">Bill booked</div>
  <div class="lc-bill-line lc-bill-amount" data-ui="la-counter-bill-card.amount">₹250.00</div>
  <div class="lc-bill-line" data-ui="la-counter-bill-card.earned">Earned 25 points</div>
  <div class="lc-bill-line" data-ui="la-counter-bill-card.balance">Balance 145 points</div>
  <div class="lc-bill-note" data-ui="la-counter-bill-card.note">No bill to show</div>
</div>

</div></body></html>
