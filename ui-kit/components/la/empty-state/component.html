<div class="la-es is-{{state}}" data-ui="la-empty-state">
  <div class="la-es-inner">
    <span class="la-es-icon la-eico-{{icon}}" data-ui="la-empty-state.icon"></span>
    <div class="la-es-title" data-ui="la-empty-state.title">{{title}}</div>
    <div class="la-es-body" data-ui="la-empty-state.body">{{body}}</div>
    <a class="la-es-action" data-ui="la-empty-state.action">{{action}}</a>
  </div>
</div>
