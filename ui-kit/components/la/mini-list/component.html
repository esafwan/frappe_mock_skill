<section class="la-card la-cw" data-ui="la-mini-list">
  <h3 class="la-card-title" data-ui="la-mini-list.title">{{title}}</h3>
  <div class="la-list-rows">
    <div class="la-list-row" data-ui="la-mini-list.row-1"><div class="la-list-main"><span class="la-list-title" data-ui="la-mini-list.row-1.title">{{rowTitle}}</span><span class="la-list-sub">{{rowSub}}</span></div><span class="la-pill is-amber" data-ui="la-mini-list.row-1.pill">{{rowPill}}</span></div>
    <div class="la-list-row" data-ui="la-mini-list.row-2"><div class="la-list-main"><span class="la-list-title" data-ui="la-mini-list.row-2.title">{{rowTitle2}}</span><span class="la-list-sub">{{rowSub2}}</span></div><span class="la-pill is-green" data-ui="la-mini-list.row-2.pill">{{rowPill2}}</span></div>
    <div class="la-list-row" data-ui="la-mini-list.row-3"><div class="la-list-main"><span class="la-list-title" data-ui="la-mini-list.row-3.title">{{rowTitle3}}</span><span class="la-list-sub">{{rowSub3}}</span></div><span class="la-pill " data-ui="la-mini-list.row-3.pill">{{rowPill3}}</span></div>
  </div>
</section>
