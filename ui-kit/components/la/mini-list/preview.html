<!doctype html>
<html lang="en" data-system="la" data-theme="light">
<head><meta charset="utf-8"><title>Mini list card with status pills</title>
<link rel="stylesheet" href="../../../tokens/css/fonts.css">
<link rel="stylesheet" href="../../../tokens/css/frappe-desk.css">
<link rel="stylesheet" href="../../../tokens/css/la-desk-vars.css">
<link rel="stylesheet" href="../../../tokens/css/la-desk-base.css">
<link rel="stylesheet" href="../../../tokens/css/la-desk-components.css">
<link rel="stylesheet" href="../../../tokens/css/la-desk-data.css">
<link rel="stylesheet" href="../../../tokens/css/la-desk-chart.css">
<style>html,body{margin:0}*{animation:none!important;transition:none!important;caret-color:transparent!important}#ui-kit-stage{position:absolute;left:0;top:0;width:580px;min-height:260px;padding:16px;box-sizing:border-box}</style></head>
<body class="la-root"><div id="ui-kit-stage">
<section class="la-card la-cw" data-ui="la-mini-list">
  <h3 class="la-card-title" data-ui="la-mini-list.title">Recent activity</h3>
  <div class="la-list-rows">
    <div class="la-list-row" data-ui="la-mini-list.row-1"><div class="la-list-main"><span class="la-list-title" data-ui="la-mini-list.row-1.title">Bill 0001</span><span class="la-list-sub">Points earned, 2 minutes ago</span></div><span class="la-pill is-amber" data-ui="la-mini-list.row-1.pill">Earned</span></div>
    <div class="la-list-row" data-ui="la-mini-list.row-2"><div class="la-list-main"><span class="la-list-title" data-ui="la-mini-list.row-2.title">Reward claimed</span><span class="la-list-sub">Free coffee, 1 hour ago</span></div><span class="la-pill is-green" data-ui="la-mini-list.row-2.pill">Redeemed</span></div>
    <div class="la-list-row" data-ui="la-mini-list.row-3"><div class="la-list-main"><span class="la-list-title" data-ui="la-mini-list.row-3.title">Manual adjustment</span><span class="la-list-sub">Added by staff, yesterday</span></div><span class="la-pill " data-ui="la-mini-list.row-3.pill">Adjusted</span></div>
  </div>
</section>

</div></body></html>
