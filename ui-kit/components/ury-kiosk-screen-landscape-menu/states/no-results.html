<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>URY landscape kiosk menu / no-results</title>
<link rel="stylesheet" href="../../../tokens/css/ury-v16/ury-fonts.css">
<link rel="stylesheet" href="../../../tokens/css/ury-v16/ury-ui-tokens.css">
<link rel="stylesheet" href="../../../tokens/css/ury-v16/ury-ui-base.css">
<link rel="stylesheet" href="../../../tokens/css/ury-v16/components/kiosk-landscape.css">
<style>html,body{margin:0}body{background:hsl(var(--background));min-height:1080px}#ui-kit-stage{position:absolute;left:0;top:0;width:1920px;height:1080px}*{animation:none!important;transition:none!important;caret-color:transparent!important}</style></head>
<body>
<div id="ui-kit-stage">
<div class="u-screen kl" data-ui="ury-kiosk-screen-landscape-menu" style="width:1920px;height:1080px;position:relative;overflow:hidden"><div class="kl-root kl-root--menu"><header class="kl-head" data-ui="ury-kiosk-screen-landscape-menu.header"><h1 class="kl-title">Order for Pickup</h1><button type="button" class="kl-new" data-ui="ury-kiosk-screen-landscape-menu.new-order">New Order</button></header>
<div class="kl-strip" data-ui="ury-kiosk-screen-landscape-menu.strip"><div class="kl-strip__row"><nav class="kl-tabs" aria-label="Menu categories" data-ui="ury-kiosk-screen-landscape-menu.tabs"><button type="button" class="kl-chip kl-chip--on" data-ui="ury-kiosk-screen-landscape-menu.tab-all">All</button></nav></div><div class="kl-searchw" data-ui="ury-kiosk-screen-landscape-menu.search"><div class="kl-search"><div class="kl-search__box"><span class="kl-search__icon"><svg class="lucide lucide-search" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21 21-4.34-4.34"/><circle cx="11" cy="11" r="8"/></svg></span>
<input class="kl-search__input" type="text" readonly aria-label="Search menu" placeholder="Search menu..." value="Sandwich"><button type="button" class="kl-search__clear" aria-label="Clear search"><svg class="lucide lucide-x" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button></div></div></div></div>
<div class="kl-body"><main class="kl-main"><div class="kl-grid" data-ui="ury-kiosk-screen-landscape-menu.grid"></div><div class="kl-none" data-ui="ury-kiosk-screen-landscape-menu.empty">No items match your search.</div></main><aside class="kl-cart" data-ui="ury-kiosk-screen-landscape-menu.cart-panel"><div class="kl-cart__scroll"><section><h2 class="kl-h2">Cart</h2><ul class="kl-cart__lines"><li><span class="kl-cart__name">Latte</span><span class="kl-ctl"><button type="button" class="kl-step" aria-label="Remove one">−</button><span class="kl-qty">1</span><button type="button" class="kl-step" aria-label="Add one more">+</button></span></li><li><span class="kl-cart__name">Cappuccino</span><span class="kl-ctl"><button type="button" class="kl-step" aria-label="Remove one">−</button><span class="kl-qty">2</span><button type="button" class="kl-step" aria-label="Add one more">+</button></span></li></ul></section></div>
<div class="kl-cart__foot"><div class="kl-sum"><span>3 items</span><span class="kl-num" data-ui="ury-kiosk-screen-landscape-menu.cart-total">AED 48.00</span></div>
<button type="button" class="kl-btn kl-btn--place" data-ui="ury-kiosk-screen-landscape-menu.place-order">Place Order</button>
</div></aside></div></div>
</div>
</div>
</body></html>
