<!doctype html>
<html lang="en" class="dark">
<head><meta charset="utf-8"><title>URY landscape kiosk checkout</title>
<link rel="stylesheet" href="../../tokens/css/ury-v16/ury-fonts.css">
<link rel="stylesheet" href="../../tokens/css/ury-v16/ury-ui-tokens.css">
<link rel="stylesheet" href="../../tokens/css/ury-v16/ury-ui-base.css">
<link rel="stylesheet" href="../../tokens/css/ury-v16/components/kiosk-landscape.css">
<style>html,body{margin:0}body{background:hsl(var(--background));min-height:1080px}#ui-kit-stage{position:absolute;left:0;top:0;width:1920px;height:1080px}*{animation:none!important;transition:none!important;caret-color:transparent!important}</style></head>
<body>
<div id="ui-kit-stage">
<div class="u-screen kl" data-ui="ury-kiosk-screen-landscape-checkout" style="width:1920px;height:1080px;position:relative;overflow:hidden"><div class="kl-root"><header class="kl-head" data-ui="ury-kiosk-screen-landscape-checkout.header"><h1 class="kl-title">Order for Pickup</h1><button type="button" class="kl-new" data-ui="ury-kiosk-screen-landscape-checkout.new-order">New Order</button></header><div class="kl-fill kl-fill--scroll"><div class="kl-co" data-ui="ury-kiosk-screen-landscape-checkout.checkout"><section class="kl-co__sec" data-ui="ury-kiosk-screen-landscape-checkout.summary"><h2 class="kl-h2">Order Summary</h2><ul class="kl-co__list"><li><span>Latte × 1</span><span>AED 16.00</span></li><li><span>Cappuccino × 2</span><span>AED 32.00</span></li></ul>
<div class="kl-co__total"><span>3 items</span><span data-ui="ury-kiosk-screen-landscape-checkout.total">AED 48.00</span></div></section><section class="kl-co__sec kl-co__sec--pay" data-ui="ury-kiosk-screen-landscape-checkout.payment"><h2 class="kl-h2">Payment Method</h2><div class="kl-co__pms"><button type="button" class="kl-pm" data-ui="ury-kiosk-screen-landscape-checkout.pm-online">Pay Online</button><button type="button" class="kl-pm kl-pm--on" data-ui="ury-kiosk-screen-landscape-checkout.pm-counter">Pay at Counter</button><button type="button" class="kl-pm" data-ui="ury-kiosk-screen-landscape-checkout.pm-bill">Request Bill</button></div></section>
<div class="kl-co__act"><button type="button" class="kl-co__go" data-ui="ury-kiosk-screen-landscape-checkout.submit">Place Order</button></div></div></div></div></div>
</div>
</body></html>
