<div class="u-screen kl" data-ui="ury-kiosk-screen-landscape-checkout" style="width:1920px;height:1080px;position:relative;overflow:hidden"><div class="kl-root"><header class="kl-head" data-ui="ury-kiosk-screen-landscape-checkout.header"><h1 class="kl-title">{{title}}</h1><button type="button" class="kl-new" data-ui="ury-kiosk-screen-landscape-checkout.new-order">{{new_order}}</button></header><div class="kl-fill kl-fill--scroll"><div class="kl-co" data-ui="ury-kiosk-screen-landscape-checkout.checkout"><section class="kl-co__sec" data-ui="ury-kiosk-screen-landscape-checkout.summary"><h2 class="kl-h2">{{summary_title}}</h2><ul class="kl-co__list"><li><span>{{l1_name}} × {{l1_qty}}</span><span>{{l1_amount}}</span></li><li><span>{{l2_name}} × {{l2_qty}}</span><span>{{l2_amount}}</span></li></ul>
<div class="kl-co__total"><span>{{count_label}}</span><span data-ui="ury-kiosk-screen-landscape-checkout.total">{{cart_total}}</span></div></section><section class="kl-co__sec kl-co__sec--pay" data-ui="ury-kiosk-screen-landscape-checkout.payment"><h2 class="kl-h2">{{payment_title}}</h2><div class="kl-co__pms"><button type="button" class="kl-pm" data-ui="ury-kiosk-screen-landscape-checkout.pm-online">{{pay_online}}</button><button type="button" class="kl-pm kl-pm--on" data-ui="ury-kiosk-screen-landscape-checkout.pm-counter">{{pay_counter}}</button></div></section>
<div class="kl-co__act"><button type="button" class="kl-co__go" data-ui="ury-kiosk-screen-landscape-checkout.submit">{{place_order}}</button></div></div></div></div></div>
