
<div class="po po-detail" data-ui="pos-order-detail">
<div class="po-dh" data-ui="pos-order-detail.header"><div class="po-dh__row"><h2 class="po-dh__title po-trunc">{{name}}</h2><div class="po-dh__acts"><button type="button" class="po-ibtn" aria-label="{{edit_order}}" data-ui="pos-order-detail.edit"><svg class="lucide lucide-pencil" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/><path d="m15 5 4 4"/></svg></button><button type="button" class="po-ibtn po-ibtn--red" aria-label="{{cancel_order}}" data-ui="pos-order-detail.cancel"><svg class="lucide lucide-x" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button><span class="u-badge u-badge--secondary" data-ui="pos-order-detail.status">{{d_status}}</span></div></div></div>
<div class="po-db" data-ui="pos-order-detail.body">

<div class="po-sec"><div class="po-info" data-ui="pos-order-detail.info">
<div class="po-info__col"><div class="po-info__row"><svg class="lucide lucide-user" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><b>{{customer}}</b></div><div class="po-info__row"><svg class="lucide lucide-clock" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg><span>{{time}}</span></div></div>
<div class="po-info__col"><div class="po-info__row"><svg class="lucide lucide-user-check" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m16 11 2 2 4-4"/><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg><span>{{waiter}}</span></div><div class="po-info__row"><svg class="lucide lucide-receipt" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"/><path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8"/><path d="M12 17.5v-11"/></svg><span>{{table}}</span></div></div></div></div>
<div class="po-sec"><h3 class="po-h3">{{items_title}}</h3><div class="po-items"><div class="po-item" data-ui="pos-order-detail.item"><div class="po-item__main"><div class="po-item__nr"><p class="po-item__name">{{item1}}</p></div>
<div class="po-item__q"><p class="po-item__qty">{{qty1}}</p></div></div><div class="po-item__amt u-num"><p>{{amt1}}</p></div></div><div class="po-item" data-ui="pos-order-detail.item"><div class="po-item__main"><div class="po-item__nr"><p class="po-item__name">{{item2}}</p></div>
<div class="po-item__q"><p class="po-item__qty">{{qty2}}</p></div></div><div class="po-item__amt u-num"><p>{{amt2}}</p></div></div><div class="po-item" data-ui="pos-order-detail.item"><div class="po-item__main"><div class="po-item__nr"><p class="po-item__name">{{item3}}</p></div>
<div class="po-item__q"><p class="po-item__qty">{{qty3}}</p></div></div><div class="po-item__amt u-num"><p>{{amt3}}</p></div></div></div></div>
<div class="po-sec"><h3 class="po-h3">{{taxes_title}}</h3><div class="po-taxes"><div class="po-tax"><span>{{tax1}}</span><b class="u-num">{{tax1_amt}}</b></div><div class="po-tax"><span>{{tax2}}</span><b class="u-num">{{tax2_amt}}</b></div></div></div>
</div>
<div class="po-df" data-ui="pos-order-detail.footer"><div class="po-df__row"><button type="button" class="u-btn u-btn--outline u-btn--icon" aria-label="{{print}}" data-ui="pos-order-detail.print"><svg class="lucide lucide-printer" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><path d="M6 9V3a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v6"/><rect x="6" y="14" width="12" height="8" rx="1"/></svg></button><button type="button" class="u-btn u-btn--default po-pay" data-ui="pos-order-detail.payment">{{payment}}</button><span class="po-df__total u-num" data-ui="pos-order-detail.total">{{total}}</span></div></div>

</div>
