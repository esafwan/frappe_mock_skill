<!doctype html>
<html lang="en" data-theme="dark">
<head><meta charset="utf-8"><title>Voice listening sheet: timer, waveform, stop, Send</title>
<link rel="stylesheet" href="../../tokens/css/huf-ios/huf-ios-fonts.css">
<link rel="stylesheet" href="../../tokens/css/huf-ios/huf-ios-tokens.css">

<style>html,body{margin:0}body{background:var(--hi-canvas,#fff);min-height:874px}#ui-kit-stage{position:absolute;left:0;top:0;width:402px;height:874px}*{animation:none!important;transition:none!important;caret-color:transparent!important}</style></head>
<body>
<div id="ui-kit-stage">

</div>
