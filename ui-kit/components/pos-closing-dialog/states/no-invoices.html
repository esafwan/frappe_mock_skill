<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>POS closing dialog / no-invoices</title>
<link rel="stylesheet" href="../../../tokens/css/ury-v16/ury-fonts.css">
<link rel="stylesheet" href="../../../tokens/css/ury-v16/ury-ui-tokens.css">
<link rel="stylesheet" href="../../../tokens/css/ury-v16/ury-ui-base.css">
<link rel="stylesheet" href="../../../tokens/css/ury-v16/components/pos-shift.css">
<style>html,body{margin:0}body{background:hsl(var(--background));min-height:900px}#ui-kit-stage{position:absolute;left:0;top:0;width:1440px;height:900px}*{animation:none!important;transition:none!important;caret-color:transparent!important}</style></head>
<body>
<div id="ui-kit-stage">
<div class="u-screen pos-shift" data-ui="pos-closing-dialog" style="width:1440px;height:900px;position:relative;overflow:hidden"><div class="pos-shift__under"></div><div class="pos-shift__scrim">
<div class="pos-shift__dlg" data-ui="pos-closing-dialog">
  <button type="button" class="pos-shift__dlg-x" aria-label="Close"><svg class="lucide lucide-x" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
  <div class="pos-shift__dlg-head"><h2 class="pos-shift__dlg-title">Close POS</h2><p class="pos-shift__dlg-desc">Review sales for your session and enter the actual closing amounts.</p></div>
  <div class="pos-shift__dlg-body">
    <div class="pos-shift__sum" data-ui="pos-closing-summary">
      <div class="pos-shift__sumcard"><p>Grand Total</p><p>AED 1,847.50</p></div>
      <div class="pos-shift__sumcard"><p>Net Total</p><p>AED 1,759.52</p></div>
      <div class="pos-shift__sumcard"><p>Total Quantity</p><p>86</p></div>
      <div class="pos-shift__sumcard"><p>Total Invoices</p><p>42</p></div>
    </div>
    <p class="pos-shift__empty" data-ui="pos-closing-empty">No invoices were found for this period.</p>
  </div>
  
  <div class="pos-shift__dlg-foot" data-ui="pos-closing-footer"><button type="button" class="u-btn u-btn--outline">Cancel</button><button type="button" class="u-btn u-btn--default is-disabled" data-ui="pos-closing-submit">Close POS</button></div>
</div></div></div>
</div>
</body></html>
