<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><title>POS checklist gate</title>
<link rel="stylesheet" href="../../tokens/css/ury-v16/ury-fonts.css">
<link rel="stylesheet" href="../../tokens/css/ury-v16/ury-ui-tokens.css">
<link rel="stylesheet" href="../../tokens/css/ury-v16/ury-ui-base.css">
<link rel="stylesheet" href="../../tokens/css/ury-v16/components/pos-shift.css">
<style>html,body{margin:0}body{background:hsl(var(--background));min-height:900px}#ui-kit-stage{position:absolute;left:0;top:0;width:1440px;height:900px}*{animation:none!important;transition:none!important;caret-color:transparent!important}</style></head>
<body>
<div id="ui-kit-stage">
<div class="u-screen pos-shift" data-ui="pos-checklist-gate" style="width:1440px;height:900px;position:relative;overflow:hidden"><div class="pos-shift__under"></div><div class="pos-shift__scrim"><div class="pos-shift__gate" data-ui="pos-checklist-card"><h2 class="pos-shift__gate-title">قائمة التحقق عند الإغلاق</h2><p class="pos-shift__gate-desc">يرجى إكمال قائمة التحقق أدناه قبل المتابعة.</p><div class="pos-shift__items" data-ui="pos-checklist-items"><div class="pos-shift__item" data-ui="pos-checklist-item"><span class="pos-shift__item-t">1. تم عد درج النقد وإغلاقه<em>*</em></span><div class="pos-shift__radios"><label class="pos-shift__radio"><span class="pos-shift__dot is-on"></span>PASS</label><label class="pos-shift__radio"><span class="pos-shift__dot"></span>FAIL</label></div><div class="pos-shift__input u-num is-empty"><span style="opacity:.6">ملاحظات</span></div></div><div class="pos-shift__item" data-ui="pos-checklist-item"><span class="pos-shift__item-t">2. تم إطفاء معدات المطبخ<em>*</em></span><div class="pos-shift__radios"><label class="pos-shift__radio"><span class="pos-shift__dot"></span>PASS</label><label class="pos-shift__radio"><span class="pos-shift__dot is-on"></span>FAIL</label></div><div class="pos-shift__input u-num ">خط الغاز تُرك مفتوحاً، تم إبلاغ المدير</div></div><div class="pos-shift__item" data-ui="pos-checklist-item"><span class="pos-shift__item-t">3. تم تنظيف الطاولات وإعادة ترتيبها<em>*</em></span><div class="pos-shift__radios"><label class="pos-shift__radio"><span class="pos-shift__dot is-on"></span>PASS</label><label class="pos-shift__radio"><span class="pos-shift__dot"></span>FAIL</label></div><div class="pos-shift__input u-num ">تم قبل الساعة 11 مساءً</div></div><div class="pos-shift__item" data-ui="pos-checklist-item"><span class="pos-shift__item-t">4. تم فحص مخزون ورق الطابعة</span><div class="pos-shift__radios"><label class="pos-shift__radio"><span class="pos-shift__dot is-on"></span>PASS</label><label class="pos-shift__radio"><span class="pos-shift__dot"></span>FAIL</label></div><div class="pos-shift__input u-num is-empty"><span style="opacity:.6">ملاحظات</span></div></div></div><button type="button" class="pos-shift__gate-btn" data-ui="pos-checklist-submit">إرسال قائمة التحقق</button></div></div></div>
</div>
</body></html>
