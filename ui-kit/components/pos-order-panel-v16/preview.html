<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>POS order panel (v16)</title>
<link rel="stylesheet" href="../../tokens/css/ury-v16/ury-fonts.css">
<link rel="stylesheet" href="../../tokens/css/ury-v16/ury-ui-tokens.css">
<link rel="stylesheet" href="../../tokens/css/ury-v16/ury-ui-base.css">
<link rel="stylesheet" href="../../tokens/css/ury-v16/components/pos-register.css">
<style>html,body{margin:0}body{background:hsl(var(--background));min-height:836px}#ui-kit-stage{position:absolute;left:0;top:0;width:384px;height:836px}*{animation:none!important;transition:none!important;caret-color:transparent!important}</style></head>
<body>
<div id="ui-kit-stage">
<div class="prg" style="display:inline-block;background:hsl(var(--gray-100))"><div class="prg prg-panel" data-ui="pos-order-panel-v16"><div class="prg-phead" data-ui="pos-order-panel-v16.header"><div class="prg-types" data-ui="pos-order-panel-v16.types"><button type="button" class="prg-type"><svg class="lucide lucide-utensils" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/></svg>Dine In</button><button type="button" class="prg-type is-active"><svg class="lucide lucide-shopping-bag" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>Take Away</button><button type="button" class="prg-type"><svg class="lucide lucide-truck" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2"/><path d="M15 18H9"/><path d="M19 18h2a1 1 0 0 0 1-1v-3.65a1 1 0 0 0-.22-.624l-3.48-4.35A1 1 0 0 0 17.52 8H14"/><circle cx="17" cy="18" r="2"/><circle cx="7" cy="18" r="2"/></svg>Delivery</button><button type="button" class="prg-type"><svg class="lucide lucide-phone" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13.832 16.568a1 1 0 0 0 1.213-.303l.355-.465A2 2 0 0 1 17 15h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2A18 18 0 0 1 2 4a2 2 0 0 1 2-2h3a2 2 0 0 1 2 2v3a2 2 0 0 1-.8 1.6l-.468.351a1 1 0 0 0-.292 1.233 14 14 0 0 0 6.392 6.384"/></svg>Phone In</button><button type="button" class="prg-type"><svg class="lucide lucide-globe" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg>Aggregators</button></div><div class="prg-cust" data-ui="pos-order-panel-v16.customer"><span>Search customer...</span><svg class="lucide lucide-chevron-down" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></div><div class="prg-pax" data-ui="pos-order-panel-v16.pax"><span class="prg-pax__lbl">Pax</span><div class="prg-step"><button type="button" class="prg-round" aria-label="Decrease">-</button><span>2</span><button type="button" class="prg-round" aria-label="Increase">+</button></div></div></div><div class="prg-lines" data-ui="pos-order-panel-v16.lines"><div class="prg-line" data-ui="pos-order-panel-v16.line-1"><div class="prg-line__row"><div class="prg-line__main"><div class="prg-line__top"><h3 class="prg-line__name">Hummus</h3></div><p class="prg-line__price"><span class="u-num">AED 22.00</span></p></div><div class="prg-line__ctl"><button type="button" class="prg-icon prg-icon--edit" title="Edit item" data-ui="pos-order-panel-v16.edit-1"><svg class="lucide lucide-edit" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.375 2.625a1 1 0 0 1 3 3l-9.013 9.014a2 2 0 0 1-.853.505l-2.873.84a.5.5 0 0 1-.62-.62l.84-2.873a2 2 0 0 1 .506-.852z"/></svg></button><div class="prg-step"><button type="button" class="prg-round" aria-label="Decrease">-</button><span>1</span><button type="button" class="prg-round" aria-label="Increase">+</button></div><button type="button" class="prg-icon prg-icon--del" aria-label="Remove" data-ui="pos-order-panel-v16.delete-1"><svg class="lucide lucide-trash2" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg></button></div></div></div><button type="button" class="prg-clear" data-ui="pos-order-panel-v16.clear">Clear cart</button></div><div class="prg-pfoot" data-ui="pos-order-panel-v16.footer"><div class="prg-total"><div class="prg-total__l"><button type="button" class="prg-cmt" title="Add comment" data-ui="pos-order-panel-v16.comment"><svg class="lucide lucide-message-square" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></button><span class="prg-total__t">Total</span></div><span class="prg-total__t" data-ui="pos-order-panel-v16.total"><span class="u-num">AED 22.00</span></span></div><button type="button" class="u-btn u-btn--default prg-submit" data-ui="pos-order-panel-v16.submit">Add New Order</button></div></div></div>
</div>
</body></html>
