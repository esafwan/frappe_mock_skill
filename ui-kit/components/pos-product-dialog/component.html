<div class="u-dialog-wrap pd" data-ui="pos-product-dialog" style="width:1440px;height:900px"><div class="u-dialog-scrim"></div><div class="u-dialog pd-dlg--scroll pd-product" role="dialog" aria-modal="true" data-ui="dialog"><div class="pd-product__media" data-ui="media"><img src="{{item_image}}" alt="{{item_name}}" data-ui="image"><button type="button" class="u-btn u-btn--outline u-btn--icon pd-product__close" aria-label="Close" data-ui="close"><svg class="lucide lucide-x" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button></div>
<div class="pd-product__col" data-ui="details">
<h2 class="pd-product__title" data-ui="item-name">{{item_name}}</h2>
<div class="pd-product__meta"><span class="pd-product__code">{{item_code}}</span><span class="pd-product__dot">&bull;</span><span class="pd-product__course">{{course_label}}</span></div>
<div class="pd-product__sec" data-ui="instructions"><h3>{{special_label}}</h3><input class="pd-input" type="text" placeholder="{{special_ph}}" value="{{special_text}}" data-ui="comments"></div>
<div class="pd-product__sec" data-ui="quantity"><h3>{{qty_label}}</h3><div class="pd-product__qty" role="group"><button type="button" class="u-btn u-btn--outline u-btn--icon" aria-label="Decrease" data-ui="qty-minus"><svg class="lucide lucide-minus" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/></svg></button><input class="pd-input pd-input--qty" type="number" value="{{qty}}" data-ui="qty-input"><button type="button" class="u-btn u-btn--outline u-btn--icon" aria-label="Increase" data-ui="qty-plus"><svg class="lucide lucide-plus" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg></button></div></div>
<div class="pd-product__sec" data-ui="variants"><h3>{{variants_label}}</h3><div class="pd-product__variants"><button type="button" class="u-btn u-btn--outline pd-pick is-sel" aria-pressed="true" data-ui="variant-1"><div class="pd-pick__name">{{v1_name}}</div><div class="pd-pick__price"><span class="u-num">{{v1_price}}</span></div></button><button type="button" class="u-btn u-btn--outline pd-pick" aria-pressed="false" data-ui="variant-2"><div class="pd-pick__name">{{v2_name}}</div><div class="pd-pick__price"><span class="u-num">{{v2_price}}</span></div></button></div></div>
</div>
<div class="pd-product__col pd-product__col--side" data-ui="side">
<div class="pd-product__addons"><div data-ui="addons"><h3>{{addons_label}}</h3><div class="pd-product__addon-list"><button type="button" class="u-btn u-btn--outline pd-pick pd-pick--addon" aria-pressed="false" data-ui="addon-1"><div style="display:flex;align-items:center;justify-content:space-between;width:100%"><span>{{a1_name}}</span><span class="pd-pick__price" style="font-weight:400">+<span class="u-num">{{a1_price}}</span></span></div></button><button type="button" class="u-btn u-btn--outline pd-pick pd-pick--addon" aria-pressed="false" data-ui="addon-2"><div style="display:flex;align-items:center;justify-content:space-between;width:100%"><span>{{a2_name}}</span><span class="pd-pick__price" style="font-weight:400">+<span class="u-num">{{a2_price}}</span></span></div></button><button type="button" class="u-btn u-btn--outline pd-pick pd-pick--addon" aria-pressed="false" data-ui="addon-3"><div style="display:flex;align-items:center;justify-content:space-between;width:100%"><span>{{a3_name}}</span><span class="pd-pick__price" style="font-weight:400">+<span class="u-num">{{a3_price}}</span></span></div></button></div></div></div>
<div class="pd-product__foot" data-ui="total-bar"><div class="pd-product__total"><span>{{total_label}}&nbsp;</span><span data-ui="total"><span class="u-num">{{total}}</span></span></div>
<button type="button" class="u-btn u-btn--default u-btn--lg pd-product__submit" data-ui="submit">{{submit_text}}</button></div>
</div></div></div>
