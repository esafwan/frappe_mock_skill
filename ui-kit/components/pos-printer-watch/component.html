<div class="psh psh-stage psh-stage--scrim" data-ui="pos-printer-watch"><div class="psh-dialog psh-dialog--pw" data-ui="pos-printer-watch.dialog"><div class="psh-dialog__head"><div class="psh-dialog__headrow"><div><h2 class="psh-dialog__title">{{pw_title}}</h2><p class="psh-dialog__desc">{{pw_desc}}</p></div><button type="button" class="psh-sync" data-ui="pos-printer-watch.sync"><svg class="lucide lucide-refresh-cw" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg><span>{{pw_sync}}</span></button></div><button type="button" class="psh-close" aria-label="Close"><svg class="lucide lucide-x" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button></div><div class="psh-dialog__body"><ul class="psh-plist"><li class="psh-pcard" data-ui="pos-printer-watch.card-online"><div class="psh-pcard__top"><h3>{{p1_name}}</h3><span class="psh-pbadge psh-pbadge--success"><span class="psh-pbadge__dot">●</span>{{st_excellent}}</span></div><div class="psh-pcard__meta"><div class="psh-pcard__counts"><span>{{pw_success}} <strong>{{p1_ok}}</strong></span><span>{{pw_failed}} <strong>{{p1_fail}}</strong></span></div><span class="psh-pcard__time">{{p1_time}}</span></div></li><li class="psh-pcard" data-ui="pos-printer-watch.card-offline"><div class="psh-pcard__top"><h3>{{p2_name}}</h3><span class="psh-pbadge psh-pbadge--danger"><span class="psh-pbadge__dot">●</span>{{st_critical}}</span></div><div class="psh-pcard__meta"><div class="psh-pcard__counts"><span>{{pw_success}} <strong>{{p2_ok}}</strong></span><span>{{pw_failed}} <strong class="is-bad">{{p2_fail}}</strong></span></div><span class="psh-pcard__time">{{p2_time}}</span></div></li></ul></div></div></div>
