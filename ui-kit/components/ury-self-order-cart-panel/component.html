<aside class="so so-cart" data-ui="ury-self-order-cart-panel"><div class="so-cart__scroll"><section class="so-cart__order"><h2 class="so-cart__h">{{order_title}}</h2><ul class="so-cart__rows">
<li><span>{{o1_name}} × {{o1_qty}}</span><span>{{o1_amount}}</span></li><li><span>{{o2_name}} × {{o2_qty}}</span><span>{{o2_amount}}</span></li></ul>
<div class="so-cart__total"><span>{{total_label}}</span><span>{{order_total}}</span></div></section><section><h2 class="so-cart__h">{{cart_title}}</h2><ul class="so-cart__lines"><li><span class="so-cart__name">{{c1_name}}</span><span class="so-cart__ctl"><button type="button" class="so-cart__step" aria-label="Remove one">−</button><span class="so-cart__qty">{{c1_qty}}</span><button type="button" class="so-cart__step" aria-label="Add one more">+</button></span></li><li><span class="so-cart__name">{{c2_name}}</span><span class="so-cart__ctl"><button type="button" class="so-cart__step" aria-label="Remove one">−</button><span class="so-cart__qty">{{c2_qty}}</span><button type="button" class="so-cart__step" aria-label="Add one more">+</button></span></li></ul></section></div>
<div class="so-cart__foot"><div class="so-cart__sum"><span>{{count_label}}</span><span class="so-num" data-ui="ury-self-order-cart-panel.total">{{cart_total}}</span></div><button type="button" class="so-cart__btn so-cart__btn--place" data-ui="ury-self-order-cart-panel.place-order">{{place_order}}</button></div></aside>
