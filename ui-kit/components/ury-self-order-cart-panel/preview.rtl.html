<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><title>Self-order cart panel</title>
<link rel="stylesheet" href="../../tokens/css/ury-v16/ury-fonts.css">
<link rel="stylesheet" href="../../tokens/css/ury-v16/ury-ui-tokens.css">
<link rel="stylesheet" href="../../tokens/css/ury-v16/ury-ui-base.css">
<link rel="stylesheet" href="../../tokens/css/ury-v16/components/self-order.css">
<style>html,body{margin:0}body{background:hsl(var(--background));min-height:640px}#ui-kit-stage{position:absolute;left:0;top:0;width:410px;height:640px}*{animation:none!important;transition:none!important;caret-color:transparent!important}</style></head>
<body>
<div id="ui-kit-stage">
<aside class="so so-cart" data-ui="ury-self-order-cart-panel"><div class="so-cart__scroll"><section class="so-cart__order"><h2 class="so-cart__h">طلبك حتى الآن</h2><ul class="so-cart__rows">
<li><span>إسبريسو × 1</span><span>12.00 د.إ</span></li><li><span>كابتشينو × 2</span><span>36.00 د.إ</span></li></ul>
<div class="so-cart__total"><span>المجموع</span><span>48.00 د.إ</span></div></section><section><h2 class="so-cart__h">السلة</h2><ul class="so-cart__lines"><li><span class="so-cart__name">لاتيه</span><span class="so-cart__ctl"><button type="button" class="so-cart__step" aria-label="Remove one">−</button><span class="so-cart__qty">1</span><button type="button" class="so-cart__step" aria-label="Add one more">+</button></span><span class="so-cart__amt">20.00 د.إ</span></li><li><span class="so-cart__name">كرواسون</span><span class="so-cart__ctl"><button type="button" class="so-cart__step" aria-label="Remove one">−</button><span class="so-cart__qty">2</span><button type="button" class="so-cart__step" aria-label="Add one more">+</button></span><span class="so-cart__amt">28.00 د.إ</span></li></ul></section></div>
<div class="so-cart__foot"><div class="so-cart__sum"><span>3 عناصر</span><span class="so-num" data-ui="ury-self-order-cart-panel.total">48.00 د.إ</span></div><button type="button" class="so-cart__btn so-cart__btn--place" data-ui="ury-self-order-cart-panel.place-order">تأكيد الطلب</button></div></aside>
</div>
</body></html>
