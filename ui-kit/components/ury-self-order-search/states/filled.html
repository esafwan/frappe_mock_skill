<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Self-order search bar / filled</title>
<link rel="stylesheet" href="../../../tokens/css/ury-v16/ury-fonts.css">
<link rel="stylesheet" href="../../../tokens/css/ury-v16/ury-ui-tokens.css">
<link rel="stylesheet" href="../../../tokens/css/ury-v16/ury-ui-base.css">
<link rel="stylesheet" href="../../../tokens/css/ury-v16/components/self-order.css">
<style>html,body{margin:0}body{background:hsl(var(--background));min-height:0px}#ui-kit-stage{position:absolute;left:0;top:0;width:390px}*{animation:none!important;transition:none!important;caret-color:transparent!important}</style></head>
<body>
<div id="ui-kit-stage">
<div class="so so-search-wrap" data-ui="ury-self-order-search"><div class="so-search" data-ui="ury-self-order-search.box"><div class="so-search__box">
<span class="so-search__icon so-muted" style="color:hsl(var(--muted-foreground))"><svg class="lucide lucide-search" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21 21-4.34-4.34"/><circle cx="11" cy="11" r="8"/></svg></span>
<input class="so-search__input" type="text" readonly aria-label="Search menu" placeholder="Search menu..." value="Cappuccino">
<button type="button" class="so-search__clear" aria-label="Clear search"><svg class="lucide lucide-x" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button></div></div></div>
</div>
</body></html>
