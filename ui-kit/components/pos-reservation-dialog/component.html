<div class="rv rv-stage" data-ui="pos-reservation-dialog"><div class="u-dialog-scrim"></div><div class="u-dialog rv-dlg rv-dlg--create" role="dialog" aria-modal="true" data-ui="pos-reservation-dialog.dialog"><button type="button" class="u-dialog-close" aria-label="Close"><svg class="lucide lucide-x" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
  <div class="rv-dh" data-ui="pos-reservation-dialog.header"><div class="rv-dh__row"><div class="rv-dh__chip"><svg class="lucide lucide-rectangle-horizontal" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="20" height="12" x="2" y="6" rx="2"/></svg></div><div><h2 class="rv-dh__title">{{table}}</h2><p class="rv-dh__desc">{{seats}}</p></div></div></div>
  <div class="rv-db" data-ui="pos-reservation-dialog.body"><div class="rv-form" data-ui="pos-reservation-dialog.form">
    <div class="rv-fld"><label class="rv-flbl">{{customer_label}} <span class="rv-req">*</span></label><div class="rv-cv"><div><p class="rv-cv__name">{{customer_name}}</p><p class="rv-cv__phone u-num">{{customer_phone}}</p></div><button type="button" class="u-btn u-btn--ghost u-btn--sm">{{change}}</button></div></div><div class="rv-grid2">
  <div class="rv-fld"><label class="rv-flbl">{{phone_label}} <span class="rv-req">*</span></label><div class="rv-fi"><svg class="lucide lucide-phone rv-fi__s" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13.832 16.568a1 1 0 0 0 1.213-.303l.355-.465A2 2 0 0 1 17 15h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2A18 18 0 0 1 2 4a2 2 0 0 1 2-2h3a2 2 0 0 1 2 2v3a2 2 0 0 1-.8 1.6l-.468.351a1 1 0 0 0-.292 1.233 14 14 0 0 0 6.392 6.384"/></svg><div class="rv-in rv-in--ps"><span class="u-num">{{customer_phone}}</span></div></div></div>
  <div class="rv-fld"><label class="rv-flbl">{{pax_label}} <span class="rv-req">*</span></label><div class="rv-fi"><svg class="lucide lucide-users rv-fi__s" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><path d="M16 3.128a4 4 0 0 1 0 7.744"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><circle cx="9" cy="7" r="4"/></svg><div class="rv-in rv-in--ps"><span class="u-num">{{pax}}</span></div></div></div></div><div class="rv-grid2">
  <div class="rv-fld"><label class="rv-flbl">{{date_label}} <span class="rv-req">*</span></label><div class="rv-date"><span class="u-num">{{date}}</span><svg class="lucide lucide-calendar" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/></svg></div></div>
  <div class="rv-fld"><label class="rv-flbl">{{time_label}} <span class="rv-req">*</span></label><div class="rv-fi"><div class="rv-in rv-in--time"><span class="u-num">{{time}}</span></div><svg class="lucide lucide-clock rv-fi__e" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></div></div></div><div class="rv-fld"><label class="rv-flbl">{{notes_label}}</label><div class="rv-ta is-ph">{{notes_placeholder}}</div></div>
  </div></div>
  <div class="rv-df rv-df--gray" data-ui="pos-reservation-dialog.footer"><button type="button" class="u-btn u-btn--outline">{{btn_cancel}}</button><button type="button" class="u-btn u-btn--default">{{btn_reserve}}</button></div></div></div>
