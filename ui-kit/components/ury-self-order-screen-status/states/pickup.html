<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Self-order mobile order status screen / pickup</title>
<link rel="stylesheet" href="../../../tokens/css/ury-v16/ury-fonts.css">
<link rel="stylesheet" href="../../../tokens/css/ury-v16/ury-ui-tokens.css">
<link rel="stylesheet" href="../../../tokens/css/ury-v16/ury-ui-base.css">
<link rel="stylesheet" href="../../../tokens/css/ury-v16/components/self-order.css">
<link rel="stylesheet" href="../../../tokens/css/ury-v16/components/self-order-mobile.css">
<style>html,body{margin:0}body{background:hsl(var(--background));min-height:844px}#ui-kit-stage{position:absolute;left:0;top:0;width:390px;height:844px}*{animation:none!important;transition:none!important;caret-color:transparent!important}</style></head>
<body>
<div id="ui-kit-stage">
<div class="u-screen so som " data-ui="ury-self-order-screen-status" style="width:390px;height:844px;position:relative;overflow:hidden"><div class="som-status so" style="display:flex;flex-direction:column"><h1 class="som-status__h" data-ui="ury-self-order-screen-status.title">Order confirmed</h1><p class="som-status__p">Thanks — your order has been sent to the restaurant.</p>
<div class="som-pick" data-ui="ury-self-order-screen-status.pickup"><div class="som-pick__l">Pickup code</div><div class="som-pick__c">A-27</div></div>
<div class="som-srows" data-ui="ury-self-order-screen-status.rows"><div class="som-srow"><span class="som-muted">Order status</span><b>Submitted</b></div><div class="som-srow"><span class="som-muted">Bill status</span><b>Not billed yet</b></div>
</div>
<div class="som-acts" data-ui="ury-self-order-screen-status.actions"><button type="button" class="som-btn som-btn--out" data-ui="ury-self-order-screen-status.done">Done</button></div></div></div>
</div>
</body></html>
