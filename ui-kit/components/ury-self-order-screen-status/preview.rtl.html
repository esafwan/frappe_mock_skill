<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><title>Self-order mobile order status screen</title>
<link rel="stylesheet" href="../../tokens/css/ury-v16/ury-fonts.css">
<link rel="stylesheet" href="../../tokens/css/ury-v16/ury-ui-tokens.css">
<link rel="stylesheet" href="../../tokens/css/ury-v16/ury-ui-base.css">
<link rel="stylesheet" href="../../tokens/css/ury-v16/components/self-order.css">
<link rel="stylesheet" href="../../tokens/css/ury-v16/components/self-order-mobile.css">
<style>html,body{margin:0}body{background:hsl(var(--background));min-height:844px}#ui-kit-stage{position:absolute;left:0;top:0;width:390px;height:844px}*{animation:none!important;transition:none!important;caret-color:transparent!important}</style></head>
<body>
<div id="ui-kit-stage">
<div class="u-screen so som " data-ui="ury-self-order-screen-status" style="width:390px;height:844px;position:relative;overflow:hidden"><div class="som-status so" style="display:flex;flex-direction:column"><h1 class="som-status__h" data-ui="ury-self-order-screen-status.title">تم تأكيد الطلب</h1><p class="som-status__p">شكرًا — تم إرسال طلبك إلى المطعم.</p>

<div class="som-srows" data-ui="ury-self-order-screen-status.rows"><div class="som-srow"><span class="som-muted">حالة الطلب</span><b>تم الإرسال</b></div><div class="som-srow"><span class="som-muted">حالة الفاتورة</span><b>لم تُصدر بعد</b></div>
<div class="som-srow" style="display:block"><div class="som-muted" style="margin-bottom:4px">طلبات الخدمة المفتوحة</div><div style="display:flex;justify-content:space-between"><span>استدعاء النادل</span><b>مفتوح</b></div></div></div>
<div class="som-acts" data-ui="ury-self-order-screen-status.actions"><button type="button" class="som-btn" data-ui="ury-self-order-screen-status.add-more">أضف المزيد</button><button type="button" class="som-btn som-btn--out" data-ui="ury-self-order-screen-status.done">تم</button></div></div></div>
</div>
</body></html>
