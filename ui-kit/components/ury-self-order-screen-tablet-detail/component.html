<div class="u-screen so sot" data-ui="ury-self-order-screen-tablet-detail" style="width:1280px;height:800px;position:relative;overflow:hidden"><header class="sot-head" data-ui="ury-self-order-screen-tablet-detail.header"><h1 class="sot-title">{{title}}</h1><button type="button" class="sot-new" data-ui="ury-self-order-screen-tablet-detail.new-order">{{new_order}}</button></header><div class="sot-body" data-ui="ury-self-order-screen-tablet-detail.body"><main class="sot-main" data-ui="ury-self-order-screen-tablet-detail.main"><div class="sot-detail" data-ui="ury-self-order-screen-tablet-detail.detail"><div class="sot-detail__back"><button type="button" class="sot-detail__backbtn" data-ui="ury-self-order-screen-tablet-detail.back"><span class="so-flip"><svg class="lucide lucide-chevron-left" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></span>{{back}}</button></div>
<img class="sot-detail__img" src="{{detail_img}}" alt="{{name}}" data-ui="ury-self-order-screen-tablet-detail.image"><div class="sot-detail__info"><div><h1 class="sot-detail__name">{{name}}</h1><p class="sot-detail__desc">{{desc}}</p></div>
<div class="sot-detail__rate">{{rate}}</div><div class="sot-detail__group"><div class="sot-detail__label">{{variants_label}}</div><div class="sot-detail__list" data-ui="ury-self-order-screen-tablet-detail.variants"><button type="button" class="so-opt so-opt--on" data-ui="ury-self-order-screen-tablet-detail.vrow-1"><span>{{v1_name}}</span><span class="so-opt__rate">{{v1_rate}}</span></button><button type="button" class="so-opt" data-ui="ury-self-order-screen-tablet-detail.vrow-2"><span>{{v2_name}}</span><span class="so-opt__rate">{{v2_rate}}</span></button></div></div><div class="sot-detail__group"><div class="sot-detail__label">{{addons_label}}</div><div class="sot-detail__list" data-ui="ury-self-order-screen-tablet-detail.addons"><button type="button" class="so-opt" data-ui="ury-self-order-screen-tablet-detail.arow-1"><span>{{a1_name}}</span><span class="so-opt__rate">{{a1_rate}}</span></button><button type="button" class="so-opt so-opt--on" data-ui="ury-self-order-screen-tablet-detail.arow-2"><span>{{a2_name}}</span><span class="so-opt__rate">{{a2_rate}}</span></button></div></div>
<div class="sot-detail__qty" data-ui="ury-self-order-screen-tablet-detail.qty"><button type="button" class="sot-detail__step" aria-label="Decrease quantity"><svg class="lucide lucide-minus" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/></svg></button><div class="sot-detail__n">{{qty}}</div><button type="button" class="sot-detail__step" aria-label="Increase quantity"><svg class="lucide lucide-plus" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg></button></div>
<button type="button" class="sot-detail__add" data-ui="ury-self-order-screen-tablet-detail.add">{{add_to_cart}}</button></div></div></main><aside class="so so-cart" data-ui="ury-self-order-screen-tablet-detail.cart"><div class="so-cart__scroll"><section><h2 class="so-cart__h">{{cart_title}}</h2><ul class="so-cart__lines"><li><span class="so-cart__name">{{c1_name}}</span><span class="so-cart__ctl"><button type="button" class="so-cart__step" aria-label="Remove one">−</button><span class="so-cart__qty">{{c1_qty}}</span><button type="button" class="so-cart__step" aria-label="Add one more">+</button></span><span class="so-cart__amt">{{c1_amount}}</span></li><li><span class="so-cart__name">{{c2_name}}</span><span class="so-cart__ctl"><button type="button" class="so-cart__step" aria-label="Remove one">−</button><span class="so-cart__qty">{{c2_qty}}</span><button type="button" class="so-cart__step" aria-label="Add one more">+</button></span><span class="so-cart__amt">{{c2_amount}}</span></li></ul></section></div>
<div class="so-cart__foot"><div class="so-cart__sum"><span>{{count_label}}</span><span class="so-num" data-ui="ury-self-order-cart-panel.total">{{cart_total}}</span></div><button type="button" class="so-cart__btn so-cart__btn--place" data-ui="ury-self-order-cart-panel.place-order">{{place_order}}</button></div></aside></div></div>
