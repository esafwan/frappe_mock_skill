<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>URY landscape kiosk cart / empty</title>
<link rel="stylesheet" href="../../../tokens/css/ury-v16/ury-fonts.css">
<link rel="stylesheet" href="../../../tokens/css/ury-v16/ury-ui-tokens.css">
<link rel="stylesheet" href="../../../tokens/css/ury-v16/ury-ui-base.css">
<link rel="stylesheet" href="../../../tokens/css/ury-v16/components/kiosk-landscape.css">
<style>html,body{margin:0}body{background:hsl(var(--background));min-height:1080px}#ui-kit-stage{position:absolute;left:0;top:0;width:1920px;height:1080px}*{animation:none!important;transition:none!important;caret-color:transparent!important}</style></head>
<body>
<div id="ui-kit-stage">
<div class="u-screen kl" data-ui="ury-kiosk-screen-landscape-cart" style="width:1920px;height:1080px;position:relative;overflow:hidden"><div class="kl-root"><header class="kl-head" data-ui="ury-kiosk-screen-landscape-cart.header"><h1 class="kl-title">Order for Pickup</h1><button type="button" class="kl-new" data-ui="ury-kiosk-screen-landscape-cart.new-order">New Order</button></header><div class="kl-fill"><div class="kl-cp" data-ui="ury-kiosk-screen-landscape-cart.page"><header class="kl-cp__head"><button type="button" class="kl-cp__back" aria-label="Back to menu" data-ui="ury-kiosk-screen-landscape-cart.back">← Back to menu</button><h1 class="kl-cp__h1">Your Cart</h1><span class="kl-cp__sp" aria-hidden="true"></span></header>
<div class="kl-cp__list-wrap"><div class="kl-cp__empty" data-ui="ury-kiosk-screen-landscape-cart.empty"><p class="kl-muted">Your cart is empty.</p><button type="button" class="kl-cp__browse">Browse the menu</button></div></div><div class="kl-cp__foot"><div class="kl-cp__sum"><span>0 items</span><span data-ui="ury-kiosk-screen-landscape-cart.total">AED 0.00</span></div>
<button type="button" class="kl-cp__go is-disabled" disabled data-ui="ury-kiosk-screen-landscape-cart.checkout">Proceed to checkout</button></div></div></div></div></div>
</div>
</body></html>
