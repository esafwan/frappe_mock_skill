<div class="u-screen kl" data-ui="ury-kiosk-screen-landscape-cart" style="width:1920px;height:1080px;position:relative;overflow:hidden"><div class="kl-root"><header class="kl-head" data-ui="ury-kiosk-screen-landscape-cart.header"><h1 class="kl-title">{{title}}</h1><button type="button" class="kl-new" data-ui="ury-kiosk-screen-landscape-cart.new-order">{{new_order}}</button></header><div class="kl-fill"><div class="kl-cp" data-ui="ury-kiosk-screen-landscape-cart.page"><header class="kl-cp__head"><button type="button" class="kl-cp__back" aria-label="Back to menu" data-ui="ury-kiosk-screen-landscape-cart.back">{{back_label}}</button><h1 class="kl-cp__h1">{{cart_title}}</h1><span class="kl-cp__sp" aria-hidden="true"></span></header>
<div class="kl-cp__list-wrap"><ul class="kl-cp__list"><li data-ui="ury-kiosk-screen-landscape-cart.line-1"><div class="kl-cp__row"><span class="kl-cp__name">{{c1_name}}</span><span class="kl-ctl"><button type="button" class="kl-step" aria-label="Remove one">−</button><span class="kl-qty">{{c1_qty}}</span><button type="button" class="kl-step" aria-label="Add one more">+</button></span></div></li><li data-ui="ury-kiosk-screen-landscape-cart.line-2"><div class="kl-cp__row"><span class="kl-cp__name">{{c2_name}}</span><span class="kl-ctl"><button type="button" class="kl-step" aria-label="Remove one">−</button><span class="kl-qty">{{c2_qty}}</span><button type="button" class="kl-step" aria-label="Add one more">+</button></span></div></li></ul></div><div class="kl-cp__foot"><div class="kl-cp__sum"><span>{{count_label}}</span><span data-ui="ury-kiosk-screen-landscape-cart.total">{{cart_total}}</span></div>
<button type="button" class="kl-cp__go" data-ui="ury-kiosk-screen-landscape-cart.checkout">{{checkout}}</button></div></div></div></div></div>
