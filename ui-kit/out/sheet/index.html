<style>/* Kit base: the only place raw colours live (tests/rtl-dark.mjs enforces this). Generic; no doctype/app/brand names.
   1. --kit-* colour tokens (light = :root, dark = [data-theme="dark"]). Renderers use var(--kit-*) instead of hex.
   2. Dark fixes for kit-drawn surfaces whose inline styles carry fallbacks.
   3. RTL: logical overrides for physical left/right in kit-drawn CSS. Add as [dir="rtl"] rules, never in renderers. */
:root{
  --kit-green:#28a745;--kit-red:#e24c4c;--kit-blue:#318ad8;--kit-orange:#ff8c0a;--kit-grey:#6c7680;
  --kit-axis-text:#6c7680;--kit-axis-line:#d1d8dd;--kit-skeleton:#ededed;--kit-skeleton-hi:#f7f7f7;
  --kit-heat-0:#ebedf0;--kit-heat-1:#c6e48b;--kit-heat-2:#7bc96f;--kit-heat-3:#239a3b;--kit-heat-4:#196127;
  --kit-surface:#fff;--kit-surface-sunken:#f7fafc;--kit-border:#ededed;--kit-ink:#171717;--kit-scrim:rgba(0,0,0,.4);
  --kit-shadow:rgba(0,0,0,.12);--kit-primary:#5e64ff;
  /* status fills for the tool pages (coverage matrix, contact sheet) */
  --kit-ok-bg:#c9f0d4;--kit-bad-bg:#f7c5c5;--kit-bad-ink:#a11;--kit-warn-ink:#a60;
  /* map tile palette (renderers/map): drawn tiles are not part of the app theme, so they have their own tokens, with a dim set for dark */
  --kit-map-water:#cfe0ea;--kit-map-land-a:#e9ece6;--kit-map-land-b:#eef0ea;--kit-map-edge:#dfe2db;--kit-map-road:#fff;--kit-map-road-edge:#d9dcd2;--kit-map-park:#dde8d3;
}
[data-theme="dark"]{
  color-scheme:dark;
  --kit-green:#3fbd62;--kit-red:#f06a6a;--kit-blue:#5aa5ea;--kit-orange:#ffa23a;--kit-grey:#9aa3ad;
  --kit-axis-text:#9aa3ad;--kit-axis-line:#3a3a3a;--kit-skeleton:#2e2e2e;--kit-skeleton-hi:#383838;
  --kit-heat-0:#2d333b;--kit-heat-1:#0e4429;--kit-heat-2:#006d32;--kit-heat-3:#26a641;--kit-heat-4:#39d353;
  --kit-surface:#171717;--kit-surface-sunken:#1f1f1f;--kit-border:#2e2e2e;--kit-ink:#f3f3f3;--kit-scrim:rgba(0,0,0,.65);
  --kit-shadow:rgba(0,0,0,.5);--kit-primary:#8b90ff;
  --kit-ok-bg:#1f4a2c;--kit-bad-bg:#5a2626;--kit-bad-ink:#f28b8b;--kit-warn-ink:#e0a458;
  --kit-map-water:#2a3f4d;--kit-map-land-a:#2b2f2a;--kit-map-land-b:#262a25;--kit-map-edge:#343830;--kit-map-road:#3d4239;--kit-map-road-edge:#444a3f;--kit-map-park:#2c3a2a;
}
/* 2. dark surfaces that renderers draw with light fallbacks */
[data-theme="dark"] .datatable .dt-row,[data-theme="dark"] .datatable .dt-header .dt-row,[data-theme="dark"] .datatable .dt-row-totals{background:var(--kit-surface);border-color:var(--kit-border);color:var(--kit-ink)}
[data-theme="dark"] .datatable .dt-header .dt-row,[data-theme="dark"] .datatable .dt-row-totals{background:var(--kit-surface-sunken)}
[data-theme="dark"] .skeleton-box{background:var(--kit-skeleton)!important}
[data-theme="dark"] .datepicker.active,[data-theme="dark"] .form-in-grid[data-depth]:not([data-depth="0"]){background:var(--kit-surface);border-color:var(--kit-border);color:var(--kit-ink)}
[data-theme="dark"] .y-axis text,[data-theme="dark"] .x-axis text{fill:var(--kit-axis-text)}
[data-theme="dark"] .grid-line{stroke:var(--kit-axis-line)}
/* 3. RTL logical overrides */
[dir="rtl"] body{direction:rtl;text-align:start}
[dir="rtl"] .menu-btn-group>.dropdown-menu,[dir="rtl"] .dropdown-menu-right{right:auto;left:0}
[dir="rtl"] .datepicker.active{left:auto;right:0}
[dir="rtl"] .dock-item-unread{right:auto;left:8px}
[dir="rtl"] .datatable .dt-cell__resize-handle{right:auto;left:0}
[dir="rtl"] .text-right{text-align:left}
[dir="rtl"] .text-left{text-align:right}
[dir="rtl"] .datatable .dt-cell--align-right,[dir="rtl"] .dt-cell--col-type-currency .dt-cell__content{text-align:left}
[dir="rtl"] svg,[dir="rtl"] .chart-container{direction:ltr}
[dir="rtl"] input[type="number"],[dir="rtl"] .ltr-isolate{unicode-bidi:plaintext}
[data-theme="dark"] body{background-color:var(--bg-color,var(--kit-surface));color:var(--text-color,var(--kit-ink))}
body{font:13px/1.4 system-ui,sans-serif;margin:24px;color:var(--kit-ink);background:var(--kit-surface)}
h1{font-size:18px;margin:0 0 4px}h2{font-size:15px;margin:24px 0 8px;border-bottom:1px solid var(--kit-axis-line)}h2 small{color:var(--kit-grey);font-weight:400}
.grid{display:flex;flex-wrap:wrap;gap:16px}figure{margin:0}
.thumb{overflow:hidden;border:1px solid var(--kit-axis-line);border-radius:4px;background:var(--kit-surface-sunken);position:relative}
.thumb iframe{border:0;transform-origin:0 0;pointer-events:none;background:var(--kit-surface)}
.thumb.err{color:var(--kit-bad-ink);background:var(--kit-bad-bg);padding:8px;box-sizing:border-box;font-size:11px;overflow:auto}
figcaption{font-size:11px;margin-top:4px;max-width:360px;word-break:break-all}figcaption b{color:var(--kit-warn-ink)}
figure.bad figcaption{color:var(--kit-bad-ink)}
</style></head><body>
