<!doctype html>
<html lang="ar" data-system="la" data-theme="dark" dir="rtl">
<head><meta charset="utf-8"><title>Counter amount.ar-AED.dark</title>
<link rel="stylesheet" href="../../tokens/css/fonts.css">
<link rel="stylesheet" href="../../tokens/css/frappe-desk.css">
<link rel="stylesheet" href="../../tokens/css/la-desk-vars.css">
<link rel="stylesheet" href="../../tokens/css/la-desk-base.css">
<link rel="stylesheet" href="../../tokens/css/la-desk-components.css">
<link rel="stylesheet" href="../../tokens/css/la-desk-data.css">
<link rel="stylesheet" href="../../tokens/css/la-desk-components.css">
<style>html,body{margin:0}*{animation:none!important;transition:none!important;caret-color:transparent!important}#ui-kit-stage{position:absolute;left:0;top:0;width:390px;min-height:844px}#ui-kit-stage{padding:0!important}.lc-stack{display:flex;flex-direction:column;gap:12px}.la-cshell-screen{display:block!important}</style><link rel="stylesheet" href="../../tokens/css/la-counter.css"></head>
<body class="la-root"><div id="ui-kit-stage">
<div class="la-cshell is-default" data-ui="la-counter-amount" data-page="counter-amount" data-variant="ar-AED.dark" data-currency="AED" data-state="populated" data-state="default">
  <header class="la-cshell-bar" data-ui="la-counter-amount.topbar"><span class="la-cshell-title" data-ui="la-counter-amount.title">الكاشير</span><span class="la-cshell-badge" data-ui="la-counter-amount.user-badge">c@x</span></header>
  <div class="la-cshell-body" data-ui="la-counter-amount.body">
    
    <div class="la-cshell-bill" data-ui="la-counter-amount.bill-for">فاتورة لـ <b>عضو تجريبي</b></div>
    <div class="lc-stack lc-amt" data-ui="la-counter-amount.form"><div class="lc-field" data-ui="la-counter-amount.amount" data-state="typing">
  <label class="lc-label" data-ui="la-counter-amount.amount.label">مبلغ الفاتورة (AED)</label>
  <div class="lc-input" data-ui="la-counter-amount.amount.input"><span class="lc-value" data-ui="la-counter-amount.amount.value">250</span><span class="lc-ph" data-ui="la-counter-amount.amount.placeholder">أدخل مبلغ الفاتورة</span></div>
  <div class="lc-error" data-ui="la-counter-amount.amount.error">أدخل مبلغاً أكبر من الصفر</div>
</div><div class="lc-btn" data-ui="la-counter-amount.preview" data-state="primary" data-size="lg"><span data-ui="la-counter-amount.preview.label">معاينة النقاط</span></div></div>
  </div>
</div>

</div></body></html>
