<!doctype html>
<html lang="en" data-system="la" data-theme="dark">
<head><meta charset="utf-8"><title>Counter void.zero.dark</title>
<link rel="stylesheet" href="../../tokens/css/fonts.css">
<link rel="stylesheet" href="../../tokens/css/frappe-desk.css">
<link rel="stylesheet" href="../../tokens/css/la-desk-vars.css">
<link rel="stylesheet" href="../../tokens/css/la-desk-base.css">
<link rel="stylesheet" href="../../tokens/css/la-counter-base.css">
<link rel="stylesheet" href="../../tokens/css/la-counter-void.css">
<style>html,body{margin:0}*{animation:none!important;transition:none!important;caret-color:transparent!important}#ui-kit-stage{position:absolute;left:0;top:0;width:390px;min-height:844px}</style></head>
<body class="la-root"><div id="ui-kit-stage">
<div class="la-ct" data-ui="la-counter-void" data-page="counter-void" data-variant="zero.dark" data-currency="AED" data-state="zero" data-state="done">
<div class="la-ct-bar" data-ui="la-counter-void.bar"><span>Counter</span><span class="la-ct-bar-user" data-ui="la-counter-void.user">c@x</span></div>
<div class="la-ct-main" data-ui="la-counter-void.main">
<div class="la-ct-h1" data-ui="la-counter-void.title">Undo bill</div>
<div class="la-ct-card is-done" data-ui="la-counter-void.result"><div class="la-ct-done-title" data-ui="la-counter-void.done-title">Bill undone</div><div class="la-ct-kv" data-ui="la-counter-void.done-reason">Reason: Wrong amount</div><div class="la-ct-line" data-ui="la-counter-void.taken-back">Points taken back: 0</div><div class="la-ct-line" data-ui="la-counter-void.balance">Balance now 0 points</div></div>
<div class="la-ct-btn is-mt" data-ui="la-counter-void.back">Back to counter</div>
</div>
</div>
</div></body></html>
