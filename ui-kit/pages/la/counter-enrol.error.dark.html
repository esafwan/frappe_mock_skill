<!doctype html>
<html lang="en" data-system="la" data-theme="dark">
<head><meta charset="utf-8"><title>Counter enrol member.error.dark</title>
<link rel="stylesheet" href="../../tokens/css/fonts.css">
<link rel="stylesheet" href="../../tokens/css/frappe-desk.css">
<link rel="stylesheet" href="../../tokens/css/la-desk-vars.css">
<link rel="stylesheet" href="../../tokens/css/la-desk-base.css">
<link rel="stylesheet" href="../../tokens/css/la-counter.css">
<link rel="stylesheet" href="../../tokens/css/la-counter-enrol.css">
<style>html,body{margin:0}*{animation:none!important;transition:none!important;caret-color:transparent!important}#ui-kit-stage{position:absolute;left:0;top:0;padding:0}</style></head>
<body class="la-root"><div id="ui-kit-stage" class="lce-stage" data-ui="la-counter-enrol" data-page="counter-enrol" data-variant="error.dark" data-currency="AED" data-state="error">
<header class="lce-bar" data-ui="la-counter-enrol.topbar"><span data-ui="la-counter-enrol.title">Counter</span></header>
<form class="lce-form" data-ui="la-counter-enrol.form">
<h1 class="lce-h" data-ui="la-counter-enrol.heading">Enrol member</h1>
<div class="lce-field" data-ui="la-counter-enrol.program"><label class="lce-label" data-ui="la-counter-enrol.program-label">Program</label><div class="lce-input is-select" data-ui="la-counter-enrol.program-input"><span class="lce-ph" data-ui="la-counter-enrol.program-placeholder"></span></div></div>
<div class="lce-field" data-ui="la-counter-enrol.name"><label class="lce-label" data-ui="la-counter-enrol.name-label">Name</label><div class="lce-input" data-ui="la-counter-enrol.name-input"><span class="lce-ph" data-ui="la-counter-enrol.name-placeholder"></span></div></div>
<div class="lce-field" data-ui="la-counter-enrol.mobile"><label class="lce-label" data-ui="la-counter-enrol.mobile-label">Mobile</label><div class="lce-input" data-ui="la-counter-enrol.mobile-input"><span class="lce-ph" data-ui="la-counter-enrol.mobile-placeholder"></span></div></div>
<div class="lce-field" data-ui="la-counter-enrol.birthday"><label class="lce-label" data-ui="la-counter-enrol.birthday-label">Birthday (optional)</label><div class="lce-input" data-ui="la-counter-enrol.birthday-input"><span class="lce-ph" data-ui="la-counter-enrol.birthday-placeholder">dd/mm/yyyy</span><svg class="lce-cal" viewBox="0 0 16 16"><rect x="2" y="3" width="12" height="11" rx="1"/><path d="M2 6.5h12M5 1.5v3M11 1.5v3"/></svg></div></div>
<fieldset class="lce-consent" data-ui="la-counter-enrol.consent"><span class="lce-legend" data-ui="la-counter-enrol.consent-title">Consent</span>
<div class="lce-row" data-ui="la-counter-enrol.consent-service"><span class="lce-box" data-ui="la-counter-enrol.consent-service-box"></span><span data-ui="la-counter-enrol.consent-service-text">Loading notice...</span></div>
<div class="lce-row" data-ui="la-counter-enrol.consent-marketing"><span class="lce-box" data-ui="la-counter-enrol.consent-marketing-box"></span><span data-ui="la-counter-enrol.consent-marketing-text">Loading notice...</span></div>
</fieldset>
<div class="lce-err" data-ui="la-counter-enrol.error">Unexpected server response. Please retry.</div>
<div class="lce-submit is-disabled" data-ui="la-counter-enrol.submit" data-enabled="false">Enrol</div>
</form></div></body></html>
