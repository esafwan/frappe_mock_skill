<!doctype html>
<html lang="ar" data-system="la" data-theme="light" dir="rtl">
<head><meta charset="utf-8"><title>Counter home.ar-AED</title>
<link rel="stylesheet" href="../../tokens/css/fonts.css">
<link rel="stylesheet" href="../../tokens/css/frappe-desk.css">
<link rel="stylesheet" href="../../tokens/css/la-desk-vars.css">
<link rel="stylesheet" href="../../tokens/css/la-desk-base.css">
<link rel="stylesheet" href="../../tokens/css/la-desk-components.css">
<link rel="stylesheet" href="../../tokens/css/la-desk-data.css">
<link rel="stylesheet" href="../../tokens/css/la-desk-components.css">
<style>html,body{margin:0}*{animation:none!important;transition:none!important;caret-color:transparent!important}#ui-kit-stage{position:absolute;left:0;top:0;width:390px;min-height:844px}#ui-kit-stage{padding:0!important}.lc-stack{display:flex;flex-direction:column;gap:12px}.lc-empty{background:var(--lc-surface)}.la-cshell-screen{display:block!important}</style><link rel="stylesheet" href="../../tokens/css/la-counter.css"></head>
<body class="la-root"><div id="ui-kit-stage">
<div class="la-cshell is-dark-topbar" data-ui="la-counter-home" data-page="counter-home" data-variant="ar-AED" data-currency="AED" data-state="populated" data-state="dark-topbar">
  <header class="la-cshell-bar" data-ui="la-counter-home.topbar"><span class="la-cshell-title" data-ui="la-counter-home.title">الكاشير</span><span class="la-cshell-badge" data-ui="la-counter-home.user-badge">c@x</span></header>
  <div class="la-cshell-body" data-ui="la-counter-home.body">
    <h1 class="la-cshell-screen" data-ui="la-counter-home.screen-title">الكاشير</h1>
    
    <div class="lc-stack" data-ui="la-counter-home.list"><div class="lc-card" data-ui="la-counter-home.card-find" data-state="default">
  <div class="lc-card-title" data-ui="la-counter-home.card-find-title">بحث / تسجيل عضو</div>
  <div class="lc-card-sub" data-ui="la-counter-home.card-find-subtitle">الجوال أو رمز البطاقة أو الاسم أو الرقم</div>
</div>
<div class="lc-card" data-ui="la-counter-home.card-scan" data-state="default">
  <div class="lc-card-title" data-ui="la-counter-home.card-scan-title">مسح البطاقة</div>
  <div class="lc-card-sub" data-ui="la-counter-home.card-scan-subtitle">اقرأ رمز QR الخاص بالعضو</div>
</div>
<div class="lc-card" data-ui="la-counter-home.card-bill" data-state="default">
  <div class="lc-card-title" data-ui="la-counter-home.card-bill-title">فاتورة جديدة</div>
  <div class="lc-card-sub" data-ui="la-counter-home.card-bill-subtitle">اختر العضو ثم تابع إلى الفاتورة</div>
</div></div>
  </div>
</div>

</div></body></html>
