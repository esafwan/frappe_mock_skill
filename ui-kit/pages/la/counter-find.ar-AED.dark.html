<!doctype html>
<html lang="ar" data-system="la" data-theme="dark" dir="rtl">
<head><meta charset="utf-8"><title>Counter find member.ar-AED.dark</title>
<link rel="stylesheet" href="../../tokens/css/fonts.css">
<link rel="stylesheet" href="../../tokens/css/frappe-desk.css">
<link rel="stylesheet" href="../../tokens/css/la-desk-vars.css">
<link rel="stylesheet" href="../../tokens/css/la-desk-base.css">
<link rel="stylesheet" href="../../tokens/css/la-desk-components.css">
<link rel="stylesheet" href="../../tokens/css/la-desk-data.css">
<link rel="stylesheet" href="../../tokens/css/la-desk-components.css">
<style>html,body{margin:0}*{animation:none!important;transition:none!important;caret-color:transparent!important}#ui-kit-stage{position:absolute;left:0;top:0;width:390px;min-height:844px}#ui-kit-stage{padding:0!important}.la-cshell-screen{display:block!important}</style><link rel="stylesheet" href="../../tokens/css/la-counter.css"><link rel="stylesheet" href="../../tokens/css/la-counter-pages.css"></head>
<body class="la-root"><div id="ui-kit-stage">
<div class="la-cshell is-dark-topbar" data-ui="la-counter-find" data-page="counter-find" data-variant="ar-AED.dark" data-state="found" data-state="dark-topbar">
  <header class="la-cshell-bar" data-ui="la-counter-find.topbar"><span class="la-cshell-title" data-ui="la-counter-find.title">الكاشير</span><span class="la-cshell-badge" data-ui="la-counter-find.user-badge">c@x</span></header>
  <div class="la-cshell-body" data-ui="la-counter-find.body">
    <h1 class="la-cshell-screen" data-ui="la-counter-find.screen-title">البحث عن عضو</h1>
    
    <div class="lc-page-stack" data-ui="la-counter-find.form"><div class="lc-label" data-ui="la-counter-find.lookup-label">البحث بواسطة</div><div class="lc-sel" data-ui="la-counter-find.lookup"><span data-ui="la-counter-find.lookup-value">تلقائي</span></div><div class="lc-field" data-ui="la-counter-find.query" data-state="filled">
  <label class="lc-label" data-ui="la-counter-find.query-label">الجوال أو رمز البطاقة أو الاسم أو الرقم</label>
  <div class="lc-input" data-ui="la-counter-find.query-input"><span class="lc-value" data-ui="la-counter-find.query-value">راشد ناير</span><span class="lc-ph" data-ui="la-counter-find.query-placeholder">أدخل الجوال أو رمز البطاقة</span></div>
  <div class="lc-error" data-ui="la-counter-find.query-error">أدخل الجوال أو رمز البطاقة أو الاسم أو الرقم</div>
</div><div class="lc-btn" data-ui="la-counter-find.find-btn" data-state="primary" data-size="md"><span data-ui="la-counter-find.find-btn-label">بحث</span></div><div class="lc-slide" data-ui="la-counter-find.result-slot"><div class="lc-result" data-ui="la-counter-find.result" data-state="found">
  <div class="lc-result-head">
    <div><div class="lc-result-name" data-ui="la-counter-find.result-name">راشد ناير</div><div class="lc-result-mobile" data-ui="la-counter-find.result-mobile">******0002</div></div>
    <div class="lc-bal"><div class="lc-bal-label" data-ui="la-counter-find.result-balance-label">الرصيد</div><div class="lc-bal-value la-num" data-ui="la-counter-find.result-balance">٧٢٤</div></div>
  </div>
  <div class="lc-chips"><span class="lc-chip is-amber" data-ui="la-counter-find.result-tier">بلاتيني</span><span class="lc-chip is-blue" data-ui="la-counter-find.result-pending">٤٥ معلّقة</span><span class="lc-chip is-red" data-ui="la-counter-find.result-expiring">٢١٥ تنتهي</span></div>
  <div class="lc-btn" data-state="primary" data-ui="la-counter-find.result-continue"><span data-ui="la-counter-find.result-continue-label">متابعة إلى الفاتورة</span></div>
  <div class="lc-result-none" data-ui="la-counter-find.result-not-found">لم يتم العثور على عضو</div>
  <div class="lc-skel" data-ui="la-counter-find.result-skeleton"><i></i><i></i><i></i></div>
</div></div></div>
  </div>
</div>

</div></body></html>
