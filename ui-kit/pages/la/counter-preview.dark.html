<!doctype html>
<html lang="en" data-system="la" data-theme="dark">
<head><meta charset="utf-8"><title>Counter preview.dark</title>
<link rel="stylesheet" href="../../tokens/css/fonts.css">
<link rel="stylesheet" href="../../tokens/css/frappe-desk.css">
<link rel="stylesheet" href="../../tokens/css/la-desk-vars.css">
<link rel="stylesheet" href="../../tokens/css/la-desk-base.css">
<link rel="stylesheet" href="../../tokens/css/la-desk-components.css">
<link rel="stylesheet" href="../../tokens/css/la-desk-data.css">
<link rel="stylesheet" href="../../tokens/css/la-desk-components.css">
<style>html,body{margin:0}*{animation:none!important;transition:none!important;caret-color:transparent!important}#ui-kit-stage{position:absolute;left:0;top:0;width:390px;min-height:844px}#ui-kit-stage{padding:0!important}.la-cshell-bill{line-height:20px;margin-block-end:15px}</style><link rel="stylesheet" href="../../tokens/css/la-counter.css"><link rel="stylesheet" href="../../tokens/css/la-counter-preview.css"></head>
<body class="la-root"><div id="ui-kit-stage">
<div class="la-cshell is-default" data-ui="la-counter-preview" data-page="counter-preview" data-variant="dark" data-currency="AED" data-state="populated" data-state="default">
  <header class="la-cshell-bar" data-ui="la-counter-preview.topbar"><span class="la-cshell-title" data-ui="la-counter-preview.title">Counter</span></header>
  <div class="la-cshell-body" data-ui="la-counter-preview.body">
    
    <div class="la-cshell-bill" data-ui="la-counter-preview.member">Bill for <b>Rashid Nair</b></div>
    <div class="lcp-card" data-ui="la-counter-preview.card"><div class="lcp-lbl" data-ui="la-counter-preview.bill-label">Bill</div><div class="lcp-val" data-ui="la-counter-preview.bill-amount">AED 125.00</div><div class="lcp-lbl" data-ui="la-counter-preview.points-label">Points earned</div><div class="lcp-val is-lg" data-ui="la-counter-preview.points">25</div></div>
<div class="lcp-stack" data-ui="la-counter-preview.actions"><div class="lc-btn" data-size="lg" data-ui="la-counter-preview.continue">Continue without redeeming</div><div class="lc-btn" data-size="lg" data-state="secondary" data-ui="la-counter-preview.redeem">Redeem points</div><div class="lc-btn" data-size="lg" data-state="secondary" data-ui="la-counter-preview.change">Change amount</div></div>
  </div>
</div>

</div></body></html>
