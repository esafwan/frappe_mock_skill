<!doctype html>
<html lang="en" data-system="la" data-theme="light">
<head><meta charset="utf-8"><title>Counter receipt.en-INR</title>
<link rel="stylesheet" href="../../tokens/css/fonts.css">
<link rel="stylesheet" href="../../tokens/css/frappe-desk.css">
<link rel="stylesheet" href="../../tokens/css/la-desk-vars.css">
<link rel="stylesheet" href="../../tokens/css/la-desk-base.css">
<link rel="stylesheet" href="../../tokens/css/la-desk-components.css">
<link rel="stylesheet" href="../../tokens/css/la-desk-data.css">
<link rel="stylesheet" href="../../tokens/css/la-desk-components.css">
<style>html,body{margin:0}*{animation:none!important;transition:none!important;caret-color:transparent!important}#ui-kit-stage{position:absolute;left:0;top:0;width:390px;min-height:844px}#ui-kit-stage{padding:0!important}.lc-stack{display:flex;flex-direction:column;gap:12px;padding-block-start:17px}</style><link rel="stylesheet" href="../../tokens/css/la-counter.css"><link rel="stylesheet" href="../../tokens/css/la-counter-receipt.css"></head>
<body class="la-root"><div id="ui-kit-stage">
<div class="la-cshell is-default" data-ui="la-counter-receipt" data-page="counter-receipt" data-variant="en-INR" data-currency="INR" data-state="populated" data-state="default">
  <header class="la-cshell-bar" data-ui="la-counter-receipt.topbar"><span class="la-cshell-title" data-ui="la-counter-receipt.title">Counter</span><span class="la-cshell-badge" data-ui="la-counter-receipt.user-badge">c@x</span></header>
  <div class="la-cshell-body" data-ui="la-counter-receipt.body">
    
    <div class="la-cshell-bill" data-ui="la-counter-receipt.bill-for">Bill for <b>Demo Member</b></div>
    <div class="lc-stack" data-ui="la-counter-receipt.content"><div class="lc-bill" data-ui="la-counter-receipt.card" data-state="booked" data-state="booked">
  <div class="lc-bill-title" data-ui="la-counter-receipt.card.heading">Bill booked</div>
  <div class="lc-bill-line lc-bill-amount" data-ui="la-counter-receipt.card.amount">₹250.00</div>
  <div class="lc-bill-line" data-ui="la-counter-receipt.card.earned">Earned 25 points</div>
  <div class="lc-bill-line" data-ui="la-counter-receipt.card.balance">Balance 145 points</div>
  <div class="lc-bill-note" data-ui="la-counter-receipt.card.note">No bill to show. Start a new bill.</div>
</div>
<div class="lc-btn" data-ui="la-counter-receipt.new" data-state="primary" data-size="lg"><span data-ui="la-counter-receipt.new.label">New bill</span></div></div>
  </div>
</div>

</div></body></html>
