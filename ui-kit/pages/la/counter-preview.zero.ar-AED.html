<html lang="ar" data-system="la" data-theme="light" dir="rtl">
<head><meta charset="utf-8"><title>Counter preview.zero.ar-AED</title>
<link rel="stylesheet" href="../../tokens/css/fonts.css">

<style>html,body{margin:0}*{animation:none!important;transition:none!important;caret-color:transparent!important}#ui-kit-stage{position:absolute;left:0;top:0;width:390px;min-height:844px}#ui-kit-stage{padding:0!important}.la-cshell-bill{line-height:20px;margin-block-end:15px}</style><link rel="stylesheet" href="../../tokens/css/la-counter.css"><link rel="stylesheet" href="../../tokens/css/la-counter-preview.css"></head>
<body class="la-root"><div id="ui-kit-stage">
<div class="la-cshell is-default" data-ui="la-counter-preview" data-page="counter-preview" data-variant="zero.ar-AED" data-currency="AED" data-state="zero" data-state="default">
  <header class="la-cshell-bar" data-ui="la-counter-preview.topbar"><span class="la-cshell-title" data-ui="la-counter-preview.title">الكاشير</span></header>
  <div class="la-cshell-body" data-ui="la-counter-preview.body">
    
    <div class="la-cshell-bill" data-ui="la-counter-preview.member">فاتورة <b>راشد ناير</b></div>

  </div>
</div>
