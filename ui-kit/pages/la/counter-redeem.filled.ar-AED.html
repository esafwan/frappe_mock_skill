<!doctype html>
<html lang="ar" data-system="la" data-theme="light" dir="rtl">
<head><meta charset="utf-8"><title>Counter redeem.filled.ar-AED</title>
<link rel="stylesheet" href="../../tokens/css/fonts.css">
<link rel="stylesheet" href="../../tokens/css/frappe-desk.css">
<link rel="stylesheet" href="../../tokens/css/la-desk-vars.css">
<link rel="stylesheet" href="../../tokens/css/la-desk-base.css">
<link rel="stylesheet" href="../../tokens/css/la-desk-components.css">
<link rel="stylesheet" href="../../tokens/css/la-desk-data.css">
<link rel="stylesheet" href="../../tokens/css/la-counter-base.css">
<style>html,body{margin:0}*{animation:none!important;transition:none!important;caret-color:transparent!important}#ui-kit-stage{position:absolute;left:0;top:0;width:390px;min-height:844px}.la-ct-ph{color:var(--la-ct-ph)}.la-ct-hint.is-err{color:var(--la-ct-danger)}.la-ct-field.is-error{border-color:var(--la-ct-danger);box-shadow:0 0 0 1px var(--la-ct-danger)}.la-ct-btn.is-disabled{opacity:.5}.la-ct-seg-opt{padding:6px 4px;min-height:58px}#ui-kit-stage .la-ct-field{height:56px}.la-ct-spacer.is-sp14{height:13px}#ui-kit-stage .la-ct-spacer:not(.is-sp14){height:46px}</style></head>
<body class="la-root"><div id="ui-kit-stage">
<div class="la-ct" data-ui="la-counter-redeem" data-page="counter-redeem" data-variant="filled.ar-AED" data-currency="AED" data-state="filled" data-method="qr">
<div class="la-ct-bar" data-ui="la-counter-redeem.bar"><span data-ui="la-counter-redeem.title">الكاونتر</span></div>
<div class="la-ct-main" data-ui="la-counter-redeem.main">
<div class="la-ct-sub" data-ui="la-counter-redeem.member">فاتورة <b>عضو تجريبي</b></div>
<div class="la-ct-label" data-ui="la-counter-redeem.heading">النقاط المراد استبدالها</div>
<div class="la-ct-field la-num" data-ui="la-counter-redeem.points"><span data-ui="la-counter-redeem.points-value">٥٠</span></div>
<div class="la-ct-hint" data-ui="la-counter-redeem.hint">حتى ١٠٠ نقطة، بقيمة د.إ ١٠.٠٠</div>
<div class="la-ct-spacer is-sp14"></div>
<div class="la-ct-label is-sm" data-ui="la-counter-redeem.approved-by">تمت الموافقة بواسطة</div>
<div class="la-ct-seg" data-ui="la-counter-redeem.approver"><div class="la-ct-seg-opt is-on" data-ui="la-counter-redeem.approver-qr" role="button">مسح بطاقة QR</div><div class="la-ct-seg-opt" data-ui="la-counter-redeem.approver-otp" role="button">رمز العضو</div><div class="la-ct-seg-opt" data-ui="la-counter-redeem.approver-pin" role="button">رمز المدير</div></div>
<div class="la-ct-field is-ph is-mt8" data-ui="la-counter-redeem.card-scan">مسح البطاقة</div>
<div class="la-ct-spacer"></div>
<div class="la-ct-stack"><div class="la-ct-btn is-primary" data-ui="la-counter-redeem.review">مراجعة</div><div class="la-ct-btn is-strong" data-ui="la-counter-redeem.skip">تخطي الاستبدال</div></div>
</div>
</div>
</div></body></html>
