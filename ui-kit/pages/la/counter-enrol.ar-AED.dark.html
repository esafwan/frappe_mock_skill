<!doctype html>
<html lang="ar" data-system="la" data-theme="dark" dir="rtl">
<head><meta charset="utf-8"><title>Counter enrol member.ar-AED.dark</title>
<link rel="stylesheet" href="../../tokens/css/fonts.css">
<link rel="stylesheet" href="../../tokens/css/frappe-desk.css">
<link rel="stylesheet" href="../../tokens/css/la-desk-vars.css">
<link rel="stylesheet" href="../../tokens/css/la-desk-base.css">
<link rel="stylesheet" href="../../tokens/css/la-counter.css">
<link rel="stylesheet" href="../../tokens/css/la-counter-enrol.css">
<style>html,body{margin:0}*{animation:none!important;transition:none!important;caret-color:transparent!important}#ui-kit-stage{position:absolute;left:0;top:0;padding:0}</style></head>
<body class="la-root"><div id="ui-kit-stage" class="lce-stage" data-ui="la-counter-enrol" data-page="counter-enrol" data-variant="ar-AED.dark" data-currency="AED" data-state="populated">
<header class="lce-bar" data-ui="la-counter-enrol.topbar"><span data-ui="la-counter-enrol.title">الكاشير</span></header>
<form class="lce-form" data-ui="la-counter-enrol.form">
<h1 class="lce-h" data-ui="la-counter-enrol.heading">تسجيل عضو</h1>
<div class="lce-field" data-ui="la-counter-enrol.program"><label class="lce-label" data-ui="la-counter-enrol.program-label">البرنامج</label><div class="lce-input is-select" data-ui="la-counter-enrol.program-input"><span data-ui="la-counter-enrol.program-value">مكافآت سوق النور الطازج</span><svg class="lce-chev" viewBox="0 0 12 12"><path d="M2 4l4 4 4-4"/></svg></div></div>
<div class="lce-field" data-ui="la-counter-enrol.name"><label class="lce-label" data-ui="la-counter-enrol.name-label">الاسم</label><div class="lce-input" data-ui="la-counter-enrol.name-input"><span data-ui="la-counter-enrol.name-value">يوسف الهاشمي</span></div></div>
<div class="lce-field" data-ui="la-counter-enrol.mobile"><label class="lce-label" data-ui="la-counter-enrol.mobile-label">الجوال</label><div class="lce-input" data-ui="la-counter-enrol.mobile-input"><span data-ui="la-counter-enrol.mobile-value">+00000000003</span></div></div>
<div class="lce-field" data-ui="la-counter-enrol.birthday"><label class="lce-label" data-ui="la-counter-enrol.birthday-label">تاريخ الميلاد (اختياري)</label><div class="lce-input" data-ui="la-counter-enrol.birthday-input"><span class="lce-ph" data-ui="la-counter-enrol.birthday-placeholder">يوم/شهر/سنة</span><svg class="lce-cal" viewBox="0 0 16 16"><rect x="2" y="3" width="12" height="11" rx="1"/><path d="M2 6.5h12M5 1.5v3M11 1.5v3"/></svg></div></div>
<fieldset class="lce-consent" data-ui="la-counter-enrol.consent"><span class="lce-legend" data-ui="la-counter-enrol.consent-title">الموافقة</span>
<div class="lce-row" data-ui="la-counter-enrol.consent-service"><span class="lce-box is-on" data-ui="la-counter-enrol.consent-service-box"></span><span data-ui="la-counter-enrol.consent-service-text">السماح برسائل الخدمة (الإيصالات وتحديثات الرصيد)</span></div>
<div class="lce-row" data-ui="la-counter-enrol.consent-marketing"><span class="lce-box is-on" data-ui="la-counter-enrol.consent-marketing-box"></span><span data-ui="la-counter-enrol.consent-marketing-text">السماح بالعروض عبر واتساب والرسائل</span></div>
</fieldset>

<div class="lce-submit" data-ui="la-counter-enrol.submit" data-enabled="true">تسجيل</div>
</form></div></body></html>
